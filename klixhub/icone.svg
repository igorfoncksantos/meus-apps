<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Klix Hub">
  <title>Klix Hub</title>
  <defs>
    <!-- o espresso ganha um respiro de luz no alto: o chapado puro fica morto
         no tamanho de ícone, e isso some antes de virar enfeite -->
    <radialGradient id="fundo" cx="50%" cy="34%" r="78%">
      <stop offset="0%"  stop-color="#2A2420"/>
      <stop offset="62%" stop-color="#1E1B18"/>
      <stop offset="100%" stop-color="#151211"/>
    </radialGradient>
    <!-- o caramelo do manual, com a luz vindo do mesmo lado -->
    <linearGradient id="play" x1="18%" y1="8%" x2="82%" y2="96%">
      <stop offset="0%"  stop-color="#D9A67C"/>
      <stop offset="52%" stop-color="#BC8B63"/>
      <stop offset="100%" stop-color="#A2734E"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#fundo)"/>

  <!-- Triângulo na proporção medida do logo (larg/alt = 0,808).
       Os cantos são arredondados pelo traço de mesma cor com linejoin round —
       ponta afiada em ícone pequeno lasca e suja a silhueta.
       O centroide de um triângulo fica a 1/3 da base, então centralizar pela
       caixa joga ele pra esquerda aos olhos: o deslocamento de +17 corrige. -->
  <g transform="translate(17 0)">
    <path d="M 186 168 L 326 256 L 186 344 Z"
          fill="url(#play)" stroke="url(#play)" stroke-width="26"
          stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
