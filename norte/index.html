function jumpTo(iso){ if(!iso)return;
  if(!DB.days[iso]){ DB.days[iso]=buildNewDay(iso); }
  cur=iso; render(); }
function goToday(){ const iso=todayISO(); if(!DB.days[iso])DB.days[iso]=buildNewDay(iso); cur=iso; render(); }
async function newDay(){ closeMenu(); const iso=todayISO()>cur?todayISO():shiftISO(cur,1);
  if(DB.days[iso]&&!await uiConfirm(fmtBR(iso)+' já existe. Recriar do zero apaga o que tem lá. Continuar?',{title:'Recriar o dia?',ok:'Recriar',danger:true}))return;
  DB.days[iso]=buildNewDay(iso); cur=iso; render(); }
/* Migracao de uma vez so: as tres diarias que viviam no codigo viram
   recorrencias normais. So roda pra quem tem as categorias delas; pra
   qualquer outra pessoa nao acontece nada. */
function migrarDiariasFixas(){
  if(DB.migrouDiarias) return;
  DB.migrouDiarias = 1;
  DB.recurring = DB.recurring || [];
  const tem = id => (DB.cats||[]).some(c=>c.id===id);
  const jaTem = t => DB.recurring.some(e=>e.title===t);
  const add = e => { if(!tem(e.cat) || jaTem(e.title)) return; e.rid='r'+uid(); e.rec={type:'diario'}; e.recur='diária'; DB.recurring.push(e); };
  add({cat:'lever',title:'METAS',meta:'Cota de produção do dia · zera todo dia',prio:'max',goals:{posts:[0,1],stories:[0,4],ads:[0,2]}});
  add({cat:'lever',title:'Criativos do dia',meta:'Espelho da cota · 1 post · 4 stories · 2 ads',prio:null,cota:[0,7]});
  add({cat:'pessoal',title:'Beber 2 garrafas de água',meta:'',prio:null,subLabels:['Garrafa 1','Garrafa 2']});
}

function buildNewDay(iso){
  // pega o dia anterior mais recente
  const prevIso = Object.keys(DB.days).filter(k=>k<iso).sort().pop();
  const prev = prevIso?DB.days[prevIso]:null;
  /* nota fixada acompanha os dias, como a tarefa pendente ja fazia. O resto
     fica no dia em que foi escrito — e continua la. */
  const obs = ((prev&&prev.obs)||[]).map(notaDe).filter(o=>o.fix)
    .map(o=>({ t:o.t, dt:o.dt||iso, fix:true }));
  const tasks=[];
  // as diárias do usuário entram por DB.recurring, logo abaixo
  const [Y,M,D]=iso.split('-').map(Number); const wd=new Date(Y,M-1,D).getDay(); const dim=new Date(Y,M,0).getDate();
  (DB.recurring||[]).forEach(e=>{ const r=e.rec; if(!r)return; if(!CATS.find(c=>c.id===e.cat))return;
    let hit=false;
    if(r.type==='diario')hit=true;
    else if(r.type==='semanal')hit=(r.days||[]).includes(wd);
    else if(r.type==='mensal')hit=(D===Math.min(r.dom||1,dim));
    else if(r.type==='anual'&&r.date){ const [rm,rd]=r.date.split('-').map(Number); const dd=(rm===M&&rd>dim)?dim:rd; hit=(M===rm&&D===dd); }
    if(!hit)return;
    const nt={id:uid(),rid:e.rid,cat:e.cat,title:e.title,meta:e.meta||'',status:'pend',prio:e.prio||null,recur:e.recur||recLabel(r),rec:r};
    if(e.goals)nt.goals=JSON.parse(JSON.stringify(e.goals));
    if(e.cota)nt.cota=[0,e.cota[1]];
    if(e.subLabels)nt.subs=e.subLabels.map(l=>({label:l,done:false}));
    tasks.push(nt);
  });
  // carry-over do dia anterior
  if(prev){ prev.tasks.forEach(t=>{
    if(t.recur==='diária') return;                 // diárias já recriadas
    if(t.rid) return;                              // recorrências do usuário já recriadas acima
    if(t.status==='done'||t.status==='canc') return; // feitas/canceladas ficam pra trás
    const nt=JSON.parse(JSON.stringify(t)); nt.id=uid();
    if(t.prio) nt.prio=null;                        // prioridade é do dia (METAS é exceção, mas ela é diária)
    if(t.status!=='sched'){ nt.carriedFrom=fmtBR(prevIso); nt.status = t.status==='adiado'?'adiado':'pend'; }
    // subtarefas: mantém progresso? regra: carrega o progresso
    tasks.push(nt);
  }); }
  activateSchedTasks(tasks, iso);   // se hoje for o dia programado de alguma agendada, ela ja nasce ativa
  return {tasks, obs};
}

  if(!cats.length){ uiAlert('Nada pra compartilhar neste dia ainda.'); return; }
  const rows = cats.map(c=>`<label class="chkrow"><input type="checkbox" class="shcat" value="${c.id}" checked onchange="shSync()"><span class="dot" style="background:${c.color}"></span>${escapeHtml(c.name)}</label>`).join('');
  sheet(`<h3>O que você quer compartilhar?</h3>
    <label class="chkrow" style="border-bottom:2px solid var(--line)"><input type="checkbox" id="shAll" checked onchange="shToggleAll(this)"><b>Tudo</b></label>
    ${rows}
    <div class="actions" style="margin-top:14px"><button class="btn-ghost" onclick="closeSheet()">Cancelar</button><button class="btn-primary" onclick="doShare()">Compartilhar</button></div>`);
}
function shToggleAll(el){ document.querySelectorAll('.shcat').forEach(x=>x.checked=el.checked); }
function shSync(){ const all=[...document.querySelectorAll('.shcat')]; document.getElementById('shAll').checked = all.every(x=>x.checked); }
let _shareIds=[];
function doShare(){ const ids=[...document.querySelectorAll('.shcat:checked')].map(x=>x.value);
  if(!ids.length){ uiAlert('Selecione ao menos uma categoria.'); return; }
  _shareIds=ids; closeSheet(); askSharePerm();
}
function askSharePerm(){ sheet(`<h3>Quem receber vai poder editar?</h3>
  <p style="font-size:13px;color:var(--mut);margin:-6px 0 16px">Isso decide como a pessoa abre o dia que você mandar.</p>
  <div class="act-list">
    <button onclick="finishShare(true)"><span class="ic">✏️</span>Pode editar</button>
    <button onclick="finishShare(false)"><span class="ic">🔒</span>Não pode editar (só ver)</button>
  </div>
  <div class="actions"><button class="btn-ghost" onclick="closeSheet()">Cancelar</button></div>`);
}
function finishShare(canEdit){ closeSheet();
  const payload=buildSharePayload(_shareIds); payload.edit=!!canEdit;
  const url = location.href.split('#')[0] + '#s=' + enc(payload);
  if(navigator.share){ navigator.share({title:'Meu dia — '+fmtBR(cur), url}).catch(()=>{}); return; }
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(()=>uiAlert((canEdit?'Link (editável)':'Link (só ver)')+' copiado! Envie pra quem quiser.'),()=>shareFallback(url)); return; }
  shareFallback(url);
}
function buildSharePayload(ids){
  const cats = CATS.filter(c=>ids.includes(c.id)).map(c=>({ name:c.name, color:c.color,
    tasks: day().tasks.filter(t=>t.cat===c.id).sort((a,b)=>sortKey(a)-sortKey(b)) }));
  return { date:cur, from:'', cats, obs:(day().obs||[]) };
}
function enc(obj){ return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function dec(str){ str=str.replace(/-/g,'+').replace(/_/g,'/'); return JSON.parse(decodeURIComponent(escape(atob(str)))); }
function shareFallback(url){ sheet(`<h3>Link do dia</h3>
  <div class="field"><label>Copie e envie pra quem quiser abrir</label><textarea readonly onclick="this.select()" style="min-height:120px;font-size:12px;word-break:break-all">${escapeHtml(url)}</textarea></div>
  <div class="actions"><button class="btn-primary" onclick="copyShare(this)">Copiar link</button><button class="btn-ghost" onclick="closeSheet()">Fechar</button></div>`); }
function copyShare(btn){ const ta=btn.closest('.sheet').querySelector('textarea'); ta.select();
  try{ document.execCommand('copy'); btn.textContent='Copiado ✓'; }catch(e){ uiAlert('Selecione o texto e copie.'); } }

function showShared(p){
  const mk={done:'✅',pend:'⬜',canc:'✖',sched:'🗓',adiado:'⏸'};
  let body=`<div style="max-width:820px;margin:0 auto;padding:14px 12px calc(30px + env(safe-area-inset-bottom))">
    <div style="background:var(--accbg);border:1px solid var(--accline);border-radius:12px;padding:12px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <div style="font-size:13px;color:var(--accent);font-weight:800">📤 Dia compartilhado com você</div>
      <div style="flex:1"></div>
      <button class="navbtn" style="background:var(--accent);color:var(--onacc);border:none;padding:0 14px" onclick="importShared()">Importar pro meu app</button>
      <button class="navbtn" onclick="closeShared()">Meu app</button>
    </div>
    <header style="border-bottom:3px solid var(--accent);padding-bottom:14px;margin-bottom:16px;text-align:center">
      <div style="font-size:22px;font-weight:800;letter-spacing:4px;text-transform:uppercase;color:var(--accent)">Norte</div>
      <h1 style="font-size:22px;color:var(--txt2);margin-top:5px">${longDate(p.date)}</h1></header>`;
  (p.cats||[]).forEach(c=>{
    body+=`<div class="cat"><div class="chead"><span class="cbar" style="background:${c.color}"></span><span class="cname">${escapeHtml(c.name)}</span></div>`;
    (c.tasks||[]).forEach(t=>{
      body+=`<div class="item ${t.status==='done'?'done':''}" style="border-left-color:${c.color}"><div class="box"></div><div class="txt"><div class="t">${escapeHtml(t.title)}</div>`;
      if(t.meta)body+=`<div class="m">${escapeHtml(t.meta)}</div>`;
      if(t.goals)body+=`<div class="m">Posts ${t.goals.posts[0]}/${t.goals.posts[1]} · Stories ${t.goals.stories[0]}/${t.goals.stories[1]} · Ads ${t.goals.ads[0]}/${t.goals.ads[1]}</div>`;
      if(t.cota)body+=`<div class="m">${t.cota[0]}/${t.cota[1]}</div>`;
      if(t.subs&&t.subs.length)body+=`<div class="subs">`+t.subs.map(s=>`<div class="sub ${s.done?'sdone':''}"><span class="sbox"></span>${escapeHtml(s.label)}</div>`).join('')+`</div>`;
      body+=`</div><span class="tag ${t.status}">${mk[t.status]||''}</span></div>`;
    });
    body+='</div>';
  });
  if(p.obs&&p.obs.length){ body+=`<div class="obs"><div class="obs-h"><span class="cbar"></span>🖋️ Notas</div><div class="obs-box">`+p.obs.map(o=>`<div class="oi">${escapeHtml(o)}</div>`).join('')+`</div></div>`; }
  body+='</div>';
  document.body.innerHTML=body; window.__shared=p;
}
async function importShared(){ const p=window.__shared; if(!p)return;
  const tasks=[];
  (p.cats||[]).forEach(c=>{ let cat=CATS.find(x=>x.name===c.name);
    if(!cat){ let id=slug(c.name); while(CATS.some(k=>k.id===id))id+='x'; cat={id,name:c.name,color:c.color}; CATS.push(cat); }
    (c.tasks||[]).forEach(t=>{ const nt=JSON.parse(JSON.stringify(t)); nt.id=uid(); nt.cat=cat.id; tasks.push(nt); });
  });
  if(!DB.days[p.date])DB.days[p.date]=emptyDay();
  DB.days[p.date].tasks.push(...tasks);
  if(p.obs&&p.obs.length)DB.days[p.date].obs=(DB.days[p.date].obs||[]).concat(p.obs);
  save(); await uiAlert('Dia importado pro seu app ('+fmtBR(p.date)+').'); location.hash=''; location.reload();
}
function closeShared(){ location.hash=''; location.reload(); }
function openSharedEditable(p){
  if(!DB.days[p.date])DB.days[p.date]=emptyDay();
  (p.cats||[]).forEach(c=>{ let cat=CATS.find(x=>x.name===c.name);
    if(!cat){ let id=slug(c.name); while(CATS.some(k=>k.id===id))id+='x'; cat={id,name:c.name,color:c.color}; CATS.push(cat); }
    (c.tasks||[]).forEach(t=>{ const nt=JSON.parse(JSON.stringify(t)); nt.id=uid(); nt.cat=cat.id; DB.days[p.date].tasks.push(nt); }); });
  if(p.obs&&p.obs.length)DB.days[p.date].obs=(DB.days[p.date].obs||[]).concat(p.obs);

  render();
}

let _view='dia', _progMode='dia', _progOn={pct:true,count:true};
function switchView(v){ _view=v;
  const pv=document.getElementById('progView'), fab=document.querySelector('.fab');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.getAttribute('data-v')===v));

function setProgMode(m){ _progMode=m; renderProgress(); }
function toggleMetric(m){ _progOn[m]=!_progOn[m]; if(!_progOn.pct && !_progOn.count) _progOn[m]=true; renderProgress(); }
function dayCount(iso){ const dd=DB.days[iso]; if(!dd||!dd.tasks)return null; const c=dd.tasks.filter(t=>t.status!=='canc').length; return c||null; }
function dayValM(iso,metric){ return metric==='count'?dayCount(iso):dayPct(iso); }
function dayFrac(t,iso){
  if(t.status==='canc'||t.status==='adiado'||t.status==='sched') return null;
  if(t.rec && !recFiresOn(t.rec,iso)) return null;
  if(t.goals){ let d=0,tot=0; for(const k in t.goals){ d+=t.goals[k][0]; tot+=t.goals[k][1]; } return tot?d/tot:0; }
  if(t.cota){ return t.cota[1]? t.cota[0]/t.cota[1] : 0; }
  if(t.subs&&t.subs.length){ const dd=t.subs.filter(s=>s.done).length; return dd/t.subs.length; }
  return t.status==='done'?1:0;
}
function dayPct(iso){ const dd=DB.days[iso]; if(!dd||!dd.tasks) return null;
  let sum=0,n=0; dd.tasks.forEach(t=>{ const f=dayFrac(t,iso); if(f===null)return; sum+=f; n++; });
  return n? Math.round(sum/n*100) : null; }
function mondayOf(iso){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); const wd=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-wd); return dt; }
function pad2(n){ return String(n).padStart(2,'0'); }
/* a linha do grafico segue o teal do tema — no claro ele e mais fundo */
function corAcento(){ return (getComputedStyle(document.documentElement).getPropertyValue('--accent')||'#2FD9C9').trim(); }
const PCOL={ get pct(){ return corAcento(); }, count:'#22C55E' };
const BCOL={done:'#3DDB84', und:'#EF4444'};
function dayDoneUndone(iso){ const dd=DB.days[iso]; if(!dd||!dd.tasks) return null; let done=0,und=0;
  dd.tasks.forEach(t=>{ const f=dayFrac(t,iso); if(f===null)return; if(f>=1) done++; else und++; });
  return {done:done,und:und}; }
function progUnified(mode){
  const days=Object.keys(DB.days).filter(iso=>dayPct(iso)!==null||dayCount(iso)!==null).sort();
  if(!days.length) return [];
  if(mode==='dia') return days.slice(-14).map(iso=>{ const du=dayDoneUndone(iso)||{done:0,und:0}; return {label:iso.slice(8,10)+'/'+iso.slice(5,7), pct:dayPct(iso), count:dayCount(iso), done:du.done, und:du.und}; });
  const groups={};
  days.forEach(iso=>{ let key,label;
    if(mode==='sem'){ const dt=mondayOf(iso); key=dt.getFullYear()+'-'+pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate()); label=pad2(dt.getDate())+'/'+pad2(dt.getMonth()+1); }
    else { key=iso.slice(0,7); label=MES[+iso.slice(5,7)-1].slice(0,3); }
    if(!groups[key])groups[key]={pS:0,pN:0,cS:0,cN:0,dO:0,dU:0,label:label,key:key};
    const gp=groups[key], p=dayPct(iso), c=dayCount(iso), du=dayDoneUndone(iso);
    if(p!==null){ gp.pS+=p; gp.pN++; } if(c!==null){ gp.cS+=c; gp.cN++; } if(du){ gp.dO+=du.done; gp.dU+=du.und; } });
  return Object.keys(groups).sort().map(k=>groups[k]).slice(mode==='sem'?-10:-8)
    .map(g=>({label:g.label, pct:g.pN?Math.round(g.pS/g.pN):null, count:g.cN?Math.round(g.cS/g.cN):null, done:g.dO, und:g.dU}));
}
function chartSVG2(pts,showPct,showCount){
  const dual=showPct&&showCount;
  const W=340,H=205,padL=28,padR=dual?32:14,padT=18,padB=26, iw=W-padL-padR, ih=H-padT-padB, n=pts.length;
  const X=i=> n<=1? padL+iw/2 : padL+iw*i/(n-1);
  const barMax=Math.max.apply(null,[1].concat(pts.map(p=>Math.max(p.done||0,p.und||0))));
  const Yp=v=> padT+ih*(1-v/100), Yb=v=> padT+ih*(1-v/barMax);
  let g='';
  [0,.25,.5,.75,1].forEach(function(f){ var yy=padT+ih*(1-f);
    g+='<line x1="'+padL+'" y1="'+yy+'" x2="'+(W-padR)+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1"/>';
    var lc = showPct?PCOL.pct:BCOL.done, lv = showPct?Math.round(100*f):Math.round(barMax*f);
    g+='<text x="'+(padL-6)+'" y="'+(yy+3)+'" fill="'+lc+'" font-size="8.5" text-anchor="end">'+lv+'</text>';
    if(dual) g+='<text x="'+(W-padR+6)+'" y="'+(yy+3)+'" fill="'+BCOL.done+'" font-size="8.5" text-anchor="start">'+Math.round(barMax*f)+'</text>'; });
  /* barras feitas / não feitas (= métrica "Nº de tarefas") */
  if(showCount){
    var slot = n>1? iw/(n-1) : iw;
    var bw = Math.max(3, Math.min(11, slot*0.30));
    var gap = Math.max(1.5, bw*0.30);
    var op = dual?0.5:0.85;
    var loX=padL+1, hiX=W-padR-1;
    pts.forEach(function(p,i){ var cx=X(i), base=padT+ih;
      var d=p.done||0, u=p.und||0;
      var xd=cx-gap/2-bw, xu=cx+gap/2;
      /* mantém o par dentro da área — não invade os eixos (primeira/última coluna) */
      if(xd<loX){ var sh=loX-xd; xd+=sh; xu+=sh; }
      if(xu+bw>hiX){ var sh2=(xu+bw)-hiX; xd-=sh2; xu-=sh2; }
      var hd=base-Yb(d), hu=base-Yb(u);
      g+='<rect x="'+xd+'" y="'+Yb(d)+'" width="'+bw+'" height="'+Math.max(0,hd)+'" rx="1.6" fill="'+BCOL.done+'" opacity="'+op+'"/>';
      g+='<rect x="'+xu+'" y="'+Yb(u)+'" width="'+bw+'" height="'+Math.max(0,hu)+'" rx="1.6" fill="'+BCOL.und+'" opacity="'+op+'"/>';
      if(n<=10){
        if(d) g+='<text x="'+(xd+bw/2)+'" y="'+(Yb(d)-3)+'" fill="'+BCOL.done+'" font-size="8" font-weight="700" text-anchor="middle">'+d+'</text>';
        if(u) g+='<text x="'+(xu+bw/2)+'" y="'+(Yb(u)-3)+'" fill="'+BCOL.und+'" font-size="8" font-weight="700" text-anchor="middle">'+u+'</text>';
      }
    });
  }
  pts.forEach((p,i)=>{ g+='<text x="'+X(i)+'" y="'+(padT+ih+15)+'" fill="var(--mut)" font-size="8" text-anchor="middle">'+p.label+'</text>'; });
  function line(getV,Yf,color,area,labels){
    const segs=[]; let seg=[];
    pts.forEach((p,i)=>{ const v=getV(p); if(v===null||v===undefined){ if(seg.length){segs.push(seg);seg=[];} } else seg.push([X(i),Yf(v),v]); });
    if(seg.length)segs.push(seg);
    let s='';
    if(area) segs.forEach(sg=>{ if(sg.length<2)return; let d='M '+sg[0][0]+' '+sg[0][1]; for(let k=1;k<sg.length;k++)d+=' L '+sg[k][0]+' '+sg[k][1]; d+=' L '+sg[sg.length-1][0]+' '+(padT+ih)+' L '+sg[0][0]+' '+(padT+ih)+' Z'; s+='<path d="'+d+'" fill="url(#pgrad)"/>'; });
    segs.forEach(sg=>{ if(sg.length>1) s+='<polyline points="'+sg.map(q=>q[0]+','+q[1]).join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'; });
    segs.forEach(sg=>sg.forEach(q=>{ s+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="3.2" fill="'+color+'" stroke="var(--panel)" stroke-width="1.5"/>'; if(labels && n<=10) s+='<text x="'+q[0]+'" y="'+(q[1]-8)+'" fill="var(--txt2)" font-size="9" font-weight="700" text-anchor="middle">'+q[2]+'</text>'; }));
    return s;
  }
  if(showPct) g+=line(p=>p.pct, Yp, PCOL.pct, !showCount, !showCount);

}
function metricStats(key,pts){ const vals=pts.map(p=>p[key]).filter(v=>v!==null&&v!==undefined);
  return { avg: vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0, best: vals.length?Math.max.apply(null,vals):0 }; }
function progWords(mode){ return mode==='sem'?{u:'semana',us:'semanas',win:'nas últimas'}:mode==='mes'?{u:'mês',us:'meses',win:'nos últimos'}:{u:'dia',us:'dias',win:'nos últimos'}; }
function progTrend(vals,thr){ const a=vals.filter(v=>v!==null&&v!==undefined); if(a.length<2)return null;
  const h=Math.max(1,Math.floor(a.length/2)); const f=a.slice(0,h), s=a.slice(a.length-h);
  const af=f.reduce((x,y)=>x+y,0)/f.length, as=s.reduce((x,y)=>x+y,0)/s.length; const d=as-af;
  return d>thr?'up':(d<-thr?'down':'flat'); }
function progSummary(pts,showPct,showCount,mode){
  if(!pts.length) return '';
  const W=progWords(mode); const n=pts.length; let ps=[];
  const tw=(dir,up,down)=> dir==='up'?'<span class="up">'+up+'</span>':dir==='down'?'<span class="down">'+down+'</span>':'<span class="flat">estável</span>';
  if(showPct){
    const s=metricStats('pct',pts), vals=pts.map(p=>p.pct), t=progTrend(vals,3);
    const last=vals.slice().reverse().find(v=>v!==null&&v!==undefined);
    ps.push('<p>Conclusão média de <b>'+s.avg+'%</b> por '+W.u+' '+W.win+' '+n+' '+W.us+(t?' — desempenho '+tw(t,'em alta','em queda'):'')+'. Melhor: <b>'+s.best+'%</b>'+(last!=null?' · '+(mode==='dia'?'hoje':mode==='sem'?'atual':'atual')+' <b>'+last+'%</b>':'')+'.</p>');
  }
  if(showCount){
    const td=pts.reduce((a,p)=>a+(p.done||0),0), tu=pts.reduce((a,p)=>a+(p.und||0),0), tot=td+tu;
    const rate=tot?Math.round(td/tot*100):0, t=progTrend(pts.map(p=>p.done),0.4);
    ps.push('<p><b>'+td+'</b> feitas e <b>'+tu+'</b> não feitas '+W.win+' '+n+' '+W.us+' — <b>'+rate+'%</b> de conclusão'+(t?', feitas '+tw(t,'em alta','em queda'):'')+'.</p>');
  }
  return '<div class="prog-sum"><div class="sh">'+svgIc('trending')+'Resumo</div>'+ps.join('')+'</div>';
}
function renderProgress(){
  const modes=[['dia','Diário'],['sem','Semanal'],['mes','Mensal']];

    '<div class="prog-top"><h2><span class="prog-hic">'+svgIc('trending')+'</span>Progresso</h2></div>'+
    '<div class="prog-seg prog-metric">'+metrics.map(mt=>'<button class="'+(mt[0]==='count'?'count ':'')+(_progOn[mt[0]]?'on':'')+'" onclick="toggleMetric(\''+mt[0]+'\')">'+mt[1]+'</button>').join('')+'</div>'+
    '<div class="prog-seg">'+modes.map(m=>'<button class="'+(_progMode===m[0]?'on':'')+'" onclick="setProgMode(\''+m[0]+'\')">'+m[1]+'</button>').join('')+'</div>'+
    (legend?'<div class="prog-legend">'+legend+'</div>':'')+

}

function mergeDB(a,b){ const out={days:{},cats:[],recurring:(a.recurring&&a.recurring.length?a.recurring:(b.recurring||[]))};
  const cm={}; [].concat(a.cats||[],b.cats||[]).forEach(c=>{ if(!cm[c.id])cm[c.id]=c; }); out.cats=Object.values(cm);
  const ds=new Set([].concat(Object.keys(a.days||{}),Object.keys(b.days||{})));
  ds.forEach(d=>{ const da=(a.days&&a.days[d])||{tasks:[],obs:[]}, db=(b.days&&b.days[d])||{tasks:[],obs:[]};

/* ===== PIN OPCIONAL (trava local, 4 dígitos, só números) ===== */
/* ---------- desbloqueio por digital / rosto (WebAuthn) ----------
   Mesma credencial dos outros 4 apps: todos vivem na mesma origem.
   NAO substitui o PIN -- o PIN fica de reserva pra aparelho novo, sensor
   falhando ou dados do site limpos. E uma tranca LOCAL, do mesmo nivel do
   PIN (nada e conferido num servidor): o ganho e conveniencia, nao blindagem. */
const BIOK='meusapps-bio';
let _bioAuto=false;
function bioApple(){ try{ return /iPad|iPhone|iPod/.test(navigator.userAgent)||(/Mac/.test(navigator.userAgent)&&'ontouchend' in document); }catch(e){ return false; } }
function bioNome(){ return bioApple()?'Face ID / Touch ID':'digital'; }
function bioDados(){ try{ return JSON.parse(localStorage.getItem(BIOK)||'null'); }catch(e){ return null; } }
function bioLigada(){ const d=bioDados(); return !!(d&&d.id); }
async function bioSuportado(){ try{
    if(!window.isSecureContext||!window.PublicKeyCredential||!navigator.credentials||!navigator.credentials.create) return false;
    return !!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());
  }catch(e){ return false; } }
function _b64u(buf){ const a=new Uint8Array(buf); let t=''; for(let i=0;i<a.length;i++)t+=String.fromCharCode(a[i]);
  return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function _unb64u(v){ v=String(v).replace(/-/g,'+').replace(/_/g,'/'); while(v.length%4)v+='=';
  const b=atob(v),a=new Uint8Array(b.length); for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i); return a.buffer; }
function _rnd(n){ return crypto.getRandomValues(new Uint8Array(n)); }
async function bioRegistrar(){
  const c=await navigator.credentials.create({publicKey:{
    challenge:_rnd(32), rp:{name:'Meus Apps'},
    user:{id:_rnd(16),name:(localStorage.getItem('norte-login')||'local'),displayName:'Desbloqueio'},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},
    timeout:60000, attestation:'none'}});
  if(!c||!c.rawId) throw new Error('sem credencial');
  localStorage.setItem(BIOK, JSON.stringify({id:_b64u(c.rawId),em:Date.now()}));
  return true; }
async function bioVerificar(){
  const d=bioDados(); if(!d||!d.id) return false;
  const c=await navigator.credentials.get({publicKey:{
    challenge:_rnd(32),
    allowCredentials:[{type:'public-key',id:_unb64u(d.id),transports:['internal']}],
    userVerification:'required', timeout:60000}});
  return !!c; }
async function bioEntrar(auto){
  const b=document.getElementById('bioBtn'); if(b)b.classList.add('go');
  let ok=false; try{ ok=await bioVerificar(); }catch(e){ ok=false; }
  if(ok){ markSession(); closeAuth(); return; }
  if(b)b.classList.remove('go');
  if(!auto) authErr('Nao reconheceu. Tente de novo ou use o PIN.'); }
async function bioLinha(){
  const r=document.getElementById('bioRow'); if(!r)return;
  if(!(await bioSuportado())){ r.innerHTML='<div class="bio-note">Este aparelho nao oferece desbloqueio por digital ou rosto neste navegador.</div>'; return; }
  r.innerHTML = bioLigada()
    ? '<button class="del" onclick="bioDesligar()"><span class="ic">'+svgIc('bio')+'</span>Desativar '+bioNome()+'</button>'
    : '<button onclick="bioLigar()"><span class="ic">'+svgIc('bio')+'</span>Ativar desbloqueio por '+bioNome()+'</button>'; }
async function bioLigar(){ try{ await bioRegistrar(); toast('Desbloqueio por '+bioNome()+' ativado'); bioLinha(); }
  catch(e){ authErr('Nao deu pra ativar. Confira se este aparelho tem digital ou rosto configurado.'); } }
function bioDesligar(){ localStorage.removeItem(BIOK); toast('Desbloqueio por '+bioNome()+' desativado'); bioLinha(); }

let _pin='', _pinMode='', _pinTmp='';
function pinTitles(m){ return ({
  unlock:['Digite seu PIN',''], set1:['Criar PIN','Escolha um PIN de 4 dígitos'], set2:['Confirmar PIN','Repita o PIN'],
  chgcur:['PIN atual','Digite seu PIN atual'], chgnew:['Novo PIN','Escolha o novo PIN'], chgconf:['Confirmar','Repita o novo PIN'],
  offcur:['Desativar PIN','Digite seu PIN pra desativar'] })[m] || ['PIN','']; }
function pinDotsHtml(){ let s=''; for(let i=0;i<4;i++) s+='<span class="pdot'+(i<_pin.length?' on':'')+'"></span>'; return s; }
function pinKeypadHtml(){ let k=''; ['1','2','3','4','5','6','7','8','9','x','0','back'].forEach(function(d){
    if(d==='x') k+='<span class="pkey empty"></span>';
    else if(d==='back') k+='<button class="pkey pkb" onclick="pinBack()">⌫</button>';
    else k+='<button class="pkey" onclick="pinTap(\''+d+'\')">'+d+'</button>'; }); return k; }
function showPin(m){ _pinMode=m; _pin='';
  const bio=(m==='unlock'&&bioLigada()), t=bio?['Desbloquear','']:pinTitles(m);
  authScreen('<div class="auth-ic">'+svgIc(bio?'bio':'lock')+'</div><h2>'+t[0]+'</h2>'+(t[1]?'<p>'+t[1]+'</p>':'')+
    '<div class="pdots" id="pdots">'+pinDotsHtml()+'</div>'+
    '<div class="auth-err" id="authErr" style="min-height:15px"></div>'+
    (bio?'<button class="biobtn" id="bioBtn" onclick="bioEntrar()">'+svgIc('bio')+'<span>Usar '+bioNome()+'</span></button>':'')+
    '<div class="pkeypad">'+pinKeypadHtml()+'</div>'+
    (m==='unlock'?'':'<button class="auth-link" onclick="closeAuth()">Cancelar</button>'), {lock:m==='unlock'});
  /* tenta sozinha uma vez ao abrir; se o navegador exigir toque (Safari),
     o botao continua ali -- e o teclado do PIN tambem. */
  if(bio&&!_bioAuto){ _bioAuto=true; setTimeout(function(){ bioEntrar(true); },380); } }
/* aviso de toque no teclado do PIN: bolha + vibracao, e segurar apaga.
   A bolha mostra um PONTO, nunca o digito -- e um PIN. */
let _pinRep=null;
function _pinSolta(){ if(_pinRep){ clearTimeout(_pinRep); _pinRep=null; } }
function _pinBolha(el, txt){
  try{ if(navigator.vibrate) navigator.vibrate(8); }catch(x){}
  try{
    const r=el.getBoundingClientRect(); if(!r.width) return;
    const b=document.createElement('div'); b.className='pinpv'; b.textContent=txt;
    const al=el.offsetHeight||r.height;
    const la=Math.min(el.offsetWidth||r.width, al*1.15);
    let meio=r.left+r.width/2; const folga=la*0.66+4;
    if(meio<folga) meio=folga;
    if(meio>window.innerWidth-folga) meio=window.innerWidth-folga;
    b.style.left=meio+'px'; b.style.top=(r.top+r.height/2)+'px';
    b.style.width=la+'px'; b.style.height=al+'px';
    b.style.fontSize=getComputedStyle(el).fontSize;
    document.body.appendChild(b);
    setTimeout(function(){ try{ b.parentNode.removeChild(b); }catch(y){} }, 300);
  }catch(x){}
}
document.addEventListener('pointerdown', function(e){
  const t=e.target && e.target.closest && e.target.closest('.pkey');
  if(!t || t.classList.contains('empty')) return;
  const apaga=t.classList.contains('pkb');
  _pinBolha(t, apaga ? '⌫' : '•');
  if(!apaga) return;
  _pinSolta(); let n=0;
  _pinRep=setTimeout(function passo(){
    if(!_pin){ _pinSolta(); return; }
    pinBack(); n++;
    _pinRep=setTimeout(passo, n<4?90:60);
  }, 420);
});
['pointerup','pointercancel','touchend','touchcancel','mouseup'].forEach(function(ev){
  document.addEventListener(ev, _pinSolta);
});
function pinRefresh(){ const el=document.getElementById('pdots'); if(el)el.innerHTML=pinDotsHtml(); }
function pinBack(){ _pin=_pin.slice(0,-1); pinRefresh(); }
function pinTap(d){ if(_pin.length>=4)return; _pin+=d; pinRefresh(); if(_pin.length===4) setTimeout(pinDone,130); }
function pinErr(m){ _pin=''; pinRefresh(); authErr(m); const c=document.querySelector('.pdots'); if(c){ c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); } }
async function pinDone(){ const code=_pin; const h=await sha(code);
  if(_pinMode==='unlock'){ if(h===localStorage.getItem('norte-pin')){ markSession(); closeAuth(); } else pinErr('PIN incorreto'); }
  else if(_pinMode==='set1'){ _pinTmp=code; showPin('set2'); }
  else if(_pinMode==='set2'){ if(code===_pinTmp){ localStorage.setItem('norte-pin',h); markSession(); closeAuth(); toast('PIN ativado ✓'); } else { pinErr('Não conferiu'); setTimeout(function(){showPin('set1');},650); } }
  else if(_pinMode==='chgcur'){ if(h===localStorage.getItem('norte-pin')) showPin('chgnew'); else pinErr('PIN incorreto'); }
  else if(_pinMode==='chgnew'){ _pinTmp=code; showPin('chgconf'); }
  else if(_pinMode==='chgconf'){ if(code===_pinTmp){ localStorage.setItem('norte-pin',h); closeAuth(); toast('PIN alterado ✓'); } else { pinErr('Não conferiu'); setTimeout(function(){showPin('chgnew');},650); } }
  else if(_pinMode==='offcur'){ if(h===localStorage.getItem('norte-pin')){ localStorage.removeItem('norte-pin'); closeAuth(); toast('PIN desativado'); } else pinErr('PIN incorreto'); } }

async function doSignup(email,pw){ if(!sb){ authErr('Sem conexão. Tente de novo com internet.'); return; }
  try{ let r=await sb.auth.signUp({email:email,password:pw});
    if(r.error){ if(/registered|exists/i.test(r.error.message)){ r=await sb.auth.signInWithPassword({email:email,password:pw});
        if(r.error){ authErr('Esse e-mail já tem conta e a senha não confere. Use "Entrar" ou "Esqueci a senha".'); return; } }
      else { authErr(r.error.message); return; } }
    session=(r.data&&r.data.session)||null;
    if(!session){ const s=await sb.auth.signInWithPassword({email:email,password:pw}); session=(s.data&&s.data.session)||null; }
    if(!session){ authErr('Conta criada — confirme o e-mail e entre.'); return; }
    localStorage.setItem('norte-login',email); localStorage.setItem('norte-pwhash',await sha(pw)); localStorage.removeItem('norte-nag');
    markSession(); closeAuth(); subscribeRT(); await pullRemote(); toast('Conta criada ✓');
  }catch(e){ authErr('Erro: '+(e.message||e)); } }

async function unlockGo(){ const pw=val('lkPw'), email=localStorage.getItem('norte-login');
  if(!pw){ authErr('Digite a senha.'); return; }
  if(sb){ try{ const r=await sb.auth.signInWithPassword({email:email,password:pw});

async function recoveryGo(){ const a=val('rcPw'),b=val('rcPw2'); if(a.length<6){ authErr('Mínimo 6 caracteres.'); return; } if(a!==b){ authErr('Não confere.'); return; }

async function removeAccountLocal(){
  const pw=await uiPrompt('Digite sua senha pra remover a proteção deste aparelho. O Norte volta ao modo local (sem sincronizar); seus dados continuam salvos aqui.',{type:'password',title:'Tirar a senha?',ok:'Tirar senha'});
  if(pw===null||pw==='')return;
  let ok=false; if(sb){ try{ const r=await sb.auth.signInWithPassword({email:localStorage.getItem('norte-login'),password:pw}); if(!r.error)ok=true; }catch(e){} }
  if(!ok && await sha(pw)===localStorage.getItem('norte-pwhash'))ok=true;
  if(!ok){ uiAlert('Senha incorreta.'); return; }
  try{ if(sb) await sb.auth.signOut(); }catch(e){}
  if(_rtChan){ try{ sb.removeChannel(_rtChan); }catch(e){} _rtChan=null; }
  session=null; localStorage.removeItem('norte-login'); localStorage.removeItem('norte-pwhash'); localStorage.removeItem('norte-syncedAt'); localStorage.setItem('norte-nag','1');
  closeAuth(); toast('Modo local ✓'); }

/* boot */
async function boot(){ applyTheme(localStorage.getItem('assist-theme')||'dark'); load(); paintIcons();
  const h=location.hash;
  if(h.indexOf('#s=')===0){ try{ const p=dec(h.slice(3));
      if(p.edit) openSharedEditable(p); else showShared(p);
      return;
    }catch(e){ /* link inválido → segue app normal */ }
  }
  render();
  await initSupa();
  if(sb) sb.auth.onAuthStateChange(function(ev,ses){ if(ses){ session=ses; if(ev==='SIGNED_IN') onSignedIn(); } });
  if(session){ onSignedIn(); }                                   /* já logado (sessão salva ou link do e-mail) -> sincroniza direto, sem pedir nada */
  else if(!localStorage.getItem('welcome-norte')){ document.getElementById('__welcome').classList.remove('hidden'); }
  else if(!localStorage.getItem('norte-nag') && !sessionStorage.getItem('norte-upseen')){ sessionStorage.setItem('norte-upseen','1'); setTimeout(showUpgrade,500); }
  maybeLockPin();
}
boot();
(function(){
  if(!('serviceWorker' in navigator) || location.protocol==='file:') return;
  var refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){ if(refreshing)return; refreshing=true; location.reload(); });
  function banner(reg){
    if(document.getElementById('__updbar')) return;
    var b=document.createElement('div'); b.id='__updbar';
    b.style.cssText='position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));transform:translate(-50%,14px);z-index:100000;display:flex;align-items:center;gap:11px;max-width:calc(100% - 24px);background:#12161b;color:#f0f2f4;border:1px solid rgba(255,255,255,.13);border-radius:16px;padding:10px 10px 10px 15px;box-shadow:0 16px 42px rgba(0,0,0,.55);font-family:system-ui,-apple-system,\'Segoe UI\',Arial,sans-serif;font-size:14px;font-weight:700;opacity:0;transition:opacity .28s ease,transform .28s cubic-bezier(.34,1.4,.5,1)';
    b.innerHTML='<span>✨ Nova versão disponível</span><button id="__updbtn" style="border:none;cursor:pointer;font:inherit;font-weight:800;color:var(--onacc);background:var(--accent);border-radius:12px;padding:9px 15px">Atualizar</button>';
    document.body.appendChild(b);
    requestAnimationFrame(function(){ b.style.opacity='1'; b.style.transform='translate(-50%,0)'; });
    document.getElementById('__updbtn').onclick=function(){ this.textContent='Atualizando…'; this.disabled=true; if(reg.waiting){ reg.waiting.postMessage('SKIP_WAITING'); } else { location.reload(); } };
  }
  function watch(reg){
    if(reg.waiting && navigator.serviceWorker.controller) banner(reg);
    reg.addEventListener('updatefound',function(){ var nw=reg.installing; if(!nw) return;
      nw.addEventListener('statechange',function(){ if(nw.state==='installed' && navigator.serviceWorker.controller) banner(reg); }); });
    setInterval(function(){ reg.update().catch(function(){}); }, 60000);
    function _confere(){ reg.update().catch(function(){}); }
    document.addEventListener('visibilitychange',function(){ if(!document.hidden) _confere(); });
    window.addEventListener('focus', _confere);
    window.addEventListener('pageshow', _confere);
  }
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').then(watch).catch(function(){}); });
})();
</script>

<script>
/* __manterTela — ao recarregar (banner de atualizacao), volta pra mesma aba e posicao */
(function(){
  var K = "keep-tela-" + location.pathname;
  function abas(){
    var sel = ["nav .navbar button", "nav button", ".tabs .tb"];
    for (var i=0; i<sel.length; i++){
      var el = document.querySelectorAll(sel[i]);
      if (el && el.length > 1) return el;
    }
    return null;
  }
  function ativa(el){ return (" " + (el.className||"") + " ").indexOf(" on ") >= 0; }
  function salvar(){
    try{
      var st = { y: window.scrollY || window.pageYOffset || 0 };
      var a = abas();
      if (a) for (var i=0; i<a.length; i++){ if (ativa(a[i])) { st.aba = i; break; } }
      sessionStorage.setItem(K, JSON.stringify(st));
    }catch(e){}
  }
  window.addEventListener("pagehide", salvar);
  window.addEventListener("beforeunload", salvar);

  function restaurar(){
    var st = null;
    try{ st = JSON.parse(sessionStorage.getItem(K) || "null"); }catch(e){}
    if (!st) return;
    try{ sessionStorage.removeItem(K); }catch(e){}
    // a inicializacao de alguns apps roda depois; insiste ate a aba pegar
    var tentativas = 6;
    (function tentar(){
      var a = abas();
      if (a && typeof st.aba === "number" && a[st.aba] && !ativa(a[st.aba])) {
        try{ a[st.aba].click(); }catch(e){}
      }
      if (--tentativas > 0) { setTimeout(tentar, 250); return; }
      if (st.y) setTimeout(function(){ try{ window.scrollTo(0, st.y); }catch(e){} }, 120);
    })();
  }
  if (document.readyState === "loading")
    document.addEventListener("DOMContentLoaded", function(){ setTimeout(restaurar, 80); });
  else setTimeout(restaurar, 80);
})();
</script>
