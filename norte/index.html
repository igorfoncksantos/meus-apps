<style>

    --bg:#000; --panel:#121417; --panel2:#0e1013; --line:#262a2e; --line2:#23272b;

    --onacc:#04191a; --accbg:#0d1a1c; --accline:#1e3a40;
    --note-txt:#FDE68A; --note-txt2:#e9dba3; --note-line:#4a4326;

    --txt:#e8ebed; --txt2:#f0f2f4; --mut:#98a1a8; --mut2:#a4adb4;
    --accent:#2FD9C9; --green:#22c55e; --amber:#F0B45E; --orange:#F97316;

  }

  [data-theme="light"] .item.prio{ background:#fdf6e8; }

  [data-theme="light"] .item.adiado{ background:#eef3f8; }
  [data-theme="light"] .box{ border-color:#c3c8ce; }
  [data-theme="light"] .sub{ color:#4a525a; }

  [data-theme="light"] .legend{ background:#fff; }

  [data-theme="miri"] .rchip{ background:#e3efd9; color:#4a7a3d; border-color:#cfe0b8; }

  /* ===== TEMA NEON GLASS ===== */
  :root[data-theme="neon"]{
    --bg:#0a0f1c; --panel:rgba(255,255,255,.055); --panel2:rgba(255,255,255,.04);
    --line:rgba(255,255,255,.13); --line2:rgba(255,255,255,.08);
    --txt:#e6f3f1; --txt2:#f3fbfa; --mut:#93b0bd; --mut2:#b2c9d2;
    --accent:#2FD9C9; --green:#22c55e; --amber:#F0B45E; --orange:#F97316;
    --star:#FBBF24; --sched:#a99bf0; --canc:#f87171; --adia:#8fb3d9;
  }
  [data-theme="neon"] body,[data-theme="neon"] .progview{
    background:
      radial-gradient(58vw 58vw at -8% -6%, rgba(47,217,201,.30), transparent 60%),

  [data-theme="neon"] header{ border-bottom-color:rgba(47,217,201,.55); }

  [data-theme="neon"] .item.urgente{ background:rgba(239,68,68,.12); box-shadow:0 6px 20px rgba(0,0,0,.3), inset 0 0 0 1px rgba(239,68,68,.34), -7px 0 18px -10px var(--catcolor,#2FD9C9); }

    --accent:#2FD9C9; --green:#22c55e; --amber:#F0B45E; --orange:#F97316;
    --star:#FBBF24; --sched:#a99bf0; --canc:#f87171; --adia:#8fb3d9;
  }
  [data-theme="hud"] body,[data-theme="hud"] .progview{
    background:
      linear-gradient(rgba(47,217,201,.05) 1px,transparent 1px) 0 0/22px 22px,
      linear-gradient(90deg,rgba(47,217,201,.05) 1px,transparent 1px) 0 0/22px 22px,

  [data-theme="miri"] .wdopt.sel{ border-color:#c06a52; background:#f4e6df; color:#a6543c; }
  [data-theme="miri"] .recbtn,[data-theme="miri"] .rtype{ background:#F3EDE0; border-color:#DED2BC; color:#46423A; }
  [data-theme="miri"] .rtype.sel{ border-color:#c06a52; background:#f4e6df; color:#a6543c; }
  [data-theme="miri"] .recpanel{ border-color:#E3D9C7; }
  [data-theme="miri"] .calpop.inline{ background:#FBF7EE; }
  [data-theme="miri"] .btn-ghost{ background:#EFE7D8; color:#46423A; }
  [data-theme="miri"] .act-list button{ background:#F3EDE0; border-color:#E3D9C7; color:#46423A; }
  [data-theme="miri"] .calpop{ background:#FBF7EE; }
  [data-theme="miri"] .calpop .ch button{ background:#EFE7D8; border-color:#DED2BC; color:#46423A; }
  [data-theme="miri"] .calpop .cell{ color:#5E574A; }
  [data-theme="miri"] .calpop .cell.other{ color:#c3b8a2; }
  [data-theme="miri"] .calpop .cell:active{ background:#EFE7D8; }
  [data-theme="miri"] .obs-box{ background:#f7f0dc; border-color:#e4d6b0; }
  [data-theme="miri"] .oi{ color:#7a6a3a; }
  [data-theme="miri"] .obs-empty{ color:#b0a67e; }
  [data-theme="miri"] .chkrow{ color:#46423A; border-color:#E3D9C7; }
  [data-theme="miri"] footer{ color:#78715F; }

  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ background:var(--bg); }
  body{ font-family:"Segoe UI",Arial,sans-serif; color:var(--txt);
        padding:14px 12px calc(120px + env(safe-area-inset-bottom)); max-width:820px; margin:0 auto;
        -webkit-print-color-adjust:exact; print-color-adjust:exact; }

  /* ===== top toolbar ===== */
  .toolbar{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .navbtn{ background:#15181c; border:1px solid var(--line); color:var(--txt); border-radius:9px;
           height:40px; min-width:40px; padding:0 12px; font-size:15px; font-weight:700; cursor:pointer;
           display:flex; align-items:center; justify-content:center; gap:6px; }
  .navbtn:active{ transform:scale(.96); }
  .navbtn.today{ color:var(--accent); border-color:#1e3a40; }
  .datepill{ flex:1; text-align:center; font-size:13px; font-weight:700; color:var(--mut2); }
  .menu-wrap{ position:relative; }
  .menu{ position:absolute; right:0; top:48px; z-index:40; min-width:240px; padding:7px;
         background:rgba(18,21,25,.97); border:1px solid var(--line); border-radius:16px;
         box-shadow:0 20px 54px rgba(0,0,0,.62); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
         animation:menuPop .18s cubic-bezier(.2,.95,.3,1); transform-origin:top right; }
  @keyframes menuPop{ from{ opacity:0; transform:translateY(-8px) scale(.96); } to{ opacity:1; transform:none; } }
  .menu button{ display:flex; width:100%; align-items:center; gap:12px; background:none; border:none; color:var(--txt);
                font-size:14px; font-weight:600; padding:9px 10px; border-radius:12px; cursor:pointer; text-align:left;
                transition:background .16s ease, transform .1s ease; }
  .menu button:hover{ background:rgba(255,255,255,.055); }
  .menu button:active{ background:rgba(255,255,255,.09); transform:scale(.98); }
  .menu .mi{ width:32px; height:32px; flex-shrink:0; border-radius:9px; background:rgba(47,217,201,.13);
             display:inline-flex; align-items:center; justify-content:center; font-size:15px; }
  .menu button em{ font-style:normal; font-size:11px; font-weight:600; color:var(--mut); margin-left:auto; padding-left:8px; white-space:nowrap; }
  .menu .mdiv{ height:1px; background:var(--line); margin:6px 8px 4px; }
  .menu .mdel{ color:#ff6b7a; }
  .menu .mdel .mi{ background:rgba(239,68,68,.16); }
  .menu .mdel:hover{ background:rgba(239,68,68,.10); }
  .menu .mdel:active{ background:rgba(239,68,68,.18); }
  [data-theme="light"] .menu{ background:rgba(255,255,255,.98); }
  [data-theme="miri"] .menu{ background:rgba(251,247,238,.98); }
  .hidden{ display:none !important; }

  header{ border-bottom:3px solid var(--accent); padding-bottom:14px; margin-bottom:16px; text-align:center; }
  header .kicker{ font-size:22px; font-weight:800; letter-spacing:4px; text-transform:uppercase; color:var(--accent); }
  header h1{ font-size:22px; color:#fff; margin-top:5px; font-weight:700; }

  .bar{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .bar .count{ font-size:12px; color:var(--txt); font-weight:600; }
  .track{ flex:1; height:12px; background:#1c1f22; border-radius:20px; overflow:hidden; }
  .fill{ height:100%; background:var(--green); border-radius:20px; transition:width .4s cubic-bezier(.4,1.3,.5,1); }

  .legend{ display:flex; gap:9px; overflow-x:auto; padding:3px 2px 11px; margin-bottom:16px; -webkit-overflow-scrolling:touch; }
  .legend::-webkit-scrollbar{ height:0; }
  .legend .ci{ display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--mut2);
               white-space:nowrap; flex-shrink:0; padding:8px 13px; border-radius:20px; cursor:pointer;
               background:var(--panel); border:1px solid var(--line);
               transition:color .15s,transform .1s,border-color .15s,background .15s; }
  .legend .ci.on{ color:var(--txt2); border-color:var(--accent); }
  .legend .ci:active{ transform:scale(.96); }
  .legend .ci .cdot{ width:11px; height:11px; border-radius:50%; }
  .legend .ci.add{ color:var(--accent); font-weight:800; }
  [data-theme="light"] .legend .ci,[data-theme="miri"] .legend .ci{ background:#fff; border-color:rgba(0,0,0,.10); }
  [data-theme="light"] .legend .ci.on,[data-theme="miri"] .legend .ci.on{ border-color:var(--accent); }

  .secttl{ font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:1.2px; color:#c7ced3; margin:2px 0 12px; }
  /* tarefa cuja categoria foi apagada: aparece, em vez de sumir contando */
  .orfa-aviso{ font-size:12px; color:var(--mut); margin:-2px 0 9px 2px; line-height:1.45; }
  /* ===== subtarefa com quantidade (layout A) =====
     O rotulo precisa de min-width:0 pra encolher: sem isso o contador
     empurra um nome longo pra fora do cartao. */
  .sub .slab{ flex:1; min-width:0; }
  .sub .conta{ display:flex; align-items:center; gap:5px; flex-shrink:0; margin-left:auto; }
  /* o quadradinho e o ✕ tambem ficam alinhados com a PRIMEIRA linha do nome */
  .sub .sbox, .sub .conta, .sub .subdel{ margin-top:1px; }
  .sub .qb{ width:22px; height:22px; flex-shrink:0; border-radius:6px;
            border:1px solid var(--line2); background:var(--panel2); color:var(--accent);
            font-size:13px; font-weight:800; line-height:1; cursor:pointer;
            font-family:inherit; padding:0; }
  .sub .qb:active{ transform:scale(.86); }
  .sub .qb[disabled]{ opacity:.32; cursor:default; }
  .sub .qn{ font-size:11.5px; font-weight:700; color:var(--txt);
            font-variant-numeric:tabular-nums; text-align:center; min-width:36px; }
  /* concluida: o numero acompanha a linha, nao vira verde. Verde sobre fundo
     claro dava 2,28:1 — o estado ja e dito pelo quadradinho. */
  .sub.sdone .qn{ color:var(--mut); }
  /* o contador vem antes do ✕, entao o ✕ perde o margin-left:auto */
  .sub .conta + .subdel{ margin-left:0; }
  /* area de toque: o dedo precisa de 44px, o olho nao precisa ver isso */
  .box,.sub .sbox,.gbtn,.sub .qb,.cat .cadd,.legend .ci,.sub .subdel{ position:relative; }
  .box::before,.sub .sbox::before,.gbtn::after,.cat .cadd::after,.legend .ci::after,.sub .subdel::after{
    content:''; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:44px; height:44px; }
  /* os dois botoes do contador ficam a 5px um do outro, e a linha tem 22px de
     altura com 6px de vao: 44px invadiria a subtarefa vizinha. 34px e o maior
     que cabe sem encostar no que esta em volta. */
  .sub .qb::after{ content:''; position:absolute; left:50%; top:50%;
                   transform:translate(-50%,-50%); width:27px; height:28px; }
  /* onde ha contador, o ✕ tambem se encolhe pra propria celula: com os 44px
     de sempre ele cobria o botao "+" inteiro */
  .sub .conta ~ .subdel::after{ width:27px; height:28px; }
  /* o quadradinho de concluir cresce pra dentro do cartao, nunca pra fora */
  .box::before{ width:44px; height:42px; }
  .cat .cadd::after{ width:100%; min-width:44px; height:44px; }
  .legend .ci::after{ width:100%; height:44px; }
  .cat{ margin-bottom:18px; }
  .cat .chead{ display:flex; align-items:center; gap:9px; margin-bottom:9px; }
  .cat .cbar{ width:5px; height:17px; border-radius:3px; box-shadow:inset 0 0 0 1px rgba(128,128,128,.45); }
  /* o nome fica neutro; a cor da categoria vive na barra e no ponto */
  .cat .cname{ font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:var(--txt2); }
  .cat .cadd{ margin-left:auto; background:none; border:1px dashed #33383e; color:var(--mut2);
              font-size:11px; font-weight:700; border-radius:7px; padding:5px 10px; cursor:pointer; }
  .cat .cadd:active{ transform:scale(.95); }

  .item{ display:flex; align-items:flex-start; gap:12px; background:var(--panel); border:1px solid var(--line);
         border-left-width:4px; border-radius:12px; padding:13px 14px; margin-bottom:9px;
         box-shadow:0 3px 9px rgba(0,0,0,.34), 0 1px 2px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.06); }
  [data-theme="light"] .item,[data-theme="miri"] .item{ box-shadow:0 3px 8px rgba(23,37,60,.1), 0 1px 2px rgba(23,37,60,.06), inset 0 1px 0 #fff; }
  .item.done{ background:#0f1e17; }
  .item.priomax{ border-color:var(--orange)!important; background:#1b1108; box-shadow:0 3px 9px rgba(0,0,0,.34), inset 0 0 0 1px rgba(249,115,22,.28), inset 0 1px 0 rgba(255,255,255,.06); }
  .item.prio{ border-color:var(--amber)!important; background:#17140d; box-shadow:0 3px 9px rgba(0,0,0,.34), inset 0 0 0 1px rgba(240,180,94,.26), inset 0 1px 0 rgba(255,255,255,.06); }
  .item.canc{ background:#140d0e; }
  .item.canc .t{ color:#8a7f7f; text-decoration:none; }
  .item.blocked{ position:relative; }
  .item.blocked::after{ content:""; position:absolute; inset:0; background:var(--catcolor,#7a8288); opacity:.2;
                      border-radius:9px; pointer-events:none; }
  .item.blocked .box, .item.blocked .tag, .item.blocked .rchip{ position:relative; z-index:2; }  /* etiqueta/recorrencia acima da pelicula */
  .item.adiado{ opacity:.74; background:#0e1216; }
  .box{ flex-shrink:0; width:28px; height:28px; border-radius:50%; border:2.5px solid #3a3f45; margin-top:0;
        cursor:pointer; position:relative; transition:transform .12s; }
  .box:active{ transform:scale(.85); }
  .item.done .box{ background:var(--green); border-color:var(--green); }
  .item.done .box::after{ content:"✓"; color:#05130b; font-size:16px; font-weight:800; position:absolute;
    inset:0; display:grid; place-items:center; }
  .item.canc .box{ border-style:dashed; border-color:#5c2a2f; }
  .item.blocked .box{ border-style:dashed; border-color:#5a4fa0; }
  .schedtoday{ color:#b9a9f5!important; }
  .item.adiado .box{ border-style:dashed; border-color:#3a5570; }
  .txt{ flex:1; min-width:0; }
  .txt .t{ font-size:15px; font-weight:600; line-height:1.3; color:var(--txt2); }
  .txt .m{ font-size:11px; color:var(--mut); margin-top:3px; }
  /* uma so forma de etiqueta: pilula, 10px, borda de 1px. So a cor muda. */
  .pchip,.rchip{ display:inline-block; font-size:10px; font-weight:800; letter-spacing:.5px; text-transform:uppercase;
          padding:4px 9px; border-radius:20px; margin:0 5px 0 0; vertical-align:1px; line-height:14px; border:1px solid transparent; }
  .pchip{ color:#2a1206; background:var(--orange); border-color:var(--orange); }
  .pchip.star{ background:var(--star); color:#1a1204; }
  .pchip.urg{ background:#ef4444; color:#fff; }
  .item.urgente{ border-color:#ef4444!important; background:#1c0f0f; box-shadow:0 3px 9px rgba(0,0,0,.34), inset 0 0 0 1px rgba(239,68,68,.32), inset 0 1px 0 rgba(255,255,255,.06); }
  [data-theme="light"] .item.urgente{ background:#fdecec; }
  [data-theme="miri"] .item.urgente{ background:#f4e2e0; }
  .popt.sel.urg{ border-color:#ef4444; background:#1c0f0f; color:#ff8a8a; }
  .act-list button.prioA{ color:var(--star); border-color:#5a4620; background:#17140d; }
  .act-list button.prioA .ic svg{ stroke:var(--star); }
  .act-list button.prioB{ color:var(--orange); border-color:#5a3620; background:#1b1108; }
  .act-list button.prioB .ic svg{ stroke:var(--orange); }
  .act-list button.prioU{ color:#ff6b6b; border-color:#5c2a2f; background:#1c0f0f; font-weight:700; }
  .act-list button.prioU .ic svg{ stroke:#ff5252; }
  .rchip{ color:#7ee2b8; background:#0f2b1a; border-color:#1f5c37; }
  .cflag{ display:inline-block; font-size:9px; font-weight:700; letter-spacing:.3px; text-transform:uppercase; color:var(--mut2); margin:0 5px 0 0; }

  .subs{ margin-top:9px; display:flex; flex-direction:column; gap:6px; }
  .sub{ display:flex; align-items:flex-start; gap:9px; font-size:12px; color:#b7c0c6; cursor:pointer; }
  .sub .sbox{ width:18px; height:18px; border-radius:5px; border:2px solid #3a3f45; flex-shrink:0; transition:transform .12s; }
  .sub:active .sbox{ transform:scale(.82); }
  .sub.sdone .sbox{ background:var(--green); border-color:var(--green); position:relative; }
  .sub.sdone .sbox::after{ content:"✓"; color:#05130b; font-size:10px; font-weight:800; position:absolute; top:-2px; left:2px; }
  .sub.sdone{ color:var(--mut); }
  .sub .subdel{ margin-left:auto; color:var(--mut); font-size:12px; padding:0 4px; }
  .subadd{ display:inline-block; margin-top:9px; font-size:11px; font-weight:700; color:#6a8c85;
           border:1px dashed #2c4a45; border-radius:7px; padding:5px 11px; cursor:pointer; }
  .subadd:active{ transform:scale(.95); }
  @keyframes subIn{ from{ opacity:0; transform:translateX(-9px); } to{ opacity:1; transform:none; } }
  .sub.new, .subrow.new{ animation:subIn .34s cubic-bezier(.2,.9,.3,1); }
  .tbar{ display:flex; align-items:center; gap:9px; margin-top:8px; }
  .tbar .ttrack{ flex:1; max-width:200px; height:6px; background:#1c1f22; border-radius:20px; overflow:hidden; }
  .tbar .tfill{ height:100%; background:var(--green); border-radius:20px; transition:width .3s; }
  .tbar .tcount{ font-size:10px; color:var(--mut2); font-weight:700; }

  .tag{ float:right; margin-left:10px; flex-shrink:0; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.5px;
        padding:4px 9px; border-radius:20px; border:1px solid transparent; line-height:14px; margin-top:2px; cursor:pointer; }
  .tag.pend{ background:#2e2410; color:var(--amber); border:1px solid #5a4620; }
  .tag.done{ background:#0f2b1a; color:#7ee2b8; border:1px solid #1f5c37; }
  .tag.canc{ background:#2b1214; color:var(--canc); border:1px solid #5c2a2f; }
  .tag.sched{ background:#1a1533; color:var(--sched); border:1px solid #362c5c; }
  .tag.adiado{ background:#15202b; color:var(--adia); border:1px solid #2c4256; }

  /* METAS goals box */
  .goals-box{ background:#0d1417; border:1px solid #1e3a40; border-radius:9px; padding:12px 14px; margin-top:10px; }
  .gitem + .gitem{ margin-top:11px; }
  .gr{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .gr:last-child{ margin-bottom:0; }
  .gr .gname{ width:58px; flex-shrink:0; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--txt); }
  .gitem .gtrack{ height:6px; background:#16191c; border-radius:20px; overflow:hidden; }
  .gitem .gfill{ height:100%; background:var(--accent); border-radius:20px; transition:width .3s; }
  .gr .gnum{ flex:1; text-align:center; font-size:11px; font-weight:700; color:var(--txt); font-variant-numeric:tabular-nums; }
  .gbtn{ width:26px; height:26px; flex-shrink:0; border-radius:7px; border:1px solid #2a3238; background:#141a1e;
         color:var(--accent); font-size:16px; font-weight:800; cursor:pointer; line-height:1; }
  .gbtn:active{ transform:scale(.86); }

  .obs{ margin-top:20px; }
  .obs-h{ display:flex; align-items:center; gap:9px; font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:var(--note-txt); margin-bottom:10px; }
  .obs-h .cbar{ width:5px; height:17px; border-radius:3px; background:#FDE68A; }
  .obs-h .cadd{ margin-left:auto; background:none; border:1px dashed var(--note-line); color:var(--note-txt2); font-size:11px; font-weight:700; border-radius:7px; padding:5px 10px; cursor:pointer; }
  .obs-box{ background:rgba(253,230,138,0.06); border:1px solid #4a4326; border-left:4px solid #FDE68A; border-radius:9px; padding:12px 15px; }
  .obs-empty{ font-family:"Nota",cursive; font-size:17px; color:#9a9068; }
  .oi{ cursor:pointer; border-radius:6px; margin:0 -6px; font-family:"Nota",cursive; font-size:18px; color:#e9dba3; line-height:1.5; padding:5px 6px; display:flex; gap:9px; align-items:flex-start; }
  .oi:before{ content:"•"; color:#FDE68A; }
  @keyframes noteIn{ from{ opacity:0; transform:translateY(-9px) scale(.97); } to{ opacity:1; transform:none; } }
  .oi.new{ animation:noteIn .42s cubic-bezier(.2,.9,.3,1); }
  .oi .del{ margin-left:auto; color:#7a6f45; font-size:13px; cursor:pointer; font-family:"Segoe UI"; }
  /* a data e o pino usam a fonte do app: numero em manuscrita se le mal */
  .oi .dt{ font-family:"Segoe UI",system-ui,sans-serif; font-size:10px; font-weight:800;
    letter-spacing:.05em; color:#9a9068; flex:0 0 auto; padding-top:5px; min-width:34px; }
  .oi .tx{ flex:1; min-width:0; }
  .oi .pin{ font-family:"Segoe UI",system-ui,sans-serif; font-size:11px; color:var(--note-on,#FDE68A);
    flex:0 0 auto; padding-top:4px; }
  .oi.fixa{ background:rgba(253,230,138,.05); }
  [data-theme="light"] .oi .dt,[data-theme="miri"] .oi .dt{ color:#b0a674; }
  /* botao de ditar, igual ao do Feito */
  /* o interruptor da nota fixada. "Fica todo dia" e um ESTADO, entao se veste
     de estado — o botao nunca mostrava se estava ligado. */
  .swfix{ display:flex; align-items:center; gap:11px; padding:11px 12px;
    border:1px solid var(--line); border-radius:12px; margin-bottom:8px;
    background:var(--panel2,#0f1216); cursor:pointer; }
  .swfix .ic{ width:20px; color:var(--note-txt2,#9a9068); flex:0 0 auto; display:flex; }
  .swfix .ic svg{ width:18px; height:18px; }
  .swfix .tt{ flex:1; min-width:0; }
  .swfix .t1{ font-size:13.5px; font-weight:700; color:var(--txt); }
  .swfix .t2{ font-size:11.5px; color:var(--mut); margin-top:1px; line-height:1.35; }
  .swfix .tog{ width:40px; height:23px; border-radius:20px; background:#2a2f34; position:relative; flex:0 0 auto; }
  .swfix .tog i{ position:absolute; top:3px; left:3px; width:17px; height:17px; border-radius:50%;
    background:#6b7278; transition:left .18s ease, background .18s ease; }
  /* LIGADO: a linha inteira acende, nao so o botao. A diferenca sai de um
     objeto de 40px e passa a ser a faixa, a borda, o pino solido e o titulo. */
  .swfix .tog.on{ background:var(--note-txt);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--note-txt) 22%, transparent); }
  .swfix .tog.on i{ left:20px; background:var(--bg); }
  .swfix.on{ border-color:var(--note-txt);
    background:color-mix(in srgb, var(--note-txt) 11%, transparent);
    box-shadow:inset 3px 0 0 var(--note-txt); }
  .swfix.on .t1{ color:var(--note-txt); }
  /* o pino deixa de ser contorno e vira pastilha cheia */
  .swfix.on .ic{ color:var(--bg); background:var(--note-txt);
    width:26px; height:26px; border-radius:8px; align-items:center; justify-content:center; }
  .swfix.on .ic svg{ width:15px; height:15px; }
  .swfix:active{ transform:scale(.995); }
  /* virar tarefa e ACAO, nao estado: tracejada, pra se ler como outra natureza */
  .linkacao{ display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:11px 12px; border-radius:12px; border:1px dashed var(--line);
    background:transparent; color:var(--accent); font-size:13.5px; font-weight:700;
    font-family:inherit; cursor:pointer; }
  .linkacao svg{ width:17px; height:17px; flex:0 0 auto; }
  .linkacao:active{ transform:scale(.99); }
  .micbt svg{ width:19px; height:19px; }
  .micbt{ background:none; border:1px solid var(--note-line,#4a4326); color:var(--note-txt2,#e9dba3);
    border-radius:10px; width:38px; height:38px; font-size:15px; cursor:pointer; flex:0 0 auto;
    display:inline-flex; align-items:center; justify-content:center; }
  .micbt.rec{ background:#c0392b; border-color:#c0392b; color:#fff; animation:micpulse 1s infinite; }
  @keyframes micpulse{ 0%,100%{ opacity:1 } 50%{ opacity:.55 } }
  .linhamic{ display:flex; gap:9px; align-items:flex-start; }
  .linhamic > :first-child{ flex:1; min-width:0; }

  footer{ margin-top:22px; padding-top:12px; border-top:1px solid var(--line2); font-size:10px; color:var(--mut); text-align:center; }

  /* FAB */
  .fab{ position:fixed; right:18px; bottom:calc(90px + env(safe-area-inset-bottom)); width:56px; height:56px; border-radius:50%;
        background:var(--accent); color:#04191a; border:none; font-size:29px; font-weight:400; cursor:pointer; z-index:30;
        box-shadow:0 8px 26px rgba(47,217,201,.4); display:flex; align-items:center; justify-content:center; }
  .fab:active{ transform:scale(.9); }

  /* nav flutuante inferior (estilo Stash) */
  nav{ position:fixed; left:0; right:0; bottom:0; z-index:35; display:flex; justify-content:center; pointer-events:none;
       padding:0 12px calc(11px + env(safe-area-inset-bottom)); }
  nav .navbar{ pointer-events:auto; display:flex; gap:4px; width:100%; max-width:460px;
       background:rgba(18,22,27,.85); backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px) saturate(1.4);
       border:1px solid rgba(255,255,255,.08); border-radius:22px; padding:7px;
       box-shadow:0 14px 36px rgba(0,0,0,.52),inset 0 1px 0 rgba(255,255,255,.06); }
  nav button{ flex:1; background:transparent; border:none; color:var(--mut2); font-family:inherit; font-size:10px; font-weight:800;
       text-transform:uppercase; letter-spacing:.3px; cursor:pointer; padding:10px 2px; min-height:56px; display:flex; flex-direction:column;
       align-items:center; justify-content:center; gap:4px; border-radius:16px; transition:color .2s,background .25s,transform .12s;
       touch-action:none; -webkit-tap-highlight-color:transparent; }
  nav button *{ pointer-events:none; }
  nav button .ic{ line-height:0; opacity:.5; transition:opacity .2s,transform .25s; display:flex; }
  nav button .ic svg{ width:23px; height:23px; }
  nav button.on{ color:var(--accent); background:linear-gradient(180deg,rgba(47,217,201,.17),rgba(47,217,201,.05)); }
  nav button.on .ic{ opacity:1; transform:translateY(-1px) scale(1.07); }
  nav button:active{ transform:scale(.93); }
  [data-theme="light"] nav .navbar{ background:rgba(255,255,255,.9); border-color:rgba(0,0,0,.06); }
  [data-theme="miri"] nav .navbar{ background:rgba(251,247,238,.9); border-color:rgba(0,0,0,.06); }

  /* aba Progresso */
  .progview{ position:fixed; inset:0; z-index:15; background:var(--bg); overflow:auto;
             padding:16px 14px calc(96px + env(safe-area-inset-bottom)); max-width:820px; margin:0 auto; }
  .progview.hidden{ display:none; }
  .prog-top{ display:flex; align-items:center; margin:2px 0 16px; }
  .prog-top h2{ font-size:21px; color:var(--txt2); font-weight:800; }
  .prog-seg{ display:flex; gap:8px; margin-bottom:15px; }
  .prog-seg button{ flex:1; padding:11px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--mut); font-size:13px; font-weight:700; cursor:pointer; transition:.15s; }
  .prog-seg button.on{ background:var(--accent); color:#04191a; border-color:var(--accent); }
  .prog-metric{ margin-bottom:9px; }
  .prog-seg button:active{ transform:scale(.97); }
  .prog-chart{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px 8px 10px; }
  .prog-empty{ text-align:center; color:var(--mut); padding:46px 20px; font-size:14px; line-height:1.7; }
  .prog-legend{ display:flex; flex-wrap:wrap; gap:9px 16px; margin:2px 2px 13px; }
  .prog-legend .pl{ display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--mut2); font-weight:600; }
  .prog-legend .pl i{ width:12px; height:12px; border-radius:5px; display:inline-block; box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 1px 3px rgba(0,0,0,.4); }
  .prog-legend .pl b{ color:var(--txt2); font-weight:800; }
  .prog-metric button.count.on{ background:#22C55E; border-color:#22C55E; color:#04120a; }
  .prog-sum{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:13px 15px; margin-top:13px;
             font-size:14px; line-height:1.65; color:var(--mut2); }
  .prog-sum .sh{ display:flex; align-items:center; gap:7px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.8px; color:var(--accent); margin-bottom:8px; }
  .prog-sum .sh svg{ width:14px; height:14px; stroke:var(--accent); }
  .prog-sum p{ margin:0; }
  .prog-sum p+p{ margin-top:6px; }
  .prog-sum b{ color:var(--txt2); font-weight:800; }
  .prog-sum .up{ color:#5fd6a6; font-weight:800; } .prog-sum .down{ color:#ff9aa2; font-weight:800; } .prog-sum .flat{ color:var(--mut2); font-weight:800; }

  /* modal / sheet */
  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
  /* com o teclado aberto a folha sobe junto: e o overlay que reserva a altura,
     porque position:fixed nao enxerga o padding do body */
  /* O overlay NUNCA encolhe: encolher abria um buraco de 342px embaixo, sem
     cobertura nenhuma, e o toque atravessava pra página de trás no instante em
     que o teclado sumia. Quem sobe é a FOLHA, por margem — o escurecido segue
     cobrindo a tela inteira. A transição faz deslizar em vez de saltar. */
  .sheet{ transition:margin-bottom .2s ease; }
  body.kbdopen .sheet{ margin-bottom:var(--kbh,0px); max-height:calc(90vh - var(--kbh,0px)); }
  .sheet{ width:100%; max-width:560px; background:#101317; border:1px solid var(--line); border-bottom:none;
          border-radius:18px 18px 0 0; padding:18px 16px calc(20px + env(safe-area-inset-bottom)); max-height:90vh; overflow:auto;
          animation:up .22s cubic-bezier(.2,.9,.3,1); }
  @keyframes up{ from{ transform:translateY(40px); opacity:.4 } to{ transform:translateY(0); opacity:1 } }
  .sheet h3{ font-size:16px; color:var(--txt2); margin-bottom:14px; }
  .field{ margin-bottom:13px; }
  .field label{ display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--mut2); margin-bottom:6px; }
  .field input, .field textarea, .field select{ width:100%; background:#0b0e11; border:1px solid #2a2f35; color:var(--txt);
        border-radius:9px; padding:11px 12px; font-size:14px; font-family:inherit; }
  .field textarea{ min-height:64px; resize:vertical; }
  .catrow{ display:flex; flex-wrap:wrap; gap:8px; }
  .catopt{ display:flex; align-items:center; gap:7px; padding:9px 12px; border-radius:9px; border:1.5px solid #2a2f35;
           background:#0b0e11; cursor:pointer; font-size:13px; font-weight:600; }
  .catopt .dot{ width:12px; height:12px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(128,128,128,.5); }
  .catopt.sel{ border-color:var(--accent); background:#0d1a1c; }
  .prow{ display:flex; gap:8px; }
  .popt{ flex:1; text-align:center; padding:10px; border-radius:9px; border:1.5px solid #2a2f35; background:#0b0e11; cursor:pointer; font-size:12px; font-weight:700; }
  .popt.sel{ border-color:var(--star); background:#17140d; color:var(--star); }
  .popt.sel.max{ border-color:var(--orange); background:#1b1108; color:var(--orange); }
  .wdrow{ display:flex; flex-wrap:wrap; gap:6px; }
  .wdopt{ width:46px; text-align:center; padding:9px 0; border-radius:9px; border:1.5px solid #2a2f35; background:#0b0e11; cursor:pointer; font-size:12px; font-weight:700; color:var(--txt); transition:transform .1s; }
  .wdopt:active{ transform:scale(.9); }
  .wdopt.sel{ border-color:var(--accent); background:#0d1a1c; color:var(--accent); }
  .recbtn{ width:100%; display:flex; align-items:center; gap:8px; background:#0b0e11; border:1px solid #2a2f35; color:var(--txt); border-radius:9px; padding:11px 12px; font-size:14px; font-family:inherit; cursor:pointer; }
  .recbtn:active{ transform:scale(.99); }
  .recpanel{ margin-top:10px; border:1px solid #22272c; border-radius:12px; padding:12px; }
  .rtyperow{ display:flex; flex-wrap:wrap; gap:6px; }
  .rtype{ padding:8px 13px; border-radius:9px; border:1.5px solid #2a2f35; background:#0b0e11; cursor:pointer; font-size:12px; font-weight:700; color:var(--txt); transition:transform .1s; }
  .rtype:active{ transform:scale(.92); }
  .rtype.sel{ border-color:var(--accent); background:#0d1a1c; color:var(--accent); }
  .reclbl{ font-size:11px; color:var(--mut2); font-weight:700; text-transform:uppercase; letter-spacing:.4px; margin:12px 0 7px; }
  .calpop.inline{ position:static; transform:none; left:auto; top:auto; width:auto; box-shadow:none; border:1px solid #22272c; padding:11px; }
  .sheet .actions{ display:flex; gap:10px; margin-top:8px; }
  .sheet .actions button{ flex:1; padding:13px; border-radius:12px; border:none; font-size:14px; font-weight:700; cursor:pointer; }
  .btn-primary{ background:var(--accent); color:#04191a; }
  .btn-ghost{ background:#1a1e23; color:var(--txt); }
  .btn-danger{ background:#2b1214; color:var(--canc); }

  /* actions sheet buttons */
  .act-list button{ display:flex; width:100%; align-items:center; gap:12px; background:#0b0e11; border:1px solid #22272c;
        color:var(--txt); font-size:14px; padding:13px 14px; border-radius:12px; cursor:pointer; margin-bottom:8px; }
  .act-list button:active{ background:#181c21; }
  .act-list button.del{ color:#ff9a9a; border-color:#5c2a2f; background:#1c1113; font-weight:700; }
  .act-list button.del .ic{ color:#f87171; }
  .act-list button.del:active{ background:#2b1214; }
  .act-list .ic{ width:22px; text-align:center; }

  /* flash */
  #flash{ position:fixed; inset:0; pointer-events:none; z-index:60; opacity:0;
          background:linear-gradient(180deg, rgba(47,217,201,.32), rgba(34,197,94,.28)); }
  #flash.go{ animation:fl .8s ease-out; }
  @keyframes fl{ 0%{opacity:0} 25%{opacity:1} 100%{opacity:0} }

  /* checkbox de compartilhar */
  .chkrow{ display:flex; align-items:center; gap:11px; padding:12px 4px; border-bottom:1px solid var(--line2); font-size:14px; color:#f0f2f4; cursor:pointer; }
  .chkrow input{ width:20px; height:20px; accent-color:var(--accent); flex-shrink:0; }
  .chkrow .dot{ width:12px; height:12px; border-radius:50%; flex-shrink:0; }

  /* paleta de cores */
  .swatches{ display:flex; flex-wrap:wrap; gap:10px; }
  .sw{ width:32px; height:32px; border-radius:50%; cursor:pointer; border:2.5px solid transparent; box-shadow:inset 0 0 0 1px rgba(128,128,128,.4); transition:transform .12s; }
  .sw:active{ transform:scale(.85); }
  .sw.sel{ border-color:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.14); }

  /* mini calendário */
  .calpop{ position:fixed; top:58px; left:50%; transform:translateX(-50%); z-index:45;
           background:#14171b; border:1px solid var(--line); border-radius:14px; padding:11px; width:262px;
           box-shadow:0 14px 44px rgba(0,0,0,.6); }
  .calpop .ch{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .calpop .ch b{ font-size:13px; color:#fff; text-transform:capitalize; }
  .calpop .ch button{ background:#1b1f24; border:1px solid #2a2f35; color:#cfd6db; width:30px; height:30px; border-radius:9px; cursor:pointer; font-size:14px; }
  .calpop .wd{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:3px; }
  .calpop .wd span{ text-align:center; font-size:10px; color:#6b7378; font-weight:700; }
  .calpop .grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .calpop .cell{ height:30px; display:flex; align-items:center; justify-content:center; font-size:12px; color:#cfd6db; border-radius:7px; cursor:pointer; position:relative; }
  .calpop .cell:active{ background:#20242a; }
  .calpop .cell.other{ color:#3a4046; }
  .calpop .cell.today{ box-shadow:inset 0 0 0 1.5px var(--amber); }
  .calpop .cell.sel{ background:var(--accent); color:#04191a; font-weight:800; }
  .calpop .cell .dot{ position:absolute; bottom:3px; width:4px; height:4px; border-radius:50%; background:var(--accent); }
  .calpop .cell.sel .dot{ background:#04191a; }

  /* boas-vindas */
  #__welcome{ position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center; padding:24px;
    background:rgba(0,0,0,.74); }
  #__welcome.hidden{ display:none; }
  .wc-card{ background:linear-gradient(160deg,#12161a,#0a0d10); border:1px solid #23282e; border-radius:22px; padding:28px 24px 26px; max-width:360px; text-align:center; box-shadow:0 24px 70px rgba(0,0,0,.6); animation:wcpop .5s cubic-bezier(.2,.9,.3,1); }
  @keyframes wcpop{ from{ opacity:0; transform:translateY(18px) scale(.95); } to{ opacity:1; transform:none; } }
  .wc-ico{ font-size:54px; margin-bottom:10px; animation:wcfloat 2.6s ease-in-out infinite; }
  @keyframes wcfloat{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-7px) } }
  .wc-card h2{ color:#fff; font-size:22px; margin-bottom:10px; letter-spacing:.5px; }
  .wc-card p{ color:#9aa2a8; font-size:14px; line-height:1.55; margin-bottom:22px; }
  .wc-card .wcbtn{ background:var(--accent); color:var(--onacc); border:none; border-radius:12px; padding:13px 30px; font-size:15px; font-weight:800; cursor:pointer; box-shadow:0 6px 20px rgba(47,217,201,.32); }
  .wc-card .wcbtn:active{ transform:scale(.95); }

  /* ===== conta / login / sincronização ===== */
  /* metade do dia: desce do topo, some sozinha e nao rouba o toque —
     so o proprio cartao e clicavel, pra quem quiser dispensar antes.
     Deitado de proposito: em pe cobriria a data e a barra de progresso. */
  .cheer{ position:fixed; left:0; right:0; top:0; z-index:80; display:flex;
    align-items:flex-start; justify-content:center; pointer-events:none;
    padding:calc(12px + env(safe-area-inset-top)) 14px 0; }
  .cheer .cbox{ pointer-events:auto; cursor:pointer; display:flex; align-items:center; gap:12px;
    width:100%; max-width:360px; text-align:left;
    background:var(--panel); border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));
    border-radius:15px; padding:12px 15px;
    box-shadow:0 14px 38px rgba(0,0,0,.5), 0 0 38px color-mix(in srgb,var(--accent) 14%,transparent);
    animation:cheerIn .36s cubic-bezier(.34,1.4,.64,1); }
  .cheer.sai .cbox{ animation:cheerOut .26s ease forwards; }
  .cheer .cmk{ width:36px; height:36px; flex:none; border-radius:50%;
    background:color-mix(in srgb,var(--accent) 18%,transparent);
    display:flex; align-items:center; justify-content:center; }
  .cheer .cmk svg{ width:19px; height:19px; stroke:var(--accent); }
  .cheer .ctx{ min-width:0; }
  .cheer h4{ margin:0 0 2px; font-size:14.5px; font-weight:800; color:var(--txt2); letter-spacing:-.2px; }
  .cheer p{ margin:0; font-size:11.5px; color:var(--mut); line-height:1.35; }
  @keyframes cheerIn{ from{ opacity:0; transform:translateY(-18px); } to{ opacity:1; transform:none; } }
  @keyframes cheerOut{ to{ opacity:0; transform:translateY(-14px); } }
  @media (prefers-reduced-motion:reduce){ .cheer .cbox{ animation:none; } }
  .authov{ position:fixed; inset:0; z-index:90; display:flex; align-items:center; justify-content:center; padding:22px;
           background:rgba(0,0,0,.74); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
  .authov.hidden{ display:none !important; }
  .auth-card{ width:100%; max-width:380px; background:linear-gradient(160deg,#12161a,#0a0d10); border:1px solid #23282e;
              border-radius:22px; padding:26px 22px 22px; box-shadow:0 24px 70px rgba(0,0,0,.6);
              animation:wcpop .42s cubic-bezier(.2,.9,.3,1); max-height:92vh; overflow:auto; }
  .auth-ic{ font-size:42px; text-align:center; margin-bottom:6px; }
  .auth-card h2{ color:#fff; font-size:21px; text-align:center; margin-bottom:9px; }
  .auth-card p{ color:#9aa2a8; font-size:14px; line-height:1.55; text-align:center; margin-bottom:16px; }
  .auth-card p.auth-note{ font-size:12px; color:#6f7a80; margin-top:-9px; }
  .auth-card .field label{ color:#8a97a0; }
  .auth-card .field input{ background:#0b0e11; }
  .auth-err{ display:none; color:#f87171; font-size:13px; text-align:center; margin:2px 0 12px; font-weight:600; }
  .auth-btns{ display:flex; flex-direction:column; gap:10px; margin:4px 0 2px; }

  .auth-link{ display:block; width:100%; background:none; border:none; color:#8a97a0; font-size:13px; margin-top:11px; cursor:pointer; text-decoration:underline; }
  [data-theme="light"] .auth-card,[data-theme="miri"] .auth-card{ background:var(--panel); border-color:var(--line); }
  [data-theme="light"] .auth-card h2,[data-theme="miri"] .auth-card h2{ color:var(--txt2); }
  [data-theme="light"] .auth-card p,[data-theme="miri"] .auth-card p{ color:var(--mut); }
  [data-theme="light"] .auth-card .field input,[data-theme="miri"] .auth-card .field input{ background:#f5f6f8; }
  /* botões modernos das telas de conta */
  .auth-card .actions{ gap:11px; margin-top:15px; }
  .auth-card .actions button,.auth-btns button{ padding:15px 16px; border-radius:14px; font-size:15px; font-weight:800; letter-spacing:.2px;
    transition:transform .13s cubic-bezier(.34,1.4,.5,1), box-shadow .2s ease, filter .2s ease; }
  .auth-card .actions button:active,.auth-btns button:active{ transform:scale(.955); }
  .auth-card .btn-primary,.auth-btns .btn-primary{ background:linear-gradient(135deg,#33e0cf,#1fb4a6); color:#042a26; box-shadow:0 9px 24px rgba(47,217,201,.36); }

  .auth-card .btn-ghost,.auth-btns .btn-ghost{ background:transparent; color:var(--txt2); border:1.5px solid #333b43; box-shadow:none; }
  .auth-card .btn-ghost:active,.auth-btns .btn-ghost:active{ background:rgba(255,255,255,.04); }
  .auth-card .btn-danger{ background:linear-gradient(135deg,#ef5064,#cc2f3d); color:#fff; box-shadow:0 9px 24px rgba(239,68,68,.3); }
  .auth-card .btn-danger:active{ filter:brightness(1.06); }
    border:1.5px solid #d7dbe0; background:#fff; color:#1f2226; font-size:15px; font-weight:700; cursor:pointer; margin-bottom:2px;
    transition:transform .13s cubic-bezier(.34,1.4,.5,1), box-shadow .2s ease; box-shadow:0 3px 12px rgba(0,0,0,.18); }
  /* teclado do PIN */
  .biobtn{ display:flex; align-items:center; justify-content:center; gap:9px; width:100%;
    margin:0 0 14px; padding:13px 14px; border:1px solid var(--line); border-radius:14px;
    background:var(--panel2); color:var(--txt); font-family:inherit; font-size:15px;
    font-weight:700; cursor:pointer; transition:transform .13s ease, opacity .18s ease; }

  .pkeypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:11px; margin:4px 0 2px; }
  .pkey{ height:66px; border-radius:18px; border:1px solid var(--line); background:var(--panel); color:var(--txt2);
         font-size:27px; font-weight:600; cursor:pointer; transition:transform .1s, background .15s; font-family:inherit; position:relative; }
  .pinpv{ position:fixed; z-index:2000001; display:flex; align-items:center; justify-content:center; pointer-events:none;
          border-radius:18px; background:linear-gradient(180deg,#f4fbfa,#cbe6e2); color:#07171b; font-weight:800;
          box-shadow:0 10px 26px rgba(0,0,0,.55); font-family:inherit; animation:pinpv .26s cubic-bezier(.25,1.4,.45,1) forwards; }

  [data-theme="light"] .pkey,[data-theme="miri"] .pkey{ background:#f5f6f8; }
  .auth-card .field input{ border-radius:14px; padding:14px 14px; transition:border-color .18s ease, box-shadow .18s ease; }

  .auth-card .act-list button{ border-radius:14px; padding:15px 15px; font-weight:700; transition:transform .13s ease, background .18s ease; }
  .auth-card .act-list button:active{ transform:scale(.97); }
  .auth-link{ transition:color .18s ease; }
  .auth-link:active{ color:var(--accent); }
  [data-theme="light"] .auth-card .btn-primary,[data-theme="miri"] .auth-card .btn-primary,
  [data-theme="light"] .auth-btns .btn-primary,[data-theme="miri"] .auth-btns .btn-primary{ color:#042a26; }

<script>
/* ================= modelo ================= */
/* app vem SEM categorias — cada pessoa cria as suas */
const DEFAULT_CATS = [];
let CATS = [];   // carregado do DB (DB.cats)
const catById = id => CATS.find(c=>c.id===id) || CATS[0];
const KEY = 'assistente-v3';
/* mesma versao do sw.js — mexeu num, mexe no outro */
const VERSAO = 'v71';
let DB, cur;   // DB.days = {iso:{tasks:[],obs:[]}}, cur = iso atual

function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function uid(){ return 'k'+Math.random().toString(36).slice(2,9); }
function fmtBR(iso){ const [y,m,d]=iso.split('-'); return d+'/'+m; }
const WD=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function longDate(iso){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); return WD[dt.getDay()]+', '+d+' de '+MES[m-1]; }
function shiftISO(iso,n){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }

/* ============= app vem ZERADO — dia vazio, sem dados ============= */
function emptyDay(){ return { tasks:[], obs:[] }; }

function load(){
  try{ DB = JSON.parse(localStorage.getItem(KEY)); }catch(e){ DB=null; }
  if(!DB || !DB.days){ DB = {days:{}}; DB.days[todayISO()] = emptyDay(); }
  if(!DB.cats) DB.cats = [];
  if(!DB.recurring) DB.recurring = [];
  CATS = DB.cats;
  // SEMPRE abre no dia de hoje. Se hoje ainda não existe, cria puxando os
  // pendentes do dia anterior (carry-over automático ao abrir, em qualquer aparelho).
  migrarDiariasFixas();
  const t = todayISO();
  if(!DB.days[t]){ DB.days[t] = Object.keys(DB.days).length ? buildNewDay(t) : emptyDay(); save(); }
  cur = t;
}
async function wipeAll(){ closeMenu();
  if(!await uiConfirm('Isso apaga TODOS os dias e categorias deste app. Não dá pra desfazer.',{title:'Zerar tudo?',ok:'Apagar tudo',danger:true}))return;
  localStorage.removeItem(KEY); DB={days:{},cats:[]}; DB.days[todayISO()]=emptyDay(); CATS=DB.cats; cur=todayISO(); save(); render(); }

/* ============= categorias (adicionar / apagar) ============= */
function slug(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,16)||'cat'; }
function openCats(){ closeMenu();
  const rows = CATS.map(c=>`<div style="display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line2)">
      <span style="flex:1;display:flex;align-items:center;gap:11px;cursor:pointer" onclick="closeSheet();openCatActions('${c.id}')">
        <span style="width:14px;height:14px;border-radius:50%;background:${c.color};flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4)"></span>
        <span style="flex:1;font-size:14px;color:var(--txt2)">${escapeHtml(c.name)}</span>
        <span style="font-size:11px;color:var(--mut)">✎ editar</span></span>
      <button onclick="delCat('${c.id}')" style="background:none;border:none;color:var(--mut);font-size:15px;cursor:pointer;padding-left:6px">🗑</button></div>`).join('');
  sheet(`<h3>Categorias</h3>
    <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-bottom:8px">Minhas categorias</label>
    <div style="margin-bottom:14px">${rows || '<div style="font-size:13px;color:var(--mut);padding:4px 0">Nenhuma ainda.</div>'}</div>
    <div class="field"><label>Nova categoria</label>
      <input id="ncName" placeholder="Nome" style="margin-bottom:12px"></div>
    <div class="field"><label>Cor</label><div class="swatches" id="ncSw">${swatchesHtml()}</div></div>
    <div class="actions"><button class="btn-ghost" onclick="closeSheet()">Fechar</button><button class="btn-primary" onclick="addCat()">+ Adicionar</button></div>`);
}
const PALETTE = ['#3EE6A0','#25E0DA','#38A8FF','#7C8CFF','#C874FF','#FF6BC0','#FF5D73','#FF9142','#FFC24A','#FFE24A','#9BF24A','#B0B8C4','#FFFFFF','#000000'];
function palette(){ const t=document.documentElement.getAttribute('data-theme')||'dark';
  return (t==='dark'||t==='neon'||t==='hud') ? PALETTE.filter(c=>c!=='#000000') : PALETTE.filter(c=>c!=='#FFFFFF'); }
let ncColorSel = PALETTE[0];
function swatchesHtml(){ const P=palette(); ncColorSel=P[0]; return P.map((c,i)=>`<div class="sw ${i===0?'sel':''}" style="background:${c}" onclick="pickSw(this,'${c}')"></div>`).join(''); }
function pickSw(el,c){ ncColorSel=c; el.parentNode.querySelectorAll('.sw').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); }
function addCat(){ const n=document.getElementById('ncName').value.trim(); if(!n){ uiAlert('Dê um nome à categoria.'); return; }
  let id=slug(n); while(CATS.some(c=>c.id===id)) id+='x';
  CATS.push({id,name:n,color:ncColorSel}); save(); closeSheet(); render();
}
async function delCat(id){ if(await removeCat(id)){ closeSheet(); openCats(); } }
async function delCatFromEdit(id){ if(await removeCat(id)){ closeSheet(); render(); } }
let _editCatId=null;
function openCatActions(id){ const c=CATS.find(x=>x.id===id); if(!c)return; _editCatId=id; ncColorSel=c.color;
  const sws=palette().map(col=>`<div class="sw ${col===c.color?'sel':''}" style="background:${col}" onclick="pickSw(this,'${col}')"></div>`).join('');
  sheet(`<h3>Editar categoria</h3>
    <div class="field"><label>Nome</label><input id="ecName" value="${escapeAttr(c.name)}"></div>
    <div class="field"><label>Cor</label><div class="swatches">${sws}</div></div>
    <div class="actions"><button class="btn-danger" onclick="delCatFromEdit('${id}')">Apagar</button><button class="btn-ghost" onclick="closeSheet()">Cancelar</button><button class="btn-primary" onclick="saveCatEdit()">Salvar</button></div>`);
}
function saveCatEdit(){ const c=CATS.find(x=>x.id===_editCatId); if(!c)return;
  const n=document.getElementById('ecName').value.trim(); if(n)c.name=n; c.color=ncColorSel; save(); closeSheet(); render(); }
async function removeCat(id){
  const used = Object.values(DB.days).some(d=>d.tasks.some(t=>t.cat===id));
  if(used){ if(!await uiConfirm('Essa categoria tem tarefas. Apagar a categoria E todas as tarefas dela (em todos os dias)?',{title:'Apagar categoria?',ok:'Apagar',danger:true}))return false;
    Object.values(DB.days).forEach(d=>{ d.tasks=d.tasks.filter(t=>t.cat!==id); }); }
  else { if(!await uiConfirm('Apagar a categoria?',{ok:'Apagar',danger:true}))return false; }
  const i=CATS.findIndex(c=>c.id===id); if(i>=0)CATS.splice(i,1); save(); return true;
}

function saveLocal(){ localStorage.setItem(KEY, JSON.stringify(DB)); }
function save(){ saveLocal(); schedulePush(); }
function day(){ return DB.days[cur]; }
/* tarefa agendada "ativa" (vira pendente) no dia programado — aí conta no % e dá pra concluir */
function activateSchedTasks(tasks, iso){
  const dd=iso.slice(8,10), mm=iso.slice(5,7); let ch=false;
  (tasks||[]).forEach(t=>{ if(t.status==='sched' && t.sched){
    const p=t.sched.split('/'); if(p[0]===dd && p[1]===mm){ t.status='pend'; t.wasSched=true; delete t.sched; ch=true; }
  }});
  return ch;
}

/* a recorrência "acontece" neste dia? (mesma lógica do buildNewDay) */
function recFiresOn(r, iso){
  if(!r || !r.type) return true;
  const [Y,M,D]=iso.split('-').map(Number); const wd=new Date(Y,M-1,D).getDay(); const dim=new Date(Y,M,0).getDate();
  if(r.type==='diario') return true;
  if(r.type==='semanal') return (r.days||[]).includes(wd);
  if(r.type==='mensal') return D===Math.min(r.dom||1,dim);
  if(r.type==='anual' && r.date){ const [rm,rd]=r.date.split('-').map(Number); const dd=(rm===M&&rd>dim)?dim:rd; return M===rm&&D===dd; }
  return true;
}
/* tarefa "bloqueada" = não é do dia atual (agendada p/ outro dia, ou recorrente cujo dia não chegou) */
function isBlocked(t){
  if(t.status==='done'||t.status==='canc'||t.status==='adiado') return false;
  if(t.status==='sched') return true;
  if(t.rec) return !recFiresOn(t.rec, cur);
  return false;
}

/* ============= cálculo do % ============= */
function frac(t){
  if(isBlocked(t)||t.status==='canc'||t.status==='adiado') return null; // fora do denominador
  if(t.goals){ let d=0,tot=0; for(const k in t.goals){ d+=t.goals[k][0]; tot+=t.goals[k][1]; } return tot?d/tot:0; }
  if(t.cota){ return t.cota[1]? t.cota[0]/t.cota[1] : 0; }
  /* fracao: uma subtarefa em 3/10 vale 0,3, nao zero — a mesma regra
     ponderada do Assistente */
  if(t.subs&&t.subs.length){ let s=0; t.subs.forEach(x=>{ s+=qtdFrac(x); }); return s/t.subs.length; }
  return t.status==='done'?1:0;
}
function stats(){
  const ts=day().tasks; let sum=0,n=0,doneN=0,blocked=0,adia=0;
  ts.forEach(t=>{ if(isBlocked(t)){blocked++;return;} if(t.status==='adiado'){adia++;return;} if(t.status==='canc') return;
    const f=frac(t); if(f===null) return; sum+=f; n++; if(f>=1) doneN++; });
  return {pct:n?Math.round(sum/n*100):0, doneN, n, blocked, adia};
}

/* ============= metade do dia ============= */
/* a frase troca de um dia pro outro, mas nao dentro do mesmo dia: repetir a
   mesma sempre vira papel de parede, e sortear a cada render seria inquieto */
const CHEER=[
  ['Passou da metade.','Falta menos do que já foi.'],
  ['Metade do dia feita.','Bom ritmo — segue.'],
  ['Mais da metade resolvida.','O que falta cabe no resto do dia.'],
  ['Virou a metade.','A parte cheia da barra já é a maior.'],
  ['50% do dia.','Boa. O resto vem no embalo.']
];
let _lastPct=null;
function jaComemorou(){ try{ return localStorage.getItem('norte-meta50')===cur; }catch(e){ return false; } }
function cheer50(){
  if(document.getElementById('__cheer')) return;
  try{ som('meta'); }catch(e){}
  let h=0; for(let i=0;i<cur.length;i++) h=(h*31+cur.charCodeAt(i))>>>0;
  const par=CHEER[h%CHEER.length];
  const el=document.createElement('div'); el.id='__cheer'; el.className='cheer';
  el.innerHTML='<div class="cbox">' +
    '<div class="cmk"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>' +
    '<div class="ctx"><h4>'+par[0]+'</h4><p>'+par[1]+'</p></div></div>';
  document.body.appendChild(el);
  const fim=function(){ if(!el.parentNode) return; el.classList.add('sai');
    setTimeout(function(){ if(el.parentNode) el.remove(); },280); };
  el._h=setTimeout(fim,3000);
  el.querySelector('.cbox').addEventListener('click',function(){ clearTimeout(el._h); fim(); });
  try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){}
}
function checaMetade(pct){
  if(cur!==todayISO()){ _lastPct=null; return; }   /* dia antigo nao comemora */
  if(_lastPct!==null && _lastPct<50 && pct>=50 && !jaComemorou()){
    try{ localStorage.setItem('norte-meta50',cur); }catch(e){}
    cheer50();
  }
  _lastPct=pct;
}

/* ============= ordenação dentro da categoria ============= */
function sortKey(t){
  // prioridade manda mais que status
  if(t.prio==='urgente') return -1;
  if(t.prio==='max') return 0;
  if(t.prio==='star') return 1;
  if(t.status==='sched') return 2;
  if(t.status==='adiado') return 5;
  if(t.status==='canc') return 6;
  if(t.status==='done') return 4;  // concluídas sem prioridade por último (antes de canc)
  return 3; // pendentes normais
}

/* ============= render ============= */
let _catFilter=null;
function setCatFilter(id){ _catFilter=id; render(); }
function render(){
  if(day()) activateSchedTasks(day().tasks, cur);   // ativa as agendadas cujo dia chegou
  document.getElementById('datepilltxt').textContent = fmtBR(cur) + (cur===todayISO()?' · hoje':'');
  document.getElementById('dateTitle').textContent = longDate(cur);
  const s=stats();
  document.getElementById('count').textContent =
    `${s.doneN} de ${s.n} · ${s.pct}% do dia` + (s.blocked?` · ${s.blocked} bloqueada${s.blocked>1?'s':''}`:'') + (s.adia?` · ${s.adia} adiada${s.adia>1?'s':''}`:'');
  document.getElementById('fill').style.width = s.pct+'%';
  checaMetade(s.pct);
  /* fechar o dia nao tinha marco nenhum — so o numero mudando pra 100% */
  try{
    if(cur===todayISO() && s.n>0 && s.pct>=100 && localStorage.getItem('norte-dia100')!==cur){
      localStorage.setItem('norte-dia100',cur); som('dia');
    }
  }catch(e){}

  // legend (só aparece se houver categorias)
  const lg=document.getElementById('legend');
  if(!CATS.length){ lg.classList.add('hidden'); }
  else{ lg.classList.remove('hidden'); lg.innerHTML =
    `<span class="ci ${_catFilter===null?'on':''}" onclick="setCatFilter(null)">Tudo</span>` +
    CATS.map(c=>`<span class="ci ${_catFilter===c.id?'on':''}" onclick="setCatFilter('${c.id}')"><span class="cdot" style="background:${c.color}"></span>${escapeHtml(c.name)}</span>`).join('') +
    `<span class="ci add" onclick="openCats()">＋</span>`; }

  // título "Minhas categorias" (só quando há categorias)
  document.getElementById('catsTitle').style.display = CATS.length ? 'flex' : 'none';
  // cats
  const host=document.getElementById('cats'); host.innerHTML='';
  CATS.forEach(c=>{
    if(_catFilter && c.id!==_catFilter) return;
    const ts = day().tasks.filter(t=>t.cat===c.id).sort((a,b)=> sortKey(a)-sortKey(b));
    if(!ts.length) return;
    const div=document.createElement('div'); div.className='cat';
    div.innerHTML=`<div class="chead"><span class="cbar" style="background:${c.color};box-shadow:0 0 8px ${c.color}99"></span>
      <span class="cname" style="cursor:pointer" onclick="openCatActions('${c.id}')">${escapeHtml(c.name)} <span class="cedit">${svgIc('pen')}</span></span>
      <button class="cadd" onclick="openAdd('${c.id}')">+ tarefa</button></div>`;
    ts.forEach(t=> div.appendChild(itemEl(t,c)));
    host.appendChild(div);
  });
  // tarefas cuja categoria nao existe mais: aparecem em vez de sumir
  const orfas = day().tasks.filter(t=>!CATS.some(c=>c.id===t.cat)).sort((a,b)=> sortKey(a)-sortKey(b));
  if(orfas.length && !_catFilter){
    const c={id:'__orfa',name:'Sem categoria',color:'#8a97a0'};
    const div=document.createElement('div'); div.className='cat';
    div.innerHTML=`<div class="chead"><span class="cbar" style="background:${c.color}"></span>
      <span class="cname">Sem categoria</span></div>
      <div class="orfa-aviso">A categoria destas tarefas foi apagada. Toque numa delas pra mover ou apagar.</div>`;
    orfas.forEach(t=> div.appendChild(itemEl(t,c)));
    host.appendChild(div);
  }
  if(!host.children.length){
    const noCat = !CATS.length;
    host.innerHTML=`<div style="text-align:center;padding:34px 18px 18px;color:var(--mut)">
      <div style="font-size:38px;margin-bottom:10px">${noCat?'🏷️':'🗒️'}</div>
      <div style="font-size:15px;color:var(--txt);font-weight:600;margin-bottom:4px">${noCat?'Comece criando uma categoria':'Dia em branco'}</div>
      <div style="font-size:12px;margin-bottom:18px">${noCat?'As categorias organizam suas tarefas por cor.':'Adicione a primeira tarefa do dia.'}</div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        ${noCat
          ? `<button class="navbtn" style="background:var(--accent);color:var(--onacc);border:none;padding:0 16px" onclick="openCats()">+ Nova categoria</button>`
          : `<button class="navbtn" style="background:var(--accent);color:var(--onacc);border:none;padding:0 16px" onclick="openAdd()">+ Nova tarefa</button>`}
      </div></div>`;
  }

  // obs
  const ob=document.getElementById('obsBox'); const obs=day().obs||[];
  ob.innerHTML = obs.length ? obs.map((o,i)=>{ const N=notaDe(o); return `<div class="oi${i===_obsAnim?' new':''}${N.fix?' fixa':''}" onclick="abreObs(${i})" title="Tocar para editar"><span class="dt">${escapeHtml(dataCurta(N.dt))}</span><span class="tx">${escapeHtml(N.t)}</span>${N.fix?'<span class="pin" title="Fica todo dia">📌</span>':''}<span class="del" onclick="event.stopPropagation();delObs(${i})">✕</span></div>`; }).join('')
                            : `<div class="obs-empty">Sem notas hoje.</div>`;
  _obsAnim=-1; _subAnim='';
  document.getElementById('footer').textContent = `Norte ${VERSAO} · ${fmtBR(cur)}/${cur.split('-')[0]} · salvo no aparelho.`;
  pintaBarras();   /* as barras dos cartoes nascem na largura de antes; aqui vao pra nova e a transicao roda */

function itemEl(t,c){
  const el=document.createElement('div');
  let cls='item'; if(t.status==='done')cls+=' done'; if(t.status==='canc')cls+=' canc';
  if(t.status==='sched')cls+=' sched'; if(t.status==='adiado')cls+=' adiado';
  if(isBlocked(t))cls+=' blocked';
  if(t.prio==='urgente')cls+=' urgente'; if(t.prio==='max')cls+=' priomax'; if(t.prio==='star')cls+=' prio';
  el.className=cls; el.style.borderLeftColor=c.color; el.style.setProperty('--catcolor', c.color);

  let chips='';
  if(t.prio==='urgente') chips+=` <span class="pchip urg">★★★ Urgente</span>`;
  if(t.prio==='max') chips+=` <span class="pchip">★★ Prioridade máxima</span>`;
  if(t.prio==='star') chips+=` <span class="pchip star">★ Prioridade</span>`;
  if(t.recur) chips+=` <span class="rchip">↻ ${t.recur}</span>`;
  if(t.carriedFrom) chips+=` <span class="cflag">↩ veio de ${t.carriedFrom}</span>`;
  if(t.wasSched) chips+=` <span class="cflag schedtoday">🗓 programada pra hoje</span>`;

  let inner=`<div class="t" onclick="openActions('${t.id}')" style="cursor:pointer">${escapeHtml(t.title)}${chips}</div>`;
  if(t.meta) inner+=`<div class="m">${t.status==='done'?'✓ ':''}${escapeHtml(t.meta)}</div>`;

  // METAS
  if(t.goals){
    inner+=`<div class="goals-box">`+['posts','stories','ads'].map(k=>{
      const [d,tot]=t.goals[k]; const pc=tot?Math.round(d/tot*100):0;
      const nm={posts:'Posts',stories:'Stories',ads:'Ads'}[k];
      return `<div class="gitem"><div class="gr"><span class="gname">${nm}</span>
        <button class="gbtn" onclick="goal('${t.id}','${k}',-1)">−</button>
        <span class="gnum">${d} / ${tot}</span>
        <button class="gbtn" onclick="goal('${t.id}','${k}',1)">+</button></div>
        <div class="gtrack"><div class="gfill" style="width:${pc}%"></div></div></div>`;
    }).join('')+`</div>`;
    const gd=t.goals.posts[0]+t.goals.stories[0]+t.goals.ads[0], gt=t.goals.posts[1]+t.goals.stories[1]+t.goals.ads[1];
    inner+=tbar(gd,gt,null,'goals:'+t.id);
  }
  // Criativos / cota simples
  if(t.cota){
    inner+=`<div class="tbar"><button class="gbtn" onclick="cota('${t.id}',-1)">−</button>${tbarInner(t.cota[0],t.cota[1],'cota:'+t.id)}<button class="gbtn" onclick="cota('${t.id}',1)">+</button></div>`;
  }
  // subtarefas (não em METAS/cota)
  if(!t.goals && !t.cota){
    if(t.subs&&t.subs.length){
      const d=t.subs.filter(s=>s.done).length;
      /* a barra anda com o microfeito: 3/10 numa subtarefa ja empurra ela */
      let somaF=0; t.subs.forEach(s=>{ somaF+=qtdFrac(s); });
      inner+=tbar(d,t.subs.length,somaF/t.subs.length,'sub:'+t.id);
      inner+=`<div class="subs">`+t.subs.map((s,i)=>{
        const q = temQtd(s)
          ? `<span class="conta" onclick="event.stopPropagation()">` +
            `<button type="button" class="qb" onclick="subQtd('${t.id}',${i},-1)" ${(s.q||0)<=0?'disabled':''} aria-label="Menos um">−</button>` +
            `<span class="qn">${s.q||0}/${s.qm}</span>` +
            `<button type="button" class="qb" onclick="subQtd('${t.id}',${i},1)" ${(s.q||0)>=s.qm?'disabled':''} aria-label="Mais um">+</button></span>`
          : '';
        return `<div class="sub ${s.done?'sdone':''}${(t.id+'|'+i)===_subAnim?' new':''}" onclick="subTog('${t.id}',${i})"><span class="sbox"></span><span class="slab">${escapeHtml(s.label)}</span>${q}<span class="subdel" onclick="event.stopPropagation();subDel('${t.id}',${i})">✕</span></div>`;
      }).join('')+`</div>`;
    }
    inner+=`<div class="subadd" onclick="addSub('${t.id}')">+ subtarefa</div>`;
  }

  let tag, tagCls;
  if(isBlocked(t) && t.status!=='sched'){ tag='Agendada'; tagCls='sched'; }   // bloqueada (recorrência) aparece como agendada
  else { tag = {pend:'Pendente',done:'Feito',canc:'Cancelado',sched:(t.sched?('Agendada · '+t.sched):'Agendada'),adiado:'Adiado'}[t.status]; tagCls=t.status; }
  const boxClick = isBlocked(t) ? `openActions('${t.id}')` : `toggleDone('${t.id}')`;
  /* a etiqueta vai DENTRO do texto, flutuando: assim o titulo corre ao lado
     dela e as subtarefas usam a largura inteira do cartao embaixo dela */
  el.innerHTML=`<div class="box" onclick="${boxClick}"></div><div class="txt">
     <span class="tag ${tagCls}" onclick="openActions('${t.id}')">${tag}</span>${inner}</div>`;
  return el;
}
/* ===== a barra anda com o microfeito =====
   pc vem da FRACAO quando ela e passada (3/10 numa subtarefa move a barra),
   e a contagem d/tot continua sendo subtarefas FECHADAS.
   _barAnt guarda a largura pintada de cada barra: ela nasce na largura de
   antes e so no quadro seguinte vai pra nova, senao a transicao do CSS nao
   tem de onde partir — o cartao e redesenhado inteiro a cada toque. */
const _barAnt = {};
function _bar(chave, pc, rotulo){
  const de = (chave && _barAnt[chave] !== undefined) ? _barAnt[chave] : pc;
  const k = chave ? ` data-bar="${chave}"` : '';
  return `<div class="ttrack"><div class="tfill"${k} style="width:${de}%" data-w="${pc}"></div></div><span class="tcount">${rotulo}</span>`;
}
function pintaBarras(){
  document.querySelectorAll('.tfill[data-w]').forEach(el=>{
    const pc = +el.getAttribute('data-w');
    const chave = el.getAttribute('data-bar');
    requestAnimationFrame(()=>{ el.style.width = pc + '%'; });
    if(chave) _barAnt[chave] = pc;
  });
}
function tbar(d,tot,fr,chave){ const pc = (fr===undefined||fr===null) ? (tot?Math.round(d/tot*100):0) : Math.round(fr*100);
  return `<div class="tbar">${_bar(chave,pc,`${d}/${tot} · ${pc}%`)}</div>`; }
function tbarInner(d,tot,chave){ const pc=tot?Math.round(d/tot*100):0; return _bar(chave,pc,`${d}/${tot} · ${pc}%`); }
function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ============= interações ============= */
function findTask(id){ return day().tasks.find(t=>t.id===id); }
function flashFx(){ const f=document.getElementById('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); if(navigator.vibrate)navigator.vibrate(16);
  /* o som e a terceira camada: a tela ja piscava e o aparelho ja vibrava */
  try{ som('feito'); }catch(e){} }

function toggleDone(id){ const t=findTask(id);
  if(t.status==='done'){ t.status='pend'; }
  else{ t.status='done'; if(t.subs)t.subs.forEach(s=>s.done=true); if(t.goals)for(const k in t.goals)t.goals[k][0]=t.goals[k][1]; if(t.cota)t.cota[0]=t.cota[1]; flashFx(); }
  render();
}
let _subTid=null, _subAnim='';
function addSub(id){ _subTid=id; sheet(`<h3>➕ Nova subtarefa</h3>
    <div class="field"><input id="subInput" placeholder="ex.: Garrafa 1"></div>
    <div class="field"><input id="subQtd" type="number" inputmode="numeric" min="1" placeholder="quantidade (opcional) — ex.: 10"></div>
    <div class="actions"><button class="btn-ghost" onclick="closeSheet()">Cancelar</button><button class="btn-primary" onclick="saveSub()">Adicionar</button></div>`);
  setTimeout(()=>{ const el=document.getElementById('subInput'); if(el){ el.focus(); el.addEventListener('keydown',e=>{ if(e.key==='Enter')saveSub(); }); } },90); }
function saveSub(){ const el=document.getElementById('subInput'); const v=el?el.value.trim():''; if(!v){ if(el)el.focus(); return; }
  const qe=document.getElementById('subQtd'); const qm=qe?Math.floor(Number(qe.value)||0):0;
  const t=findTask(_subTid); if(!t)return; if(!t.subs)t.subs=[];
  const nova={label:v,done:false}; if(qm>0){ nova.qm=qm; nova.q=0; } t.subs.push(nova);
  _subAnim=_subTid+'|'+(t.subs.length-1); if(t.status==='done')t.status='pend'; closeSheet();
  if(navigator.vibrate)navigator.vibrate(12); render(); }
/* ===== quantidade na subtarefa =====
   s.q = quanto ja foi, s.qm = o alvo. Sem qm, a subtarefa e a de sempre.
   Nao ha teto fixo: o limite e o alvo que o usuario digitou. */
function temQtd(s){ return !!(s && s.qm > 0); }
function qtdFrac(s){ if(!temQtd(s)) return s && s.done ? 1 : 0;
  return Math.max(0, Math.min(1, (s.q||0) / s.qm)); }
function subQtd(id,i,d){
  const t=findTask(id); if(!t||!t.subs||!t.subs[i]) return;
  const s=t.subs[i]; if(!temQtd(s)) return;
  s.q = Math.max(0, Math.min(s.qm, (s.q||0) + d));
  s.done = (s.q >= s.qm);
  const all = t.subs.every(x=>x.done);
  if(all){ t.status="done"; flashFx(); } else if(t.status==="done"){ t.status="pend"; }
  if(navigator.vibrate) navigator.vibrate(8);
  render();
}
function subDel(id,i){ const t=findTask(id); t.subs.splice(i,1); if(!t.subs.length)delete t.subs; render(); }
function subTog(id,i){ const t=findTask(id); const s=t.subs[i]; s.done=!s.done;
  /* com quantidade, marcar enche ate o alvo e desmarcar zera — o mesmo que
     "concluir tarefa" ja faz com as metas. Sem isso o quadradinho diria
     "feito" com o numero dizendo 3/10. */
  if(temQtd(s)) s.q = s.done ? s.qm : 0;
  const all=t.subs.every(s=>s.done); if(all){ t.status='done'; flashFx(); } else if(t.status==='done'){ t.status='pend'; }
  render();
}
function goal(id,k,d){ const t=findTask(id); const g=t.goals[k]; g[0]=Math.max(0,Math.min(g[1],g[0]+d));
  const done=t.goals.posts[0]+t.goals.stories[0]+t.goals.ads[0], tot=t.goals.posts[1]+t.goals.stories[1]+t.goals.ads[1];
  t.status = done>=tot ? 'done':'pend'; if(d>0)flashFx(); render();
}
function cota(id,d){ const t=findTask(id); t.cota[0]=Math.max(0,Math.min(t.cota[1],t.cota[0]+d));
  t.status = t.cota[0]>=t.cota[1]?'done':'pend'; if(d>0)flashFx(); render();
}

function isoFromSched(s){ if(!s||s.indexOf('/')<0)return ''; const [d,m]=s.split('/'); return `${cur.slice(0,4)}-${m}-${d}`; }

let formCat='pessoal', formPrio=null;
let formRecur={type:'none',days:[],dom:20,date:''};
const WDSHORT=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MESSHORT=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
let recCalM='';
function daysLabel(days){ if(!days||!days.length)return ''; const s=[...days].sort((a,b)=>a-b); const j=s.join(',');
  if(j==='0,1,2,3,4,5,6')return 'todos os dias'; if(j==='1,2,3,4,5')return 'dias úteis'; if(j==='0,6')return 'fim de semana';
  return s.map(i=>WDSHORT[i]).join(' · '); }
function recLabel(fr){ if(!fr||fr.type==='none')return 'Não se repete';
  if(fr.type==='diario')return 'Diário';
  if(fr.type==='semanal')return (fr.days&&fr.days.length)?('Semanal · '+daysLabel(fr.days)):'Semanal';
  if(fr.type==='mensal')return 'Mensal · dia '+(fr.dom||1);
  if(fr.type==='anual'){ if(!fr.date)return 'Anual'; const [m,d]=fr.date.split('-'); return 'Anual · '+(+d)+' de '+MESSHORT[(+m)-1]; }
  return 'Não se repete'; }
function syncRecBtn(){ const b=document.getElementById('recBtnTxt'); if(b)b.textContent=recLabel(formRecur); }
function toggleRecPanel(){ const p=document.getElementById('recPanel'); if(!p)return;
  p.classList.toggle('hidden'); if(!p.classList.contains('hidden')){ markRecType(); renderRecSub(); } }
function markRecType(){ document.querySelectorAll('.rtype').forEach(x=>x.classList.toggle('sel', x.dataset.r===formRecur.type)); }
function pickRecType(tp){ formRecur.type=tp;
  if(tp==='semanal'&&!formRecur.days)formRecur.days=[];
  if(tp==='mensal'&&!formRecur.dom)formRecur.dom=(+cur.slice(8,10)||1);
  if(tp==='anual'&&!formRecur.date)formRecur.date=cur.slice(5);
  markRecType(); syncRecBtn();
  if(tp==='none'||tp==='diario'){ document.getElementById('recSub').innerHTML=''; document.getElementById('recPanel').classList.add('hidden'); return; }
  renderRecSub();
}
function renderRecSub(){ const h=document.getElementById('recSub'); if(!h)return; let html='';
  if(formRecur.type==='semanal'){
    html=`<div class="reclbl">Em quais dias?</div><div class="wdrow">`+
      WDSHORT.map((w,i)=>`<div class="wdopt ${(formRecur.days||[]).includes(i)?'sel':''}" data-d="${i}" onclick="toggleWd(this)">${w}</div>`).join('')+`</div>`;
  } else if(formRecur.type==='mensal'||formRecur.type==='anual'){
    recCalM = formRecur.type==='anual'&&formRecur.date ? (cur.slice(0,4)+'-'+formRecur.date.split('-')[0]+'-01') : (cur.slice(0,8)+'01');
    html=`<div class="reclbl">${formRecur.type==='mensal'?'Escolha o dia do mês':'Escolha a data'}</div><div id="recCalHost"></div>`;
  }
  h.innerHTML=html; if(formRecur.type==='mensal'||formRecur.type==='anual')renderRecCal();
}
function toggleWd(el){ el.classList.toggle('sel'); const i=+el.dataset.d; formRecur.days=formRecur.days||[];
  if(el.classList.contains('sel')){ if(!formRecur.days.includes(i))formRecur.days.push(i); }
  else formRecur.days=formRecur.days.filter(x=>x!==i);
  syncRecBtn(); }
function recCalShift(n){ const [y,m]=recCalM.split('-').map(Number); const d=new Date(y,m-1+n,1);
  recCalM=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01'; renderRecCal(); }
function renderRecCal(){ const host=document.getElementById('recCalHost'); if(!host)return;
  const [y,m]=recCalM.split('-').map(Number);
  const start=new Date(y,m-1,1).getDay(), dim=new Date(y,m,0).getDate();
  let cells='';
  const cell=(dt,other)=>{ const iso=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
    let cls='cell'; if(other)cls+=' other';
    if(formRecur.type==='mensal'){ if(!other && dt.getDate()===(+formRecur.dom))cls+=' sel'; }
    else { if(iso.slice(5)===formRecur.date && !other)cls+=' sel'; }
    return `<div class="${cls}" onclick="pickRecCal('${iso}',${other?1:0})">${dt.getDate()}</div>`; };
  for(let i=0;i<start;i++)cells+=cell(new Date(y,m-1,1-(start-i)),true);
  for(let d=1;d<=dim;d++)cells+=cell(new Date(y,m-1,d),false);

/* ---- ditado por voz ---- */
/* A API devolve o texto todo em minuscula. Nota e tarefa sao frases, entao
   sobem a primeira letra — pedido do Igor. */
var _rec=null, _recBt=null;
function _temVoz(){ return !!(window.SpeechRecognition||window.webkitSpeechRecognition); }
function ditarPara(bt, alvoId){
  var Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!Rec) return;
  if(_rec){ _rec.stop(); return; }          /* tocar de novo encerra */
  _rec=new Rec(); _rec.lang="pt-BR"; _rec.interimResults=false; _rec.continuous=false;
  _recBt=bt; bt.classList.add("rec");
  _rec.onresult=function(ev){
    var t=String((ev.results[0][0].transcript)||"").trim();
    if(!t) return;
    var campo=document.getElementById(alvoId);
    if(!campo) return;
    var novo=maiusculaNaPrimeira(t);
    /* se ja havia texto, a voz continua a frase em vez de apagar o que estava */
    campo.value = campo.value.trim() ? (campo.value.replace(/\s+$/,"")+" "+t) : novo;
    try{ campo.focus(); campo.setSelectionRange(campo.value.length, campo.value.length); }catch(e){}
  };
  _rec.onend=function(){ if(_recBt) _recBt.classList.remove("rec"); _recBt=null; _rec=null; };
  _rec.onerror=function(){ if(_recBt) _recBt.classList.remove("rec"); _recBt=null; _rec=null; };
  _rec.start();
}
/* onclick direto, e nao delegacao: a folha do Norte e montada com
   onclick="event.stopPropagation()", entao clique de dentro dela NUNCA chega
   ao document. Era por isso que o microfone nao respondia — nem na nota, nem
   na tarefa, que usam a mesma folha. */
function micHTML(alvoId){
  return _temVoz() ? ('<button type="button" class="micbt" data-mic="'+alvoId+'" onclick="ditarPara(this,\''+alvoId+'\')" title="Ditar" aria-label="Ditar">'+svgIc("mic")+'</button>') : "";
}
/* ---- notas ---- */
/* A nota era uma string. Virou {t,dt,fix} pra carregar data e o "fica pro dia
   seguinte" — mas as antigas continuam string no aparelho de quem já usava,
   entao toda leitura passa por aqui. */
function notaDe(o){
  if(typeof o === 'string') return { t:o, dt:'', fix:false };
  return { t:(o&&o.t)||'', dt:(o&&o.dt)||'', fix:!!(o&&o.fix) };
}
function dataCurta(iso){
  if(!iso) return '';
  const p=String(iso).split('-');
  return p.length>=3 ? (p[2]+'/'+p[1]) : '';
}
/* a voz devolve tudo em minuscula: a nota comeca como frase */
function maiusculaNaPrimeira(t){
  const s=String(t||'').trim();
  return s ? s.charAt(0).toUpperCase()+s.slice(1) : s;
}
let _obsAnim=-1, _obsEdit=-1;
/* a nota nova ainda nao existe na lista, entao carrega o proprio estado do
   interruptor aqui ate ser salva */
let _obsFixNovo=false, _obsTxtPend="";
function addObs(){ abreObs(-1); }
function abreObs(i){ _obsEdit = (typeof i === "number") ? i : -1; _obsFixNovo = false;
  const novo = _obsEdit < 0, N = novo ? {t:'',dt:'',fix:false} : notaDe((day().obs||[])[_obsEdit]);
  const atual = N.t;
  sheet(`<h3 style="color:var(--note-txt)">🖋️ ${novo?"Nova nota":"Editar nota"}</h3>
    <div class="field linhamic"><textarea id="obsInput" placeholder="Escreva sua nota..." data-kb="text" style="min-height:100px;font-family:'Nota',cursive;font-size:19px;line-height:1.5;color:var(--note-txt2);background:rgba(253,230,138,0.06);border-color:var(--note-line)"></textarea>${micHTML("obsInput")}</div>
    <div class="swfix${N.fix?' on':''}" id="swFixa" onclick="fixaObs()">
      <span class="ic">${svgIc('pin')}</span>
      <span class="tt"><div class="t1">Fica todo dia</div>
        <div class="t2">Acompanha os dias até você desligar</div></span>
      <span class="tog${N.fix?' on':''}"><i></i></span></div>
    <button type="button" class="linkacao" onclick="obsViraTarefa()">${svgIc('arrow')}Virar tarefa</button>
    <div class="actions"><button class="btn-ghost" onclick="closeSheet()">Cancelar</button><button class="btn-primary" style="background:var(--note-bg);color:var(--note-on)" onclick="saveObs()">${novo?"Adicionar":"Salvar"}</button></div>`);
  setTimeout(()=>{ const el=document.getElementById('obsInput'); if(!el) return;
    if(atual){ el.value = atual; }
    /* Editar abre a folha pra LER: o teclado subindo sozinho cobre metade da
       tela antes de você decidir o que quer. Pra alterar, toca no texto.
       Nota NOVA continua focando — ali o único motivo de estar aqui é escrever. */
    if(!novo) return;
    el.focus(); try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){}
  },90); }
function saveObs(){ const el=document.getElementById('obsInput'); const v=el?el.value.trim():''; if(!v){ if(el)el.focus(); return; }
  const L=(day().obs=day().obs||[]);
  if(_obsEdit>=0 && _obsEdit<L.length){
    const N=notaDe(L[_obsEdit]);
    L[_obsEdit]={ t:v, dt:N.dt||cur, fix:N.fix };
    _obsAnim=_obsEdit;
  }
  else { L.push({ t:v, dt:cur, fix:_obsFixNovo }); _obsAnim=L.length-1; _obsFixNovo=false; }
  _obsEdit=-1; closeSheet();
  if(navigator.vibrate)navigator.vibrate(14); render(); }

/* Nota fixada acompanha os dias, igual a tarefa pendente. As outras ficam no
   dia em que foram escritas — e continuam la, navegando pra tras. */
function fixaObs(){
  /* nota nova: nao ha o que salvar ainda, so o interruptor virando */
  if(_obsEdit<0){
    _obsFixNovo = !_obsFixNovo;
    const sw=document.getElementById("swFixa");
    if(sw){ sw.classList.toggle("on",_obsFixNovo);
            const t=sw.querySelector(".tog"); if(t) t.classList.toggle("on",_obsFixNovo); }
    if(navigator.vibrate)navigator.vibrate(10);
    return;
  }
  const L=day().obs||[]; if(_obsEdit>=L.length) return;
  const N=notaDe(L[_obsEdit]);
  const lig = !N.fix;
  L[_obsEdit]={ t:N.t, dt:N.dt||cur, fix:lig };
  save(); render();                       /* a lista atrás acompanha na hora */
  /* interruptor não fecha a folha: ele vira em pé, como todo interruptor.
     Só o estado muda aqui — o texto continua sendo commitado no Salvar. */
  const row=document.getElementById('swFixa');
  if(row){ row.classList.toggle('on', lig);
    const t=row.querySelector('.tog'); if(t) t.classList.toggle('on', lig); }

/* Uma nota que virou tarefa cumpriu o papel dela: sai da lista de notas, em

function obsViraTarefa(){

/* ---- navegação de dias + novo dia ---- */
function nav(n){ const iso=shiftISO(cur,n); if(!DB.days[iso]){ DB.days[iso]=buildNewDay(iso); } cur=iso; render(); }
let calMonth;
function openCalendar(e){ if(e)e.stopPropagation(); const p=document.getElementById('calPop');
  if(!p.classList.contains('hidden')){ p.classList.add('hidden'); return; }
  calMonth=cur.slice(0,8)+'01'; renderCal(); p.classList.remove('hidden'); }
function closeCal(){ document.getElementById('calPop').classList.add('hidden'); }
function calShift(n){ const [y,m]=calMonth.split('-').map(Number); const d=new Date(y,m-1+n,1);
  calMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01'; renderCal(); }
function renderCal(){
  const [y,m]=calMonth.split('-').map(Number);
  const first=new Date(y,m-1,1), start=first.getDay(), dim=new Date(y,m,0).getDate();
  const t=todayISO();
  let cells='';
  for(let i=0;i<start;i++){ const dp=new Date(y,m-1,1-(start-i)); cells+=dayCell(dp,y,m,t,true); }
  for(let d=1; d<=dim; d++){ cells+=dayCell(new Date(y,m-1,d),y,m,t,false); }
  const rest=(start+dim)%7; if(rest) for(let i=1;i<=7-rest;i++){ cells+=dayCell(new Date(y,m,i),y,m,t,true); }
  document.getElementById('calPop').innerHTML=
    `<div class="ch"><button onclick="calShift(-1)">‹</button><b>${MES[m-1]} ${y}</b><button onclick="calShift(1)">›</button></div>
     <div class="wd"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
     <div class="grid">${cells}</div>`;
}
function dayCell(dt,y,m,t,other){
  const iso=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  let cls='cell'; if(other||dt.getMonth()!==m-1)cls+=' other'; if(iso===t)cls+=' today'; if(iso===cur)cls+=' sel';
  const dot = DB.days[iso] ? '<span class="dot"></span>' : '';
  return `<div class="${cls}" onclick="pickCal('${iso}')">${dt.getDate()}${dot}</div>`;
}
