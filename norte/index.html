<style>

  [data-theme="light"] .legend,[data-theme="light"] .goals-box{ box-shadow:0 2px 8px rgba(23,37,60,.06); }
  [data-theme="light"] .secttl{ color:#2a2f36; }
  [data-theme="light"] .item.done{ background:#eefaf2; }
  [data-theme="light"] .item.prio{ background:#fdf6e8; }
  [data-theme="light"] .item.priomax{ background:#fdeede; }
  [data-theme="light"] .item.canc{ background:#fbeef0; }
  [data-theme="light"] .item.adiado{ background:#eef3f8; }
  [data-theme="light"] .box{ border-color:#c3c8ce; }
  [data-theme="light"] .sub{ color:#4a525a; }
  [data-theme="light"] .sub .sbox{ border-color:#c3c8ce; }
  [data-theme="light"] .secttl{ color:#3a4048; }
  [data-theme="light"] .legend{ background:#fff; }
  [data-theme="light"] .cat .cadd{ border-color:#cfd4da; color:#6b7278; }
  [data-theme="light"] .goals-box{ background:#f2fbfc; border-color:#cfeef0; }
  [data-theme="light"] .gbtn{ background:#eaf7f8; }
  [data-theme="light"] .subadd{ color:#2f8078; border-color:#bfe4df; }

  [data-theme="light"] .tag.done{ background:#dff5e8; color:#1f7a4d; border-color:#b6e2c8; }
  [data-theme="light"] .tag.canc{ background:#fbe0e2; color:#c23b45; border-color:#f0c0c4; }
  [data-theme="light"] .tag.sched{ background:#e9e4fb; color:#6a55c0; border-color:#d0c6f0; }
  [data-theme="light"] .tag.adiado{ background:#e4eefb; color:#3a6aa8; border-color:#c4d8f0; }
  [data-theme="light"] .rchip{ background:#dff5e8; color:#1f7a4d; border-color:#b6e2c8; }
  [data-theme="light"] .sheet{ background:#fff; }
  [data-theme="light"] .field input,[data-theme="light"] .field textarea,[data-theme="light"] .field select,
  [data-theme="light"] .catopt,[data-theme="light"] .popt,[data-theme="light"] .wdopt{ background:#f5f6f8; border-color:#d6dae0; color:#1a1d21; }

  [data-theme="light"] .rtype.sel{ border-color:#2FD9C9; background:#e7fbfa; color:#12857c; }
  [data-theme="light"] .recpanel{ border-color:#e4e7eb; }
  [data-theme="light"] .calpop.inline{ background:#fff; }
  [data-theme="light"] .btn-ghost{ background:#eef0f3; color:#1a1d21; }
  [data-theme="light"] .act-list button{ background:#f5f6f8; border-color:#e0e3e8; color:#1a1d21; }
  [data-theme="light"] .calpop{ background:#fff; }
  [data-theme="light"] .calpop .ch button{ background:#eef0f3; border-color:#d6dae0; color:#1a1d21; }
  [data-theme="light"] .calpop .cell{ color:#333; }
  [data-theme="light"] .calpop .cell.other{ color:#b8bec4; }

  [data-theme="light"] .obs-box{ background:#fffaea; border-color:#ece0b0; }
  [data-theme="light"] .oi{ color:#7a6a2a; }
  [data-theme="light"] .obs-empty{ color:#b0a674; }
  [data-theme="light"] .chkrow{ color:#1a1d21; border-color:#e4e7eb; }
  [data-theme="light"] footer{ color:#8a9098; }
  [data-theme="light"] .es-mut{ color:#6b7278 !important; }
  [data-theme="light"] .es-strong{ color:#3a4048 !important; }

  /* ==== tema MIRI (creme/taupe do Daybook) ==== */

    --bg:#F3EFE5; --panel:#FBF7EE; --panel2:#F7F2E9; --line:#E3D9C7; --line2:#E7DECF;
    --txt:#46423A; --txt2:#2f2b23; --mut:#8C8676; --mut2:#6E6656;
    --accent:#c06a52; --green:#5c9a6b; --star:#C9922E; --orange:#b3603f;
  }
  [data-theme="miri"] header h1{ color:#2f2b23; }
  [data-theme="miri"] .navbtn{ background:#EFE7D8; color:#46423A; }
  [data-theme="miri"] .menu{ background:#FBF7EE; }
  [data-theme="miri"] .menu button{ color:#46423A; }
  [data-theme="miri"] .menu button:active{ background:#EFE7D8; }
  [data-theme="miri"] .track,[data-theme="miri"] .tbar .ttrack,[data-theme="miri"] .gr .gtrack{ background:#E7DECF; }
  [data-theme="miri"] .item{ background:#FBF7EE; box-shadow:0 1px 2px rgba(70,60,40,.06); }
  [data-theme="miri"] .item.done{ background:#eaf1e6; }
  [data-theme="miri"] .item.prio{ background:#f7efdc; }
  [data-theme="miri"] .item.priomax{ background:#f6e6dc; }
  [data-theme="miri"] .item.canc{ background:#f4e6e2; }
  [data-theme="miri"] .item.adiado{ background:#eceee6; }
  [data-theme="miri"] .box{ border-color:#C7B7A2; }
  [data-theme="miri"] .sub{ color:#6E6656; }
  [data-theme="miri"] .sub .sbox{ border-color:#C7B7A2; }
  [data-theme="miri"] .secttl{ color:#6E6656; }
  [data-theme="miri"] .legend{ background:#FBF7EE; }
  [data-theme="miri"] .cat .cadd{ border-color:#D9CDB8; color:#8C8676; }
  [data-theme="miri"] .goals-box{ background:#f6efe1; border-color:#e2d3bb; }
  [data-theme="miri"] .gbtn{ background:#f0e6d3; color:#c06a52; }
  [data-theme="miri"] .subadd{ color:#a6604a; border-color:#e0cdbe; }
  [data-theme="miri"] .sub .subdel{ color:#b3a992; }
  [data-theme="miri"] .tag.pend{ background:#f4e7c6; color:#8a6a1e; border-color:#e2cf9e; }
  [data-theme="miri"] .tag.done{ background:#e3efd9; color:#4a7a3d; border-color:#cfe0b8; }
  [data-theme="miri"] .tag.canc{ background:#f3ddd6; color:#b0503a; border-color:#e6c3b6; }
  [data-theme="miri"] .tag.sched{ background:#ece3e8; color:#8a5a78; border-color:#dcc9d4; }
  [data-theme="miri"] .tag.adiado{ background:#e2e8ee; color:#5a7088; border-color:#cdd8e2; }
  [data-theme="miri"] .rchip{ background:#e3efd9; color:#4a7a3d; border-color:#cfe0b8; }
  [data-theme="miri"] .sheet{ background:#FBF7EE; }
  [data-theme="miri"] .field input,[data-theme="miri"] .field textarea,[data-theme="miri"] .field select,
  [data-theme="miri"] .catopt,[data-theme="miri"] .popt,[data-theme="miri"] .wdopt{ background:#F3EDE0; border-color:#DED2BC; color:#46423A; }
  [data-theme="miri"] .wdopt.sel{ border-color:#c06a52; background:#f4e6df; color:#a6543c; }
  [data-theme="miri"] .recbtn,[data-theme="miri"] .rtype{ background:#F3EDE0; border-color:#DED2BC; color:#46423A; }
  [data-theme="miri"] .rtype.sel{ border-color:#c06a52; background:#f4e6df; color:#a6543c; }
  [data-theme="miri"] .recpanel{ border-color:#E3D9C7; }
  [data-theme="miri"] .calpop.inline{ background:#FBF7EE; }
  [data-theme="miri"] .btn-ghost{ background:#EFE7D8; color:#46423A; }
  [data-theme="miri"] .act-list button{ background:#F3EDE0; border-color:#E3D9C7; color:#46423A; }
  [data-theme="miri"] .calpop{ background:#FBF7EE; }
  [data-theme="miri"] .calpop .ch button{ background:#EFE7D8; border-color:#DED2BC; color:#46423A; }
  [data-theme="miri"] .calpop .cell{ color:#5E574A; }
  [data-theme="miri"] .calpop .cell.other{ color:#c3b8a2; }
  [data-theme="miri"] .calpop .cell:active{ background:#EFE7D8; }
  [data-theme="miri"] .obs-box{ background:#f7f0dc; border-color:#e4d6b0; }

  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ background:var(--bg); }
  body{ font-family:"Segoe UI",Arial,sans-serif; color:var(--txt);
        padding:14px 12px calc(120px + env(safe-area-inset-bottom)); max-width:820px; margin:0 auto;
        -webkit-print-color-adjust:exact; print-color-adjust:exact; }

  /* ===== top toolbar ===== */
  .toolbar{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .navbtn{ background:#15181c; border:1px solid var(--line); color:var(--txt); border-radius:10px;
           height:40px; min-width:40px; padding:0 12px; font-size:15px; font-weight:700; cursor:pointer;
           display:flex; align-items:center; justify-content:center; gap:6px; }
  .navbtn:active{ transform:scale(.96); }
  .navbtn.today{ color:var(--accent); border-color:#1e3a40; }
  .datepill{ flex:1; text-align:center; font-size:13px; font-weight:700; color:var(--mut2); }
  .menu-wrap{ position:relative; }
  .menu{ position:absolute; right:0; top:48px; z-index:40; min-width:240px; padding:7px;
         background:rgba(18,21,25,.97); border:1px solid var(--line); border-radius:16px;
         box-shadow:0 20px 54px rgba(0,0,0,.62); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
         animation:menuPop .18s cubic-bezier(.2,.95,.3,1); transform-origin:top right; }
  @keyframes menuPop{ from{ opacity:0; transform:translateY(-8px) scale(.96); } to{ opacity:1; transform:none; } }
  .menu button{ display:flex; width:100%; align-items:center; gap:12px; background:none; border:none; color:var(--txt);
                font-size:14px; font-weight:600; padding:9px 10px; border-radius:12px; cursor:pointer; text-align:left;
                transition:background .16s ease, transform .1s ease; }
  .menu button:hover{ background:rgba(255,255,255,.055); }
  .menu button:active{ background:rgba(255,255,255,.09); transform:scale(.98); }
  .menu .mi{ width:32px; height:32px; flex-shrink:0; border-radius:10px; background:rgba(47,217,201,.13);
             display:inline-flex; align-items:center; justify-content:center; font-size:15px; }
  .menu button em{ font-style:normal; font-size:10.5px; font-weight:600; color:var(--mut); margin-left:auto; padding-left:8px; white-space:nowrap; }
  .menu .mdiv{ height:1px; background:var(--line); margin:6px 8px 4px; }
  .menu .mdel{ color:#ff6b7a; }
  .menu .mdel .mi{ background:rgba(239,68,68,.16); }
  .menu .mdel:hover{ background:rgba(239,68,68,.10); }
  .menu .mdel:active{ background:rgba(239,68,68,.18); }
  [data-theme="light"] .menu{ background:rgba(255,255,255,.98); }
  [data-theme="miri"] .menu{ background:rgba(251,247,238,.98); }
  .hidden{ display:none !important; }

  header{ border-bottom:3px solid var(--accent); padding-bottom:14px; margin-bottom:16px; text-align:center; }
  header .kicker{ font-size:22px; font-weight:800; letter-spacing:4px; text-transform:uppercase; color:var(--accent); }
  header h1{ font-size:22px; color:#fff; margin-top:5px; font-weight:700; }

  .bar{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .bar .count{ font-size:12px; color:#c7ced3; font-weight:600; }
  .track{ flex:1; height:12px; background:#1c1f22; border-radius:20px; overflow:hidden; }
  .fill{ height:100%; background:var(--green); border-radius:20px; transition:width .4s cubic-bezier(.4,1.3,.5,1); }

  .legend{ display:flex; flex-wrap:wrap; gap:12px; padding:10px 13px; background:var(--panel2);
           border:1px solid var(--line2); border-radius:10px; margin-bottom:20px; }
  .legend .lg{ display:flex; align-items:center; gap:6px; font-size:11px; color:#c7ced3; }
  .legend .chip{ width:11px; height:11px; border-radius:3px; box-shadow:inset 0 0 0 1px rgba(128,128,128,.45); }

  .secttl{ font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:1.2px; color:#c7ced3; margin:2px 0 12px; }
  .cat{ margin-bottom:18px; }
  .cat .chead{ display:flex; align-items:center; gap:9px; margin-bottom:9px; }
  .cat .cbar{ width:5px; height:17px; border-radius:3px; box-shadow:inset 0 0 0 1px rgba(128,128,128,.45); }
  .cat .cname{ font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:1px; }
  .cat .cadd{ margin-left:auto; background:none; border:1px dashed #33383e; color:var(--mut2);
              font-size:11px; font-weight:700; border-radius:7px; padding:5px 10px; cursor:pointer; }
  .cat .cadd:active{ transform:scale(.95); }

  .item{ display:flex; align-items:flex-start; gap:12px; background:var(--panel); border:1px solid var(--line);
         border-left-width:4px; border-radius:9px; padding:13px 14px; margin-bottom:8px; }
  .item.done{ background:#0f1e17; }
  .item.priomax{ border-color:var(--orange)!important; background:#1b1108; box-shadow:inset 0 0 0 1px rgba(249,115,22,.28); }
  .item.prio{ border-color:var(--amber)!important; background:#17140d; box-shadow:inset 0 0 0 1px rgba(240,180,94,.26); }
  .item.canc{ background:#140d0e; }
  .item.canc .t{ color:#8a7f7f; text-decoration:none; }
  .item.blocked{ position:relative; }
  .item.blocked::after{ content:""; position:absolute; inset:0; background:var(--catcolor,#7a8288); opacity:.2;
                      border-radius:9px; pointer-events:none; }
  .item.blocked .box, .item.blocked .tag, .item.blocked .rchip{ position:relative; z-index:2; }  /* etiqueta/recorrencia acima da pelicula */
  .item.adiado{ opacity:.74; background:#0e1216; }
  .box{ flex-shrink:0; width:23px; height:23px; border-radius:6px; border:2.5px solid #3a3f45; margin-top:1px;
        cursor:pointer; position:relative; transition:transform .12s; }
  .box:active{ transform:scale(.85); }
  .item.done .box{ background:var(--green); border-color:var(--green); }
  .item.done .box::after{ content:"✓"; color:#05130b; font-size:15px; font-weight:800; position:absolute; top:-2px; left:4px; }
  .item.canc .box{ border-style:dashed; border-color:#5c2a2f; }
  .item.blocked .box{ border-style:dashed; border-color:#5a4fa0; }
  .schedtoday{ color:#b9a9f5!important; }
  .item.adiado .box{ border-style:dashed; border-color:#3a5570; }
  .txt{ flex:1; min-width:0; }
  .txt .t{ font-size:14.5px; font-weight:600; line-height:1.3; color:var(--txt2); }
  .txt .m{ font-size:11px; color:var(--mut); margin-top:3px; }
  .pchip{ display:inline-block; font-size:9px; font-weight:800; letter-spacing:.6px; text-transform:uppercase;
          color:#fff; background:var(--orange); padding:3px 7px; border-radius:5px; margin-left:7px; vertical-align:2px; }
  .pchip.star{ background:var(--star); color:#1a1204; }
  .rchip{ display:inline-block; font-size:8.5px; font-weight:800; letter-spacing:.5px; text-transform:uppercase;
          color:#7ee2b8; background:#0f2b1a; border:1px solid #1f5c37; padding:3px 7px; border-radius:5px; margin-left:7px; vertical-align:2px; }
  .cflag{ display:inline-block; font-size:8.5px; font-weight:700; letter-spacing:.3px; text-transform:uppercase; color:var(--mut2); margin-left:7px; }

  .subs{ margin-top:9px; display:flex; flex-direction:column; gap:6px; }
  .sub{ display:flex; align-items:center; gap:9px; font-size:12px; color:#b7c0c6; cursor:pointer; }
  .sub .sbox{ width:18px; height:18px; border-radius:5px; border:2px solid #3a3f45; flex-shrink:0; transition:transform .12s; }
  .sub:active .sbox{ transform:scale(.82); }
  .sub.sdone .sbox{ background:var(--green); border-color:var(--green); position:relative; }
  .sub.sdone .sbox::after{ content:"✓"; color:#05130b; font-size:10px; font-weight:800; position:absolute; top:-2px; left:2px; }
  .sub.sdone{ color:#8fb39f; }
  .sub .subdel{ margin-left:auto; color:#556; font-size:12px; padding:0 4px; }
  .subadd{ display:inline-block; margin-top:9px; font-size:11px; font-weight:700; color:#6a8c85;
           border:1px dashed #2c4a45; border-radius:7px; padding:5px 11px; cursor:pointer; }
  .subadd:active{ transform:scale(.95); }
  @keyframes subIn{ from{ opacity:0; transform:translateX(-9px); } to{ opacity:1; transform:none; } }
  .sub.new, .subrow.new{ animation:subIn .34s cubic-bezier(.2,.9,.3,1); }
  .tbar{ display:flex; align-items:center; gap:9px; margin-top:8px; }
  .tbar .ttrack{ flex:1; max-width:200px; height:6px; background:#1c1f22; border-radius:20px; overflow:hidden; }
  .tbar .tfill{ height:100%; background:var(--green); border-radius:20px; transition:width .3s; }
  .tbar .tcount{ font-size:10px; color:var(--mut2); font-weight:700; }

  .tag{ flex-shrink:0; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px;
        padding:4px 9px; border-radius:20px; margin-top:2px; cursor:pointer; }
  .tag.pend{ background:#2e2410; color:var(--amber); border:1px solid #5a4620; }
  .tag.done{ background:#0f2b1a; color:#7ee2b8; border:1px solid #1f5c37; }
  .tag.canc{ background:#2b1214; color:var(--canc); border:1px solid #5c2a2f; }
  .tag.sched{ background:#1a1533; color:var(--sched); border:1px solid #362c5c; }
  .tag.adiado{ background:#15202b; color:var(--adia); border:1px solid #2c4256; }

  /* METAS goals box */
  .goals-box{ background:#0d1417; border:1px solid #1e3a40; border-radius:9px; padding:12px 14px; margin-top:10px; }
  .gr{ display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  .gr:last-child{ margin-bottom:0; }
  .gr .gname{ width:58px; flex-shrink:0; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:#c7ced3; }
  .gr .gtrack{ flex:1; height:9px; background:#16191c; border-radius:20px; overflow:hidden; }
  .gr .gfill{ height:100%; background:var(--accent); border-radius:20px; transition:width .3s; }
  .gr .gnum{ width:44px; flex-shrink:0; text-align:center; font-size:11px; font-weight:700; color:var(--txt); }
  .gbtn{ width:26px; height:26px; flex-shrink:0; border-radius:7px; border:1px solid #2a3238; background:#141a1e;
         color:var(--accent); font-size:16px; font-weight:800; cursor:pointer; line-height:1; }
  .gbtn:active{ transform:scale(.86); }

  .obs{ margin-top:20px; }
  .obs-h{ display:flex; align-items:center; gap:9px; font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:#FDE68A; margin-bottom:10px; }
  .obs-h .cbar{ width:5px; height:17px; border-radius:3px; background:#FDE68A; }
  .obs-h .cadd{ margin-left:auto; background:none; border:1px dashed #4a4326; color:#c9bd85; font-size:11px; font-weight:700; border-radius:7px; padding:5px 10px; cursor:pointer; }
  .obs-box{ background:rgba(253,230,138,0.06); border:1px solid #4a4326; border-left:4px solid #FDE68A; border-radius:9px; padding:12px 15px; }
  .obs-empty{ font-family:"Segoe Print","Bradley Hand ITC",cursive; font-size:15px; color:#9a9068; }
  .oi{ font-family:"Segoe Print","Bradley Hand ITC",cursive; font-size:16px; color:#e9dba3; line-height:1.5; padding:5px 0; display:flex; gap:9px; align-items:flex-start; }
  .oi:before{ content:"•"; color:#FDE68A; }

  footer{ margin-top:22px; padding-top:12px; border-top:1px solid var(--line2); font-size:10px; color:#6b7378; text-align:center; }

  /* FAB */
  .fab{ position:fixed; right:18px; bottom:calc(90px + env(safe-area-inset-bottom)); width:56px; height:56px; border-radius:50%;

  nav button .ic svg{ width:23px; height:23px; }

  nav button.on .ic{ opacity:1; transform:translateY(-1px) scale(1.07); }

  [data-theme="light"] nav .navbar{ background:rgba(255,255,255,.9); border-color:rgba(0,0,0,.06); }
  [data-theme="miri"] nav .navbar{ background:rgba(251,247,238,.9); border-color:rgba(0,0,0,.06); }

  /* aba Progresso */
  .progview{ position:fixed; inset:0; z-index:15; background:var(--bg); overflow:auto;
             padding:16px 14px calc(96px + env(safe-area-inset-bottom)); max-width:820px; margin:0 auto; }
  .progview.hidden{ display:none; }
  .prog-top{ display:flex; align-items:center; margin:2px 0 16px; }
  .prog-top h2{ font-size:21px; color:var(--txt2); font-weight:800; }
  .prog-seg{ display:flex; gap:8px; margin-bottom:15px; }
  .prog-seg button{ flex:1; padding:11px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--mut); font-size:13px; font-weight:700; cursor:pointer; transition:.15s; }
  .prog-seg button.on{ background:var(--accent); color:#04191a; border-color:var(--accent); }
  .prog-seg button:active{ transform:scale(.97); }
  .prog-kpis{ display:flex; gap:9px; margin-bottom:15px; }
  .pk{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 8px; text-align:center; }
  .pkv{ font-size:23px; font-weight:800; color:var(--accent); }
  .pkl{ font-size:10px; color:var(--mut); text-transform:uppercase; letter-spacing:.4px; margin-top:3px; }
  .prog-chart{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px 8px 10px; }
  .prog-empty{ text-align:center; color:var(--mut); padding:46px 20px; font-size:14px; line-height:1.7; }

  /* modal / sheet */
  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
  .sheet{ width:100%; max-width:560px; background:#101317; border:1px solid var(--line); border-bottom:none;
          border-radius:18px 18px 0 0; padding:18px 16px calc(20px + env(safe-area-inset-bottom)); max-height:90vh; overflow:auto;
          animation:up .22s cubic-bezier(.2,.9,.3,1); }
  @keyframes up{ from{ transform:translateY(40px); opacity:.4 } to{ transform:translateY(0); opacity:1 } }
  .sheet h3{ font-size:16px; color:#fff; margin-bottom:14px; }
  .field{ margin-bottom:13px; }
  .field label{ display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--mut2); margin-bottom:6px; }
  .field input, .field textarea, .field select{ width:100%; background:#0b0e11; border:1px solid #2a2f35; color:var(--txt);
        border-radius:10px; padding:11px 12px; font-size:14px; font-family:inherit; }
  .field textarea{ min-height:64px; resize:vertical; }
  .catrow{ display:flex; flex-wrap:wrap; gap:8px; }
  .catopt{ display:flex; align-items:center; gap:7px; padding:9px 12px; border-radius:10px; border:1.5px solid #2a2f35;
           background:#0b0e11; cursor:pointer; font-size:12.5px; font-weight:600; }
  .catopt .dot{ width:12px; height:12px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(128,128,128,.5); }
  .catopt.sel{ border-color:var(--accent); background:#0d1a1c; }
  .prow{ display:flex; gap:8px; }
  .popt{ flex:1; text-align:center; padding:10px; border-radius:10px; border:1.5px solid #2a2f35; background:#0b0e11; cursor:pointer; font-size:12px; font-weight:700; }
  .popt.sel{ border-color:var(--star); background:#17140d; color:var(--star); }
  .popt.sel.max{ border-color:var(--orange); background:#1b1108; color:var(--orange); }
  .wdrow{ display:flex; flex-wrap:wrap; gap:6px; }
  .wdopt{ width:46px; text-align:center; padding:9px 0; border-radius:9px; border:1.5px solid #2a2f35; background:#0b0e11; cursor:pointer; font-size:11.5px; font-weight:700; color:var(--txt); transition:transform .1s; }
  .wdopt:active{ transform:scale(.9); }
  .wdopt.sel{ border-color:var(--accent); background:#0d1a1c; color:var(--accent); }
  .recbtn{ width:100%; display:flex; align-items:center; gap:8px; background:#0b0e11; border:1px solid #2a2f35; color:var(--txt); border-radius:10px; padding:11px 12px; font-size:14px; font-family:inherit; cursor:pointer; }
  .recbtn:active{ transform:scale(.99); }
  .recpanel{ margin-top:10px; border:1px solid #22272c; border-radius:12px; padding:12px; }
  .rtyperow{ display:flex; flex-wrap:wrap; gap:6px; }
  .rtype{ padding:8px 13px; border-radius:9px; border:1.5px solid #2a2f35; background:#0b0e11; cursor:pointer; font-size:12px; font-weight:700; color:var(--txt); transition:transform .1s; }
  .rtype:active{ transform:scale(.92); }
  .rtype.sel{ border-color:var(--accent); background:#0d1a1c; color:var(--accent); }
  .reclbl{ font-size:10.5px; color:var(--mut2); font-weight:700; text-transform:uppercase; letter-spacing:.4px; margin:12px 0 7px; }
  .calpop.inline{ position:static; transform:none; left:auto; top:auto; width:auto; box-shadow:none; border:1px solid #22272c; padding:11px; }
  .sheet .actions{ display:flex; gap:10px; margin-top:8px; }
  .sheet .actions button{ flex:1; padding:13px; border-radius:11px; border:none; font-size:14px; font-weight:700; cursor:pointer; }
  .btn-primary{ background:var(--accent); color:#04191a; }
  .btn-ghost{ background:#1a1e23; color:var(--txt); }
  .btn-danger{ background:#2b1214; color:var(--canc); }

  /* actions sheet buttons */
  .act-list button{ display:flex; width:100%; align-items:center; gap:12px; background:#0b0e11; border:1px solid #22272c;
        color:var(--txt); font-size:14px; padding:13px 14px; border-radius:11px; cursor:pointer; margin-bottom:8px; }
  .act-list button:active{ background:#181c21; }
  .act-list button.del{ color:#ff9a9a; border-color:#5c2a2f; background:#1c1113; font-weight:700; }
  .act-list button.del .ic{ color:#f87171; }
  .act-list button.del:active{ background:#2b1214; }
  .act-list .ic{ width:22px; text-align:center; }

  /* flash */
  #flash{ position:fixed; inset:0; pointer-events:none; z-index:60; opacity:0;
          background:linear-gradient(180deg, rgba(47,217,201,.32), rgba(34,197,94,.28)); }
  #flash.go{ animation:fl .8s ease-out; }
  @keyframes fl{ 0%{opacity:0} 25%{opacity:1} 100%{opacity:0} }

  /* checkbox de compartilhar */
  .chkrow{ display:flex; align-items:center; gap:11px; padding:12px 4px; border-bottom:1px solid #22272c; font-size:14px; color:#f0f2f4; cursor:pointer; }
  .chkrow input{ width:20px; height:20px; accent-color:#2FD9C9; flex-shrink:0; }
  .chkrow .dot{ width:12px; height:12px; border-radius:50%; flex-shrink:0; }

  /* paleta de cores */
  .swatches{ display:flex; flex-wrap:wrap; gap:10px; }
  .sw{ width:32px; height:32px; border-radius:50%; cursor:pointer; border:2.5px solid transparent; box-shadow:inset 0 0 0 1px rgba(128,128,128,.4); transition:transform .12s; }
  .sw:active{ transform:scale(.85); }
  .sw.sel{ border-color:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.14); }

  /* mini calendário */
  .calpop{ position:fixed; top:58px; left:50%; transform:translateX(-50%); z-index:45;
           background:#14171b; border:1px solid var(--line); border-radius:14px; padding:11px; width:262px;
           box-shadow:0 14px 44px rgba(0,0,0,.6); }
  .calpop .ch{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .calpop .ch b{ font-size:13px; color:#fff; text-transform:capitalize; }
  .calpop .ch button{ background:#1b1f24; border:1px solid #2a2f35; color:#cfd6db; width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:14px; }
  .calpop .wd{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:3px; }
  .calpop .wd span{ text-align:center; font-size:9.5px; color:#6b7378; font-weight:700; }
  .calpop .grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .calpop .cell{ height:30px; display:flex; align-items:center; justify-content:center; font-size:12px; color:#cfd6db; border-radius:7px; cursor:pointer; position:relative; }
  .calpop .cell:active{ background:#20242a; }
  .calpop .cell.other{ color:#3a4046; }
  .calpop .cell.today{ box-shadow:inset 0 0 0 1.5px var(--amber); }
  .calpop .cell.sel{ background:var(--accent); color:#04191a; font-weight:800; }
  .calpop .cell .dot{ position:absolute; bottom:3px; width:4px; height:4px; border-radius:50%; background:var(--accent); }
  .calpop .cell.sel .dot{ background:#04191a; }

  /* boas-vindas */
  #__welcome{ position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center; padding:24px;
    background:rgba(0,0,0,.74); }
  #__welcome.hidden{ display:none; }
  .wc-card{ background:linear-gradient(160deg,#12161a,#0a0d10); border:1px solid #23282e; border-radius:22px; padding:28px 24px 26px; max-width:360px; text-align:center; box-shadow:0 24px 70px rgba(0,0,0,.6); animation:wcpop .5s cubic-bezier(.2,.9,.3,1); }
  @keyframes wcpop{ from{ opacity:0; transform:translateY(18px) scale(.95); } to{ opacity:1; transform:none; } }
  .wc-ico{ font-size:54px; margin-bottom:10px; animation:wcfloat 2.6s ease-in-out infinite; }
  @keyframes wcfloat{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-7px) } }
  .wc-card h2{ color:#fff; font-size:22px; margin-bottom:10px; letter-spacing:.5px; }
  .wc-card p{ color:#9aa2a8; font-size:13.5px; line-height:1.55; margin-bottom:22px; }
  .wc-card .wcbtn{ background:#2FD9C9; color:#04191a; border:none; border-radius:12px; padding:13px 30px; font-size:15px; font-weight:800; cursor:pointer; box-shadow:0 6px 20px rgba(47,217,201,.32); }
  .wc-card .wcbtn:active{ transform:scale(.95); }

  /* ===== conta / login / sincronização ===== */
  .authov{ position:fixed; inset:0; z-index:90; display:flex; align-items:center; justify-content:center; padding:22px;
           background:rgba(0,0,0,.74); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
  .authov.hidden{ display:none !important; }
  .auth-card{ width:100%; max-width:380px; background:linear-gradient(160deg,#12161a,#0a0d10); border:1px solid #23282e;
              border-radius:22px; padding:26px 22px 22px; box-shadow:0 24px 70px rgba(0,0,0,.6);
              animation:wcpop .42s cubic-bezier(.2,.9,.3,1); max-height:92vh; overflow:auto; }
  .auth-ic{ font-size:42px; text-align:center; margin-bottom:6px; }
  .auth-card h2{ color:#fff; font-size:21px; text-align:center; margin-bottom:9px; }
  .auth-card p{ color:#9aa2a8; font-size:13.5px; line-height:1.55; text-align:center; margin-bottom:16px; }
  .auth-card p.auth-note{ font-size:11.5px; color:#6f7a80; margin-top:-9px; }
  .auth-card .field label{ color:#8a97a0; }
  .auth-card .field input{ background:#0b0e11; }
  .auth-err{ display:none; color:#f87171; font-size:12.5px; text-align:center; margin:2px 0 12px; font-weight:600; }
  .auth-btns{ display:flex; flex-direction:column; gap:10px; margin:4px 0 2px; }
  .auth-btns button{ padding:14px; border-radius:12px; border:none; font-size:14.5px; font-weight:700; cursor:pointer; }
  .auth-link{ display:block; width:100%; background:none; border:none; color:#8a97a0; font-size:12.5px; margin-top:11px; cursor:pointer; text-decoration:underline; }
  [data-theme="light"] .auth-card,[data-theme="miri"] .auth-card{ background:var(--panel); border-color:var(--line); }
  [data-theme="light"] .auth-card h2,[data-theme="miri"] .auth-card h2{ color:var(--txt2); }
  [data-theme="light"] .auth-card p,[data-theme="miri"] .auth-card p{ color:var(--mut); }
  [data-theme="light"] .auth-card .field input,[data-theme="miri"] .auth-card .field input{ background:#f5f6f8; }
  /* botões modernos das telas de conta */
  .auth-card .actions{ gap:11px; margin-top:15px; }
  .auth-card .actions button,.auth-btns button{ padding:15px 16px; border-radius:14px; font-size:15px; font-weight:800; letter-spacing:.2px;
    transition:transform .13s cubic-bezier(.34,1.4,.5,1), box-shadow .2s ease, filter .2s ease; }
  .auth-card .actions button:active,.auth-btns button:active{ transform:scale(.955); }
  .auth-card .btn-primary,.auth-btns .btn-primary{ background:linear-gradient(135deg,#33e0cf,#1fb4a6); color:#042a26; box-shadow:0 9px 24px rgba(47,217,201,.36); }
  .auth-card .btn-primary:active,.auth-btns .btn-primary:active{ filter:brightness(1.06); box-shadow:0 5px 14px rgba(47,217,201,.3); }
  .auth-card .btn-ghost,.auth-btns .btn-ghost{ background:transparent; color:var(--txt2); border:1.5px solid #333b43; box-shadow:none; }
  .auth-card .btn-ghost:active,.auth-btns .btn-ghost:active{ background:rgba(255,255,255,.04); }
  .auth-card .btn-danger{ background:linear-gradient(135deg,#ef5064,#cc2f3d); color:#fff; box-shadow:0 9px 24px rgba(239,68,68,.3); }
  .auth-card .btn-danger:active{ filter:brightness(1.06); }
  .gbtn-google{ width:100%; display:flex; align-items:center; justify-content:center; gap:11px; padding:14px; border-radius:14px;
    border:1.5px solid #d7dbe0; background:#fff; color:#1f2226; font-size:15px; font-weight:700; cursor:pointer; margin-bottom:2px;
    transition:transform .13s cubic-bezier(.34,1.4,.5,1), box-shadow .2s ease; box-shadow:0 3px 12px rgba(0,0,0,.18); }
  .gbtn-google:active{ transform:scale(.97); }
  .gbtn-google .gg{ font-weight:800; color:#4285F4; font-family:Arial,sans-serif; font-size:19px; line-height:1; }
  .auth-or{ display:flex; align-items:center; gap:10px; color:var(--mut); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; margin:13px 0; }
  .auth-or::before,.auth-or::after{ content:''; flex:1; height:1px; background:#2a2f35; }
  [data-theme="light"] .auth-or::before,[data-theme="light"] .auth-or::after,[data-theme="miri"] .auth-or::before,[data-theme="miri"] .auth-or::after{ background:var(--line); }
  /* teclado do PIN */
  .pdots{ display:flex; gap:16px; justify-content:center; margin:8px 0 12px; }
  .pdot{ width:15px; height:15px; border-radius:50%; border:2px solid #3a3f45; transition:.15s; }
  .pdot.on{ background:var(--accent); border-color:var(--accent); box-shadow:0 0 10px rgba(47,217,201,.5); }
  .pdots.shake{ animation:pinshake .4s; }
  @keyframes pinshake{ 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }
  .pkeypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:4px 0 2px; }
  .pkey{ height:56px; border-radius:16px; border:1px solid var(--line); background:var(--panel); color:var(--txt2);
         font-size:24px; font-weight:600; cursor:pointer; transition:transform .1s, background .15s; font-family:inherit; }
  .pkey:active{ transform:scale(.93); background:rgba(47,217,201,.14); }
  .pkey.empty{ background:none; border:none; cursor:default; }
  .pkey.pkb{ font-size:21px; color:var(--mut); }
  [data-theme="light"] .pkey,[data-theme="miri"] .pkey{ background:#f5f6f8; }
  .auth-card .field input{ border-radius:13px; padding:14px 14px; transition:border-color .18s ease, box-shadow .18s ease; }
  .auth-card .field input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(47,217,201,.16); }

  .auth-card .act-list button:active{ transform:scale(.97); }
  .auth-link{ transition:color .18s ease; }
  .auth-link:active{ color:var(--accent); }
  [data-theme="light"] .auth-card .btn-primary,[data-theme="miri"] .auth-card .btn-primary,
  [data-theme="light"] .auth-btns .btn-primary,[data-theme="miri"] .auth-btns .btn-primary{ color:#042a26; }

  [data-theme="light"] .auth-btns .btn-ghost,[data-theme="miri"] .auth-btns .btn-ghost{ border-color:var(--line); color:var(--txt2); }

  /* ícones SVG minimalistas */
  .navbtn svg{ width:19px; height:19px; }
  .navbtn.today{ font-size:14px; }
  .fab svg{ width:26px; height:26px; stroke-width:2.4; }
  .mi svg{ width:17px; height:17px; stroke:var(--accent); }
  .menu .mdel .mi svg{ stroke:#ff6b7a; }
  .obs-ic{ display:inline-flex; align-items:center; margin-right:3px; }
  .obs-ic svg{ width:16px; height:16px; }

  @media print{ .toolbar,.fab,.cadd,.gbtn,.menu,.calpop,#flash,#__welcome,#authOv,nav,.progview{ display:none!important; } body{ padding:15mm 14mm; } }
</style>

<body>

<div id="flash"></div>

<div id="__welcome" class="hidden">
  <div class="wc-card">
    <div class="wc-ico">🧭</div>
    <h2>Bem-vindo ao Norte</h2>
    <p>Seu norte do dia. Organize suas tarefas por categorias e prioridades, acompanhe seu progresso e compartilhe quando quiser.</p>
    <button class="wcbtn" onclick="wcClose()">Começar</button>
  </div>
</div>

<div id="authOv" class="authov hidden"></div>

<div class="toolbar">
  <button class="navbtn" onclick="nav(-1)" data-ic="chevL"></button>
  <div class="datepill" id="datepill"><span id="datepilltxt">—</span></div>
  <button class="navbtn cal" onclick="openCalendar(event)" title="Ir para uma data" data-ic="cal"></button>
  <button class="navbtn" id="themeBtn" onclick="openThemePicker()" title="Tema" data-ic="theme"></button>
  <div id="calPop" class="calpop hidden"></div>
  <button class="navbtn today" onclick="goToday()">Hoje</button>
  <button class="navbtn" onclick="nav(1)" data-ic="chevR"></button>
  <div class="menu-wrap">
    <button class="navbtn" onclick="toggleMenu(event)" data-ic="dots"></button>
    <div class="menu hidden" id="menu">
      <button onclick="newDay()"><span class="mi" data-ic="sunrise"></span>Novo dia <em>puxa pendentes</em></button>
      <button onclick="openCats()"><span class="mi" data-ic="tag"></span>Categorias</button>
      <button onclick="shareDay()"><span class="mi" data-ic="share"></span>Compartilhar o dia</button>
      <button onclick="openSecurity()"><span class="mi" data-ic="sync"></span>Sincronização</button>
      <button onclick="openPinMenu()"><span class="mi" data-ic="lock"></span>Bloqueio por PIN</button>
      <button onclick="exportPDF()"><span class="mi" data-ic="printer"></span>Exportar / imprimir</button>
      <button onclick="backup()"><span class="mi" data-ic="save"></span>Backup <em>.json</em></button>
      <button onclick="document.getElementById('restoreFile').click()"><span class="mi" data-ic="download"></span>Restaurar backup</button>
      <input type="file" id="restoreFile" accept="application/json" class="hidden" onchange="restore(event)">
      <div class="mdiv"></div>
      <button class="mdel" onclick="wipeAll()"><span class="mi" data-ic="trash"></span>Zerar tudo</button>
    </div>
  </div>
</div>

<header>
  <div class="kicker">Norte</div>
  <h1 id="dateTitle">—</h1>
</header>

<div class="bar">
  <span class="count" id="count">—</span>
  <div class="track"><div class="fill" id="fill" style="width:0%"></div></div>
</div>

<div class="legend" id="legend"></div>

<div class="secttl" id="catsTitle" onclick="openCats()" style="cursor:pointer;align-items:center;gap:8px">Minhas categorias <span style="margin-left:auto;font-size:11px;color:var(--accent);font-weight:800">＋ gerenciar</span></div>
<div id="cats"></div>

<div class="obs">
  <div class="obs-h"><span class="cbar"></span><span class="obs-ic" data-ic="pen"></span>Observações
    <button class="cadd" onclick="addObs()">+ nota</button></div>
  <div class="obs-box" id="obsBox"></div>
</div>

<footer id="footer">Norte · toque no quadradinho pra concluir · toque na tag pra ações.</footer>

<button class="fab" onclick="openAdd()" data-ic="plus"></button>

<div id="progView" class="progview hidden"></div>
<nav>
  <div class="navbar">
    <button class="on" data-v="dia" onclick="switchView('dia')"><span class="ic" data-ic="day"></span>Meu dia</button>
    <button data-v="prog" onclick="switchView('prog')"><span class="ic" data-ic="trending"></span>Progresso</button>
  </div>
</nav>

<script>
/* ================= modelo ================= */
/* app vem SEM categorias — cada pessoa cria as suas */
const DEFAULT_CATS = [];
let CATS = [];   // carregado do DB (DB.cats)
const catById = id => CATS.find(c=>c.id===id) || CATS[0];
const KEY = 'assistente-v3';
let DB, cur;   // DB.days = {iso:{tasks:[],obs:[]}}, cur = iso atual

function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function uid(){ return 'k'+Math.random().toString(36).slice(2,9); }
function fmtBR(iso){ const [y,m,d]=iso.split('-'); return d+'/'+m; }
const WD=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function longDate(iso){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); return WD[dt.getDay()]+', '+d+' de '+MES[m-1]; }
function shiftISO(iso,n){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }

/* ============= app vem ZERADO — dia vazio, sem dados ============= */
function emptyDay(){ return { tasks:[], obs:[] }; }

function load(){
  try{ DB = JSON.parse(localStorage.getItem(KEY)); }catch(e){ DB=null; }
  if(!DB || !DB.days){ DB = {days:{}}; DB.days[todayISO()] = emptyDay(); }
  if(!DB.cats) DB.cats = [];
  if(!DB.recurring) DB.recurring = [];
  CATS = DB.cats;
  // SEMPRE abre no dia de hoje. Se hoje ainda não existe, cria puxando os
  // pendentes do dia anterior (carry-over automático ao abrir, em qualquer aparelho).
  const t = todayISO();
  if(!DB.days[t]){ DB.days[t] = Object.keys(DB.days).length ? buildNewDay(t) : emptyDay(); save(); }
  cur = t;
}
async function wipeAll(){ closeMenu();
  if(!await uiConfirm('Isso apaga TODOS os dias e categorias deste app. Não dá pra desfazer.',{title:'Zerar tudo?',ok:'Apagar tudo',danger:true}))return;
  localStorage.removeItem(KEY); DB={days:{},cats:[]}; DB.days[todayISO()]=emptyDay(); CATS=DB.cats; cur=todayISO(); save(); render(); }

/* ============= categorias (adicionar / apagar) ============= */
function slug(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,16)||'cat'; }
function openCats(){ closeMenu();
  const rows = CATS.map(c=>`<div style="display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid #22272c">
      <span style="flex:1;display:flex;align-items:center;gap:11px;cursor:pointer" onclick="closeSheet();openCatActions('${c.id}')">
        <span style="width:14px;height:14px;border-radius:50%;background:${c.color};flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4)"></span>
        <span style="flex:1;font-size:13.5px;color:#f0f2f4">${escapeHtml(c.name)}</span>
        <span style="font-size:11px;color:#7a8288">✎ editar</span></span>
      <button onclick="delCat('${c.id}')" style="background:none;border:none;color:#7a6f6f;font-size:15px;cursor:pointer;padding-left:6px">🗑</button></div>`).join('');
  sheet(`<h3>Categorias</h3>
    <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#8a97a0;margin-bottom:8px">Minhas categorias</label>
    <div style="margin-bottom:14px">${rows || '<div style="font-size:12.5px;color:#7a8288;padding:4px 0">Nenhuma ainda.</div>'}</div>
    <div class="field"><label>Nova categoria</label>
      <input id="ncName" placeholder="Nome" style="margin-bottom:12px"></div>
    <div class="field"><label>Cor</label><div class="swatches" id="ncSw">${swatchesHtml()}</div></div>
    <div class="actions"><button class="btn-ghost" onclick="closeSheet()">Fechar</button><button class="btn-primary" onclick="addCat()">+ Adicionar</button></div>`);
}
const PALETTE = ['#22C55E','#22D3EE','#3B82F6','#A78BFA','#EC4899','#EF4444','#F97316','#F59E0B','#EAB308','#14B8A6','#9CA3AF','#FFFFFF','#000000'];
function palette(){ const t=document.documentElement.getAttribute('data-theme')||'dark';
  return t==='dark' ? PALETTE.filter(c=>c!=='#000000') : PALETTE.filter(c=>c!=='#FFFFFF'); }
let ncColorSel = PALETTE[0];
function swatchesHtml(){ const P=palette(); ncColorSel=P[0]; return P.map((c,i)=>`<div class="sw ${i===0?'sel':''}" style="background:${c}" onclick="pickSw(this,'${c}')"></div>`).join(''); }
function pickSw(el,c){ ncColorSel=c; el.parentNode.querySelectorAll('.sw').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); }
function addCat(){ const n=document.getElementById('ncName').value.trim(); if(!n){ uiAlert('Dê um nome à categoria.'); return; }
  let id=slug(n); while(CATS.some(c=>c.id===id)) id+='x';
  CATS.push({id,name:n,color:ncColorSel}); save(); closeSheet(); render();
}
async function delCat(id){ if(await removeCat(id)){ closeSheet(); openCats(); } }
async function delCatFromEdit(id){ if(await removeCat(id)){ closeSheet(); render(); } }
let _editCatId=null;
function openCatActions(id){ const c=CATS.find(x=>x.id===id); if(!c)return; _editCatId=id; ncColorSel=c.color;
  const sws=palette().map(col=>`<div class="sw ${col===c.color?'sel':''}" style="background:${col}" onclick="pickSw(this,'${col}')"></div>`).join('');
  sheet(`<h3>Editar categoria</h3>
    <div class="field"><label>Nome</label><input id="ecName" value="${escapeAttr(c.name)}"></div>
    <div class="field"><label>Cor</label><div class="swatches">${sws}</div></div>
    <div class="actions"><button class="btn-danger" onclick="delCatFromEdit('${id}')">Apagar</button><button class="btn-ghost" onclick="closeSheet()">Cancelar</button><button class="btn-primary" onclick="saveCatEdit()">Salvar</button></div>`);
}
function saveCatEdit(){ const c=CATS.find(x=>x.id===_editCatId); if(!c)return;
  const n=document.getElementById('ecName').value.trim(); if(n)c.name=n; c.color=ncColorSel; save(); closeSheet(); render(); }
async function removeCat(id){
  const used = Object.values(DB.days).some(d=>d.tasks.some(t=>t.cat===id));
  if(used){ if(!await uiConfirm('Essa categoria tem tarefas. Apagar a categoria E todas as tarefas dela (em todos os dias)?',{title:'Apagar categoria?',ok:'Apagar',danger:true}))return false;
    Object.values(DB.days).forEach(d=>{ d.tasks=d.tasks.filter(t=>t.cat!==id); }); }
  else { if(!await uiConfirm('Apagar a categoria?',{ok:'Apagar',danger:true}))return false; }
  const i=CATS.findIndex(c=>c.id===id); if(i>=0)CATS.splice(i,1); save(); return true;
}

function saveLocal(){ localStorage.setItem(KEY, JSON.stringify(DB)); }
function save(){ saveLocal(); schedulePush(); }
function day(){ return DB.days[cur]; }
/* tarefa agendada "ativa" (vira pendente) no dia programado — aí conta no % e dá pra concluir */
function activateSchedTasks(tasks, iso){
  const dd=iso.slice(8,10), mm=iso.slice(5,7); let ch=false;
  (tasks||[]).forEach(t=>{ if(t.status==='sched' && t.sched){
    const p=t.sched.split('/'); if(p[0]===dd && p[1]===mm){ t.status='pend'; t.wasSched=true; delete t.sched; ch=true; }
  }});
  return ch;
}

/* a recorrência "acontece" neste dia? (mesma lógica do buildNewDay) */
function recFiresOn(r, iso){
  if(!r || !r.type) return true;
  const [Y,M,D]=iso.split('-').map(Number); const wd=new Date(Y,M-1,D).getDay(); const dim=new Date(Y,M,0).getDate();
  if(r.type==='diario') return true;
  if(r.type==='semanal') return (r.days||[]).includes(wd);
  if(r.type==='mensal') return D===Math.min(r.dom||1,dim);
  if(r.type==='anual' && r.date){ const [rm,rd]=r.date.split('-').map(Number); const dd=(rm===M&&rd>dim)?dim:rd; return M===rm&&D===dd; }
  return true;
}
/* tarefa "bloqueada" = não é do dia atual (agendada p/ outro dia, ou recorrente cujo dia não chegou) */
function isBlocked(t){
  if(t.status==='done'||t.status==='canc'||t.status==='adiado') return false;
  if(t.status==='sched') return true;
  if(t.rec) return !recFiresOn(t.rec, cur);
  return false;
}

/* ============= cálculo do % ============= */
function frac(t){
  if(isBlocked(t)||t.status==='canc'||t.status==='adiado') return null; // fora do denominador
  if(t.goals){ let d=0,tot=0; for(const k in t.goals){ d+=t.goals[k][0]; tot+=t.goals[k][1]; } return tot?d/tot:0; }
  if(t.cota){ return t.cota[1]? t.cota[0]/t.cota[1] : 0; }
  if(t.subs&&t.subs.length){ const d=t.subs.filter(s=>s.done).length; return d/t.subs.length; }
  return t.status==='done'?1:0;
}
function stats(){
  const ts=day().tasks; let sum=0,n=0,doneN=0,blocked=0,adia=0;
  ts.forEach(t=>{ if(isBlocked(t)){blocked++;return;} if(t.status==='adiado'){adia++;return;} if(t.status==='canc') return;
    const f=frac(t); if(f===null) return; sum+=f; n++; if(f>=1) doneN++; });
  return {pct:n?Math.round(sum/n*100):0, doneN, n, blocked, adia};
}

/* ============= ordenação dentro da categoria ============= */
function sortKey(t){
  // prioridade manda mais que status
  if(t.prio==='max') return 0;
  if(t.prio==='star') return 1;
  if(t.status==='sched') return 2;
  if(t.status==='adiado') return 5;
  if(t.status==='canc') return 6;
  if(t.status==='done') return 4;  // concluídas sem prioridade por último (antes de canc)
  return 3; // pendentes normais
}

/* ============= render ============= */
function render(){
  if(day()) activateSchedTasks(day().tasks, cur);   // ativa as agendadas cujo dia chegou
  document.getElementById('datepilltxt').textContent = fmtBR(cur) + (cur===todayISO()?' · hoje':'');
  document.getElementById('dateTitle').textContent = longDate(cur);
  const s=stats();
  document.getElementById('count').textContent =
    `${s.doneN} de ${s.n} · ${s.pct}% do dia` + (s.blocked?` · ${s.blocked} bloqueada${s.blocked>1?'s':''}`:'') + (s.adia?` · ${s.adia} adiada${s.adia>1?'s':''}`:'');
  document.getElementById('fill').style.width = s.pct+'%';

  // legend (só aparece se houver categorias)
  const lg=document.getElementById('legend');
  if(!CATS.length){ lg.classList.add('hidden'); }
  else{ lg.classList.remove('hidden'); lg.innerHTML =
    CATS.map(c=>`<div class="lg" style="cursor:pointer" onclick="openCatActions('${c.id}')"><span class="chip" style="background:${c.color}"></span>${escapeHtml(c.name)}</div>`).join('') +
    `<div class="lg" style="cursor:pointer;color:var(--accent);font-weight:800" onclick="openCats()">＋ categoria</div>`+
    `<div class="lg" style="margin-left:auto"><span class="chip" style="background:#FBBF24"></span>★ Prioridade</div>`+
    `<div class="lg"><span class="chip" style="background:#F97316"></span>★★ Máxima</div>`; }

  // título "Minhas categorias" (só quando há categorias)
  document.getElementById('catsTitle').style.display = CATS.length ? 'flex' : 'none';
  // cats
  const host=document.getElementById('cats'); host.innerHTML='';
  CATS.forEach(c=>{
    const ts = day().tasks.filter(t=>t.cat===c.id).sort((a,b)=> sortKey(a)-sortKey(b));
    if(!ts.length) return;
    const div=document.createElement('div'); div.className='cat';
    div.innerHTML=`<div class="chead"><span class="cbar" style="background:${c.color}"></span>
      <span class="cname" style="color:${c.color};cursor:pointer" onclick="openCatActions('${c.id}')">${escapeHtml(c.name)} <span style="font-size:11px;opacity:.6">✎</span></span>
      <button class="cadd" onclick="openAdd('${c.id}')">+ tarefa</button></div>`;
    ts.forEach(t=> div.appendChild(itemEl(t,c)));
    host.appendChild(div);
  });
  if(!host.children.length){
    const noCat = !CATS.length;
    host.innerHTML=`<div style="text-align:center;padding:34px 18px 18px;color:#7a8288">
      <div style="font-size:38px;margin-bottom:10px">${noCat?'🏷️':'🗒️'}</div>
      <div style="font-size:15px;color:#c7ced3;font-weight:600;margin-bottom:4px">${noCat?'Comece criando uma categoria':'Dia em branco'}</div>
      <div style="font-size:12px;margin-bottom:18px">${noCat?'As categorias organizam suas tarefas por cor.':'Adicione a primeira tarefa do dia.'}</div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        ${noCat
          ? `<button class="navbtn" style="background:#2FD9C9;color:#04191a;border:none;padding:0 16px" onclick="openCats()">+ Nova categoria</button>`
          : `<button class="navbtn" style="background:#2FD9C9;color:#04191a;border:none;padding:0 16px" onclick="openAdd()">+ Nova tarefa</button>`}
      </div></div>`;
  }

  // obs
  const ob=document.getElementById('obsBox'); const obs=day().obs||[];
  ob.innerHTML = obs.length ? obs.map((o,i)=>`<div class="oi${i===_obsAnim?' new':''}">${escapeHtml(o)}<span class="del" onclick="delObs(${i})">✕</span></div>`).join('')
                            : `<div class="obs-empty">Sem observações hoje.</div>`;
  _obsAnim=-1; _subAnim='';
  document.getElementById('footer').textContent = `Norte v13 · ${fmtBR(cur)}/2026 · salvo no aparelho.`;
  save();
}

function itemEl(t,c){
  const el=document.createElement('div');
  let cls='item'; if(t.status==='done')cls+=' done'; if(t.status==='canc')cls+=' canc';
  if(t.status==='sched')cls+=' sched'; if(t.status==='adiado')cls+=' adiado';
  if(isBlocked(t))cls+=' blocked';
  if(t.prio==='max')cls+=' priomax'; if(t.prio==='star')cls+=' prio';
  el.className=cls; el.style.borderLeftColor=c.color; el.style.setProperty('--catcolor', c.color);

  let chips='';
  if(t.prio==='max') chips+=` <span class="pchip">★★ Prioridade máxima</span>`;
  if(t.prio==='star') chips+=` <span class="pchip star">★ Prioridade</span>`;
  if(t.recur) chips+=` <span class="rchip">↻ ${t.recur}</span>`;
  if(t.carriedFrom) chips+=` <span class="cflag">↩ veio de ${t.carriedFrom}</span>`;
  if(t.wasSched) chips+=` <span class="cflag schedtoday">🗓 programada pra hoje</span>`;

  let inner=`<div class="t" onclick="openActions('${t.id}')" style="cursor:pointer">${escapeHtml(t.title)}${chips}</div>`;
  if(t.meta) inner+=`<div class="m">${t.status==='done'?'✓ ':''}${escapeHtml(t.meta)}</div>`;

  // METAS
  if(t.goals){
    inner+=`<div class="goals-box">`+['posts','stories','ads'].map(k=>{
      const [d,tot]=t.goals[k]; const pc=tot?Math.round(d/tot*100):0;
      const nm={posts:'Posts',stories:'Stories',ads:'Ads'}[k];
      return `<div class="gr"><span class="gname">${nm}</span>
        <button class="gbtn" onclick="goal('${t.id}','${k}',-1)">−</button>
        <div class="gtrack"><div class="gfill" style="width:${pc}%"></div></div>
        <span class="gnum">${d} / ${tot}</span>
        <button class="gbtn" onclick="goal('${t.id}','${k}',1)">+</button></div>`;
    }).join('')+`</div>`;
    const gd=t.goals.posts[0]+t.goals.stories[0]+t.goals.ads[0], gt=t.goals.posts[1]+t.goals.stories[1]+t.goals.ads[1];
    inner+=tbar(gd,gt);
  }
  // Criativos / cota simples
  if(t.cota){
    inner+=`<div class="tbar"><button class="gbtn" onclick="cota('${t.id}',-1)">−</button>${tbarInner(t.cota[0],t.cota[1])}<button class="gbtn" onclick="cota('${t.id}',1)">+</button></div>`;
  }
  // subtarefas (não em METAS/cota)
  if(!t.goals && !t.cota){
    if(t.subs&&t.subs.length){
      const d=t.subs.filter(s=>s.done).length;
      inner+=tbar(d,t.subs.length);
      inner+=`<div class="subs">`+t.subs.map((s,i)=>`<div class="sub ${s.done?'sdone':''}${(t.id+'|'+i)===_subAnim?' new':''}" onclick="subTog('${t.id}',${i})"><span class="sbox"></span>${escapeHtml(s.label)}<span class="subdel" onclick="event.stopPropagation();subDel('${t.id}',${i})">✕</span></div>`).join('')+`</div>`;
    }
    inner+=`<div class="subadd" onclick="addSub('${t.id}')">+ subtarefa</div>`;
  }

  let tag, tagCls;
  if(isBlocked(t) && t.status!=='sched'){ tag='Agendada'; tagCls='sched'; }   // bloqueada (recorrência) aparece como agendada
  else { tag = {pend:'Pendente',done:'Feito',canc:'Cancelado',sched:(t.sched?('Agendada · '+t.sched):'Agendada'),adiado:'Adiado'}[t.status]; tagCls=t.status; }
  const boxClick = isBlocked(t) ? `openActions('${t.id}')` : `toggleDone('${t.id}')`;
  el.innerHTML=`<div class="box" onclick="${boxClick}"></div><div class="txt">${inner}</div>
     <span class="tag ${tagCls}" onclick="openActions('${t.id}')">${tag}</span>`;
  return el;
}
function tbar(d,tot){ const pc=tot?Math.round(d/tot*100):0; return `<div class="tbar"><div class="ttrack"><div class="tfill" style="width:${pc}%"></div></div><span class="tcount">${d}/${tot} · ${pc}%</span></div>`; }
function tbarInner(d,tot){ const pc=tot?Math.round(d/tot*100):0; return `<div class="ttrack"><div class="tfill" style="width:${pc}%"></div></div><span class="tcount">${d}/${tot} · ${pc}%</span>`; }
function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ============= interações ============= */
function findTask(id){ return day().tasks.find(t=>t.id===id); }
function flashFx(){ const f=document.getElementById('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); if(navigator.vibrate)navigator.vibrate(16); }

function toggleDone(id){ const t=findTask(id);
  if(t.status==='done'){ t.status='pend'; }
  else{ t.status='done'; if(t.subs)t.subs.forEach(s=>s.done=true); if(t.goals)for(const k in t.goals)t.goals[k][0]=t.goals[k][1]; if(t.cota)t.cota[0]=t.cota[1]; flashFx(); }
  render();
}
let _subTid=null, _subAnim='';
function addSub(id){ _subTid=id; sheet(`<h3>➕ Nova subtarefa</h3>
    <div class="field"><input id="subInput" placeholder="ex.: Garrafa 1"></div>
    <div class="actions"><button class="btn-ghost" onclick="closeSheet()">Cancelar</button><button class="btn-primary" onclick="saveSub()">Adicionar</button></div>`);
  setTimeout(()=>{ const el=document.getElementById('subInput'); if(el){ el.focus(); el.addEventListener('keydown',e=>{ if(e.key==='Enter')saveSub(); }); } },90); }
function saveSub(){ const el=document.getElementById('subInput'); const v=el?el.value.trim():''; if(!v){ if(el)el.focus(); return; }
  const t=findTask(_subTid); if(!t)return; if(!t.subs)t.subs=[]; t.subs.push({label:v,done:false});
  _subAnim=_subTid+'|'+(t.subs.length-1); if(t.status==='done')t.status='pend'; closeSheet();
  if(navigator.vibrate)navigator.vibrate(12); render(); }
function subDel(id,i){ const t=findTask(id); t.subs.splice(i,1); if(!t.subs.length)delete t.subs; render(); }
function subTog(id,i){ const t=findTask(id); t.subs[i].done=!t.subs[i].done;
  const all=t.subs.every(s=>s.done); if(all){ t.status='done'; flashFx(); } else if(t.status==='done'){ t.status='pend'; }
  render();
}
function goal(id,k,d){ const t=findTask(id); const g=t.goals[k]; g[0]=Math.max(0,Math.min(g[1],g[0]+d));
  const done=t.goals.posts[0]+t.goals.stories[0]+t.goals.ads[0], tot=t.goals.posts[1]+t.goals.stories[1]+t.goals.ads[1];
  t.status = done>=tot ? 'done':'pend'; if(d>0)flashFx(); render();
}
function cota(id,d){ const t=findTask(id); t.cota[0]=Math.max(0,Math.min(t.cota[1],t.cota[0]+d));
  t.status = t.cota[0]>=t.cota[1]?'done':'pend'; if(d>0)flashFx(); render();
}

/* ---- actions sheet ---- */
function openActions(id){ const t=findTask(id);
  const acts=[
    t.status==='done'?['↩','Reabrir',`setStatus('${id}','pend')`]:['✓','Marcar feito',`setStatus('${id}','done')`],
    t.prio==='star'?['★','Tirar prioridade',`setPrio('${id}',null)`]:['★','Prioridade',`setPrio('${id}','star')`],
    t.prio==='max'?['★★','Tirar máxima',`setPrio('${id}',null)`]:['★★','Prioridade máxima',`setPrio('${id}','max')`],
    ['📅','Agendar (data)',`schedTask('${id}')`],

function daysLabel(days){ if(!days||!days.length)return ''; const s=[...days].sort((a,b)=>a-b); const j=s.join(',');

/* ---- navegação de dias + novo dia ---- */
function nav(n){ const iso=shiftISO(cur,n); if(!DB.days[iso]){ DB.days[iso]=buildNewDay(iso); } cur=iso; render(); }
let calMonth;
function openCalendar(e){ if(e)e.stopPropagation(); const p=document.getElementById('calPop');
  if(!p.classList.contains('hidden')){ p.classList.add('hidden'); return; }
  calMonth=cur.slice(0,8)+'01'; renderCal(); p.classList.remove('hidden'); }
function closeCal(){ document.getElementById('calPop').classList.add('hidden'); }
function calShift(n){ const [y,m]=calMonth.split('-').map(Number); const d=new Date(y,m-1+n,1);
  calMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01'; renderCal(); }
function renderCal(){
  const [y,m]=calMonth.split('-').map(Number);
  const first=new Date(y,m-1,1), start=first.getDay(), dim=new Date(y,m,0).getDate();
  const t=todayISO();
  let cells='';
  for(let i=0;i<start;i++){ const dp=new Date(y,m-1,1-(start-i)); cells+=dayCell(dp,y,m,t,true); }
  for(let d=1; d<=dim; d++){ cells+=dayCell(new Date(y,m-1,d),y,m,t,false); }
  const rest=(start+dim)%7; if(rest) for(let i=1;i<=7-rest;i++){ cells+=dayCell(new Date(y,m,i),y,m,t,true); }
  document.getElementById('calPop').innerHTML=
    `<div class="ch"><button onclick="calShift(-1)">‹</button><b>${MES[m-1]} ${y}</b><button onclick="calShift(1)">›</button></div>
     <div class="wd"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
     <div class="grid">${cells}</div>`;
}
function dayCell(dt,y,m,t,other){
  const iso=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  let cls='cell'; if(other||dt.getMonth()!==m-1)cls+=' other'; if(iso===t)cls+=' today'; if(iso===cur)cls+=' sel';
  const dot = DB.days[iso] ? '<span class="dot"></span>' : '';
  return `<div class="${cls}" onclick="pickCal('${iso}')">${dt.getDate()}${dot}</div>`;
}
function pickCal(iso){ closeCal(); jumpTo(iso); }
function jumpTo(iso){ if(!iso)return;
  if(!DB.days[iso]){ DB.days[iso]=buildNewDay(iso); }
  cur=iso; render(); }
function goToday(){ const iso=todayISO(); if(!DB.days[iso])DB.days[iso]=buildNewDay(iso); cur=iso; render(); }
async function newDay(){ closeMenu(); const iso=todayISO()>cur?todayISO():shiftISO(cur,1);
  if(DB.days[iso]&&!await uiConfirm(fmtBR(iso)+' já existe. Recriar do zero apaga o que tem lá. Continuar?',{title:'Recriar o dia?',ok:'Recriar',danger:true}))return;
  DB.days[iso]=buildNewDay(iso); cur=iso; render(); }
function buildNewDay(iso){
  // pega o dia anterior mais recente
  const prevIso = Object.keys(DB.days).filter(k=>k<iso).sort().pop();
  const prev = prevIso?DB.days[prevIso]:null;
  const tasks=[];
  // diárias fixas sempre nascem zeradas
  tasks.push({id:uid(),cat:'lever',title:'METAS',meta:'Cota de produção do dia · zera todo dia',status:'pend',prio:'max',recur:'diária',goals:{posts:[0,1],stories:[0,4],ads:[0,2]}});
  tasks.push({id:uid(),cat:'lever',title:'Criativos do dia',meta:'Espelho da cota · 1 post · 4 stories · 2 ads',status:'pend',prio:null,recur:'diária',cota:[0,7]});
  tasks.push({id:uid(),cat:'pessoal',title:'Beber 2 garrafas de água',meta:'',status:'pend',prio:null,recur:'diária',subs:[{label:'Garrafa 1',done:false},{label:'Garrafa 2',done:false}]});
  // recorrências do usuário (diário/semanal/mensal/anual)
  const [Y,M,D]=iso.split('-').map(Number); const wd=new Date(Y,M-1,D).getDay(); const dim=new Date(Y,M,0).getDate();
  (DB.recurring||[]).forEach(e=>{ const r=e.rec; if(!r)return; if(!CATS.find(c=>c.id===e.cat))return;
    let hit=false;
    if(r.type==='diario')hit=true;
    else if(r.type==='semanal')hit=(r.days||[]).includes(wd);
    else if(r.type==='mensal')hit=(D===Math.min(r.dom||1,dim));
    else if(r.type==='anual'&&r.date){ const [rm,rd]=r.date.split('-').map(Number); const dd=(rm===M&&rd>dim)?dim:rd; hit=(M===rm&&D===dd); }
    if(!hit)return;
    const nt={id:uid(),rid:e.rid,cat:e.cat,title:e.title,meta:e.meta||'',status:'pend',prio:e.prio||null,recur:e.recur||recLabel(r),rec:r};
    if(e.goals)nt.goals=JSON.parse(JSON.stringify(e.goals));
    if(e.cota)nt.cota=[0,e.cota[1]];
    if(e.subLabels)nt.subs=e.subLabels.map(l=>({label:l,done:false}));
    tasks.push(nt);
  });
  // carry-over do dia anterior
  if(prev){ prev.tasks.forEach(t=>{
    if(t.recur==='diária') return;                 // diárias já recriadas
    if(t.rid) return;                              // recorrências do usuário já recriadas acima
    if(t.status==='done'||t.status==='canc') return; // feitas/canceladas ficam pra trás
    const nt=JSON.parse(JSON.stringify(t)); nt.id=uid();
    if(t.prio) nt.prio=null;                        // prioridade é do dia (METAS é exceção, mas ela é diária)
    if(t.status!=='sched'){ nt.carriedFrom=fmtBR(prevIso); nt.status = t.status==='adiado'?'adiado':'pend'; }
    // subtarefas: mantém progresso? regra: carrega o progresso
    tasks.push(nt);
  }); }
  activateSchedTasks(tasks, iso);   // se hoje for o dia programado de alguma agendada, ela ja nasce ativa
  return {tasks, obs:[]};
}

async function importShared(){ const p=window.__shared; if(!p)return;

let _view='dia', _progMode='dia';
function switchView(v){ _view=v;
  const pv=document.getElementById('progView'), fab=document.querySelector('.fab');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.getAttribute('data-v')===v));
  if(v==='prog'){ renderProgress(); pv.classList.remove('hidden'); pv.scrollTop=0; if(fab)fab.style.display='none'; }
  else { pv.classList.add('hidden'); if(fab)fab.style.display=''; }

function setProgMode(m){ _progMode=m; renderProgress(); }
function dayFrac(t,iso){
  if(t.status==='canc'||t.status==='adiado'||t.status==='sched') return null;
  if(t.rec && !recFiresOn(t.rec,iso)) return null;
  if(t.goals){ let d=0,tot=0; for(const k in t.goals){ d+=t.goals[k][0]; tot+=t.goals[k][1]; } return tot?d/tot:0; }
  if(t.cota){ return t.cota[1]? t.cota[0]/t.cota[1] : 0; }
  if(t.subs&&t.subs.length){ const dd=t.subs.filter(s=>s.done).length; return dd/t.subs.length; }
  return t.status==='done'?1:0;
}
function dayPct(iso){ const dd=DB.days[iso]; if(!dd||!dd.tasks) return null;
  let sum=0,n=0; dd.tasks.forEach(t=>{ const f=dayFrac(t,iso); if(f===null)return; sum+=f; n++; });
  return n? Math.round(sum/n*100) : null; }
function mondayOf(iso){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); const wd=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-wd); return dt; }
function pad2(n){ return String(n).padStart(2,'0'); }
function progPoints(mode){
  const days=Object.keys(DB.days).filter(iso=>dayPct(iso)!==null).sort();
  if(!days.length) return [];
  if(mode==='dia') return days.slice(-14).map(iso=>({label:iso.slice(8,10)+'/'+iso.slice(5,7), val:dayPct(iso)}));
  const groups={};
  days.forEach(iso=>{ const p=dayPct(iso); let key,label;
    if(mode==='sem'){ const dt=mondayOf(iso); key=dt.getFullYear()+'-'+pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate()); label=pad2(dt.getDate())+'/'+pad2(dt.getMonth()+1); }
    else { key=iso.slice(0,7); label=MES[+iso.slice(5,7)-1].slice(0,3); }
    if(!groups[key])groups[key]={sum:0,n:0,label:label,key:key}; groups[key].sum+=p; groups[key].n++; });
  const arr=Object.keys(groups).sort().map(k=>groups[k]);
  return arr.slice(mode==='sem'?-10:-8).map(g=>({label:g.label, val:Math.round(g.sum/g.n)}));
}
function chartSVG(pts){ const W=340,H=196,padL=26,padR=12,padT=16,padB=24, iw=W-padL-padR, ih=H-padT-padB, n=pts.length;
  const X=i=> n<=1? padL+iw/2 : padL+iw*i/(n-1); const Y=v=> padT+ih*(1-v/100);
  let g='';
  [0,25,50,75,100].forEach(gl=>{ const yy=Y(gl); g+='<line x1="'+padL+'" y1="'+yy+'" x2="'+(W-padR)+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1"/>'; g+='<text x="'+(padL-5)+'" y="'+(yy+3)+'" fill="var(--mut)" font-size="8.5" text-anchor="end">'+gl+'</text>'; });
  const poly=pts.map((p,i)=>X(i)+','+Y(p.val)).join(' ');
  let d='M '+X(0)+' '+Y(pts[0].val); for(let i=1;i<n;i++) d+=' L '+X(i)+' '+Y(pts[i].val);
  d+=' L '+X(n-1)+' '+(padT+ih)+' L '+X(0)+' '+(padT+ih)+' Z';
  g+='<path d="'+d+'" fill="url(#pgrad)"/>';
  if(n>1) g+='<polyline points="'+poly+'" fill="none" stroke="#2FD9C9" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach((p,i)=>{ const px=X(i),py=Y(p.val);
    g+='<circle cx="'+px+'" cy="'+py+'" r="3.4" fill="#2FD9C9" stroke="var(--panel)" stroke-width="1.5"/>';
    if(n<=10) g+='<text x="'+px+'" y="'+(py-8)+'" fill="var(--txt2)" font-size="9" font-weight="700" text-anchor="middle">'+p.val+'</text>';
    g+='<text x="'+px+'" y="'+(padT+ih+15)+'" fill="var(--mut)" font-size="8" text-anchor="middle">'+p.label+'</text>'; });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="pgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2FD9C9" stop-opacity="0.28"/><stop offset="1" stop-color="#2FD9C9" stop-opacity="0"/></linearGradient></defs>'+g+'</svg>';
}
function renderProgress(){
  const pts=progPoints(_progMode); const vals=pts.map(p=>p.val);
  const avg=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0;
  const best=vals.length?Math.max.apply(null,vals):0;
  const full=vals.filter(v=>v>=100).length;
  const unit=_progMode==='dia'?'dias':_progMode==='sem'?'semanas':'meses';
  const modes=[['dia','Diário'],['sem','Semanal'],['mes','Mensal']];
  const chart = pts.length ? chartSVG(pts) : '<div class="prog-empty">📈<br>Ainda não há dados.<br>Conclua tarefas e volte aqui pra ver sua evolução.</div>';
  document.getElementById('progView').innerHTML =
    '<div class="prog-top"><h2>📊 Progresso</h2></div>'+
    '<div class="prog-seg">'+modes.map(m=>'<button class="'+(_progMode===m[0]?'on':'')+'" onclick="setProgMode(\''+m[0]+'\')">'+m[1]+'</button>').join('')+'</div>'+
    '<div class="prog-kpis"><div class="pk"><div class="pkv">'+avg+'%</div><div class="pkl">média</div></div>'+
      '<div class="pk"><div class="pkv">'+best+'%</div><div class="pkl">melhor</div></div>'+
      '<div class="pk"><div class="pkv">'+full+'</div><div class="pkl">'+unit+' 100%</div></div></div>'+
    '<div class="prog-chart">'+chart+'</div>';
}

async function pushRemote(){ if(!sbReady())return;
  const stamp=new Date().toISOString(); _myStamp=stamp;
  try{ const r=await sb.from('app_state').upsert({user_id:session.user.id,app:APP_ID,data:DB,updated_at:stamp});
    if(!r.error) localStorage.setItem('norte-syncedAt',stamp); }catch(e){} }
function hasLocalData(){ return (DB&&DB.days&&Object.values(DB.days).some(d=>d.tasks&&d.tasks.length)) || (DB&&DB.cats&&DB.cats.length); }
function normalizeDB(){ if(!DB||!DB.days)DB={days:{}}; if(!DB.cats)DB.cats=[]; if(!DB.recurring)DB.recurring=[]; CATS=DB.cats;
  const t=todayISO(); if(!DB.days[t]) DB.days[t]=Object.keys(DB.days).length?buildNewDay(t):emptyDay(); cur=t; }
function mergeDB(a,b){ const out={days:{},cats:[],recurring:(a.recurring&&a.recurring.length?a.recurring:(b.recurring||[]))};
  const cm={}; [].concat(a.cats||[],b.cats||[]).forEach(c=>{ if(!cm[c.id])cm[c.id]=c; }); out.cats=Object.values(cm);
  const ds=new Set([].concat(Object.keys(a.days||{}),Object.keys(b.days||{})));
  ds.forEach(d=>{ const da=(a.days&&a.days[d])||{tasks:[],obs:[]}, db=(b.days&&b.days[d])||{tasks:[],obs:[]};
    const tm={}; [].concat(da.tasks||[],db.tasks||[]).forEach(t=>{ if(!tm[t.id])tm[t.id]=t; });
    out.days[d]={tasks:Object.values(tm), obs:Array.from(new Set([].concat(da.obs||[],db.obs||[])))}; });
  return out; }
async function pullRemote(){ if(!sbReady())return;
  try{ const {data,error}=await sb.from('app_state').select('data,updated_at').eq('user_id',session.user.id).eq('app',APP_ID).maybeSingle();
    if(error)return;
    const firstLink=!localStorage.getItem('norte-syncedAt');
    if(data&&data.data){
      if(firstLink&&hasLocalData()){ DB=mergeDB(DB,data.data); normalizeDB(); saveLocal(); _suppressPush=true; render(); _suppressPush=false; await pushRemote(); toast('✓ dados unidos e sincronizados'); }
      else if((data.updated_at||'')>(localStorage.getItem('norte-syncedAt')||'')){ DB=data.data; normalizeDB(); saveLocal(); localStorage.setItem('norte-syncedAt',data.updated_at); _suppressPush=true; render(); _suppressPush=false; }
      /* senão: já está em sync -> não faz nada (evita loop de re-push) */
    } else { await pushRemote(); }
  }catch(e){} }
function subscribeRT(){ if(!sbReady())return; if(_rtChan){ try{sb.removeChannel(_rtChan);}catch(e){} _rtChan=null; }
  try{ _rtChan=sb.channel('as-'+session.user.id)
    .on('postgres_changes',{event:'*',schema:'public',table:'app_state',filter:'user_id=eq.'+session.user.id},function(p){ pullRemote(); })
    .subscribe(); }catch(e){}
  if(!window.__nortePoll){ window.__nortePoll=setInterval(function(){ if(sbReady() && document.visibilityState!=='hidden') pullRemote(); },15000); }
  if(!window.__norteVis){ window.__norteVis=true; document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible' && sbReady()) pullRemote(); }); } }

    t.style.cssText='position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:100001;background:#12161b;color:#eafcf6;border:1px solid #1f5c4d;border-radius:12px;padding:9px 15px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;box-shadow:0 10px 30px rgba(0,0,0,.5)';
    document.body.appendChild(t); } t.textContent=msg; t.style.opacity='1'; clearTimeout(t._h); t._h=setTimeout(function(){t.style.opacity='0';},2400); }

function uiModal(html){ let ov=document.getElementById('uiOv'); if(!ov){ ov=document.createElement('div'); ov.id='uiOv'; ov.className='authov'; document.body.appendChild(ov); }
  ov.innerHTML='<div class="auth-card">'+html+'</div>'; ov.classList.remove('hidden'); return ov; }
function uiCloseM(){ const ov=document.getElementById('uiOv'); if(ov)ov.classList.add('hidden'); }
function uiConfirm(msg,o){ o=o||{}; return new Promise(function(res){ window.__uiRes=function(v){ uiCloseM(); res(v); };
  uiModal('<div class="auth-ic">'+(o.icon||(o.danger?'🗑️':'❓'))+'</div>'+(o.title?'<h2>'+o.title+'</h2>':'')+'<p>'+msg+'</p>'+
    '<div class="actions"><button class="btn-ghost" onclick="__uiRes(false)">'+(o.cancel||'Cancelar')+'</button>'+
    '<button class="'+(o.danger?'btn-danger':'btn-primary')+'" onclick="__uiRes(true)">'+(o.ok||'Confirmar')+'</button></div>'); }); }
function uiAlert(msg,o){ o=o||{}; return new Promise(function(res){ window.__uiRes=function(){ uiCloseM(); res(); };
  uiModal('<div class="auth-ic">'+(o.icon||'ℹ️')+'</div>'+(o.title?'<h2>'+o.title+'</h2>':'')+'<p>'+msg+'</p>'+
    '<div class="actions"><button class="btn-primary" onclick="__uiRes()">'+(o.ok||'Ok')+'</button></div>'); }); }
function uiPromptOk(){ var i=document.getElementById('uiPInp'); if(window.__uiRes)window.__uiRes(i?i.value.trim():null); }
function uiPrompt(msg,o){ o=o||{}; return new Promise(function(res){ window.__uiRes=function(v){ uiCloseM(); res(v); };
  uiModal('<div class="auth-ic">'+(o.icon||'✏️')+'</div>'+(o.title?'<h2>'+o.title+'</h2>':'')+'<p>'+msg+'</p>'+

    '<div class="actions"><button class="btn-ghost" onclick="__uiRes(null)">Cancelar</button>'+
    '<button class="btn-primary" onclick="uiPromptOk()">'+(o.ok||'Ok')+'</button></div>');
  setTimeout(function(){ var i=document.getElementById('uiPInp'); if(i)i.focus(); },60); }); }

/* ===== PIN OPCIONAL (trava local, 4 dígitos, só números) ===== */
let _pin='', _pinMode='', _pinTmp='';
function pinTitles(m){ return ({
  unlock:['Digite seu PIN',''], set1:['Criar PIN','Escolha um PIN de 4 dígitos'], set2:['Confirmar PIN','Repita o PIN'],
  chgcur:['PIN atual','Digite seu PIN atual'], chgnew:['Novo PIN','Escolha o novo PIN'], chgconf:['Confirmar','Repita o novo PIN'],
  offcur:['Desativar PIN','Digite seu PIN pra desativar'] })[m] || ['PIN','']; }
function pinDotsHtml(){ let s=''; for(let i=0;i<4;i++) s+='<span class="pdot'+(i<_pin.length?' on':'')+'"></span>'; return s; }
function pinKeypadHtml(){ let k=''; ['1','2','3','4','5','6','7','8','9','x','0','back'].forEach(function(d){
    if(d==='x') k+='<span class="pkey empty"></span>';
    else if(d==='back') k+='<button class="pkey pkb" onclick="pinBack()">⌫</button>';
    else k+='<button class="pkey" onclick="pinTap(\''+d+'\')">'+d+'</button>'; }); return k; }
function showPin(m){ _pinMode=m; _pin=''; const t=pinTitles(m);
  authScreen('<div class="auth-ic">🔒</div><h2>'+t[0]+'</h2>'+(t[1]?'<p>'+t[1]+'</p>':'')+
    '<div class="pdots" id="pdots">'+pinDotsHtml()+'</div>'+
    '<div class="auth-err" id="authErr" style="min-height:15px"></div>'+
    '<div class="pkeypad">'+pinKeypadHtml()+'</div>'+
    (m==='unlock'?'':'<button class="auth-link" onclick="closeAuth()">Cancelar</button>'), {lock:m==='unlock'}); }
function pinRefresh(){ const el=document.getElementById('pdots'); if(el)el.innerHTML=pinDotsHtml(); }
function pinBack(){ _pin=_pin.slice(0,-1); pinRefresh(); }
function pinTap(d){ if(_pin.length>=4)return; _pin+=d; pinRefresh(); if(_pin.length===4) setTimeout(pinDone,130); }
function pinErr(m){ _pin=''; pinRefresh(); authErr(m); const c=document.querySelector('.pdots'); if(c){ c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); } }
async function pinDone(){ const code=_pin; const h=await sha(code);
  if(_pinMode==='unlock'){ if(h===localStorage.getItem('norte-pin')){ markSession(); closeAuth(); } else pinErr('PIN incorreto'); }
  else if(_pinMode==='set1'){ _pinTmp=code; showPin('set2'); }
  else if(_pinMode==='set2'){ if(code===_pinTmp){ localStorage.setItem('norte-pin',h); markSession(); closeAuth(); toast('PIN ativado ✓'); } else { pinErr('Não conferiu'); setTimeout(function(){showPin('set1');},650); } }
  else if(_pinMode==='chgcur'){ if(h===localStorage.getItem('norte-pin')) showPin('chgnew'); else pinErr('PIN incorreto'); }
  else if(_pinMode==='chgnew'){ _pinTmp=code; showPin('chgconf'); }
  else if(_pinMode==='chgconf'){ if(code===_pinTmp){ localStorage.setItem('norte-pin',h); closeAuth(); toast('PIN alterado ✓'); } else { pinErr('Não conferiu'); setTimeout(function(){showPin('chgnew');},650); } }
  else if(_pinMode==='offcur'){ if(h===localStorage.getItem('norte-pin')){ localStorage.removeItem('norte-pin'); closeAuth(); toast('PIN desativado'); } else pinErr('PIN incorreto'); } }

async function doSignup(email,pw){ if(!sb){ authErr('Sem conexão. Tente de novo com internet.'); return; }
  try{ let r=await sb.auth.signUp({email:email,password:pw});
    if(r.error){ if(/registered|exists/i.test(r.error.message)){ r=await sb.auth.signInWithPassword({email:email,password:pw});
        if(r.error){ authErr('Esse e-mail já tem conta e a senha não confere. Use "Já tenho conta".'); return; } }
      else { authErr(r.error.message); return; } }
    session=(r.data&&r.data.session)||null;
    if(!session){ const s=await sb.auth.signInWithPassword({email:email,password:pw}); session=(s.data&&s.data.session)||null; }
    if(!session){ authErr('Conta criada — confirme o e-mail e entre.'); return; }
    localStorage.setItem('norte-login',email); localStorage.setItem('norte-pwhash',await sha(pw)); localStorage.removeItem('norte-nag');
    markSession(); closeAuth(); subscribeRT(); await pullRemote(); toast('Conta criada ✓');
  }catch(e){ authErr('Erro: '+(e.message||e)); } }

  if(sb){ try{ const r=await sb.auth.signInWithPassword({email:email,password:pw});

async function recoveryGo(){ const a=val('rcPw'),b=val('rcPw2'); if(a.length<6){ authErr('Mínimo 6 caracteres.'); return; } if(a!==b){ authErr('Não confere.'); return; }
  try{ const r=await sb.auth.updateUser({password:a}); if(r.error){ authErr(r.error.message); return; }
