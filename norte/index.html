async function changePwGo(){ const a=val('cpPw'),b=val('cpPw2'); if(a.length<6){ authErr('Mínimo 6 caracteres.'); return; } if(a!==b){ authErr('Não confere.'); return; }
  if(!sbReady()){ authErr('Precisa estar online e logado.'); return; }
  try{ const r=await sb.auth.updateUser({password:a}); if(r.error){ authErr(r.error.message); return; }
    localStorage.setItem('norte-pwhash',await sha(a)); closeAuth(); toast('Senha trocada ✓'); }catch(e){ authErr('Erro: '+(e.message||e)); } }
async function removeAccountLocal(){
  const pw=await uiPrompt('Digite sua senha pra remover a proteção deste aparelho. O Norte volta ao modo local (sem sincronizar); seus dados continuam salvos aqui.',{type:'password',title:'Tirar a senha?',ok:'Tirar senha'});
  if(pw===null||pw==='')return;
  let ok=false; if(sb){ try{ const r=await sb.auth.signInWithPassword({email:localStorage.getItem('norte-login'),password:pw}); if(!r.error)ok=true; }catch(e){} }
  if(!ok && await sha(pw)===localStorage.getItem('norte-pwhash'))ok=true;
  if(!ok){ uiAlert('Senha incorreta.'); return; }
  try{ if(sb) await sb.auth.signOut(); }catch(e){}
  if(_rtChan){ try{ sb.removeChannel(_rtChan); }catch(e){} _rtChan=null; }
  session=null; localStorage.removeItem('norte-login'); localStorage.removeItem('norte-pwhash'); localStorage.removeItem('norte-syncedAt'); localStorage.setItem('norte-nag','1');
  closeAuth(); toast('Modo local ✓'); }

/* boot */
async function boot(){ applyTheme(localStorage.getItem('assist-theme')||'dark'); load(); paintIcons();
  const h=location.hash;
  if(h.indexOf('#s=')===0){ try{ const p=dec(h.slice(3));
      if(p.edit) openSharedEditable(p); else showShared(p);
      return;
    }catch(e){ /* link inválido → segue app normal */ }
  }
  render();
  await initSupa();
  if(sb) sb.auth.onAuthStateChange(function(ev,ses){ if(ses){ session=ses; if(ev==='SIGNED_IN') onSignedIn(); } });
  if(session){ onSignedIn(); }                                   /* já logado (sessão salva ou link do e-mail) -> sincroniza direto, sem pedir nada */
  else if(!localStorage.getItem('welcome-norte')){ document.getElementById('__welcome').classList.remove('hidden'); }
  else if(!localStorage.getItem('norte-nag') && !sessionStorage.getItem('norte-upseen')){ sessionStorage.setItem('norte-upseen','1'); setTimeout(showUpgrade,500); }
  maybeLockPin();
}
boot();
(function(){
  if(!('serviceWorker' in navigator) || location.protocol==='file:') return;
  var refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){ if(refreshing)return; refreshing=true; location.reload(); });
  function banner(reg){
    if(document.getElementById('__updbar')) return;
    var b=document.createElement('div'); b.id='__updbar';
    b.style.cssText='position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));transform:translate(-50%,14px);z-index:100000;display:flex;align-items:center;gap:11px;max-width:calc(100% - 24px);background:#12161b;color:#f0f2f4;border:1px solid rgba(255,255,255,.13);border-radius:16px;padding:10px 10px 10px 15px;box-shadow:0 16px 42px rgba(0,0,0,.55);font-family:system-ui,-apple-system,\'Segoe UI\',Arial,sans-serif;font-size:13.5px;font-weight:700;opacity:0;transition:opacity .28s ease,transform .28s cubic-bezier(.34,1.4,.5,1)';
    b.innerHTML='<span>✨ Nova versão disponível</span><button id="__updbtn" style="border:none;cursor:pointer;font:inherit;font-weight:800;color:#04120a;background:#2FD9C9;border-radius:11px;padding:9px 15px">Atualizar</button>';
    document.body.appendChild(b);
    requestAnimationFrame(function(){ b.style.opacity='1'; b.style.transform='translate(-50%,0)'; });
    document.getElementById('__updbtn').onclick=function(){ this.textContent='Atualizando…'; this.disabled=true; if(reg.waiting){ reg.waiting.postMessage('SKIP_WAITING'); } else { location.reload(); } };
  }
  function watch(reg){
    if(reg.waiting && navigator.serviceWorker.controller) banner(reg);
    reg.addEventListener('updatefound',function(){ var nw=reg.installing; if(!nw) return;
      nw.addEventListener('statechange',function(){ if(nw.state==='installed' && navigator.serviceWorker.controller) banner(reg); }); });
    setInterval(function(){ reg.update().catch(function(){}); }, 60000);
  }
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').then(watch).catch(function(){}); });
})();
</script>
