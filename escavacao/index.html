<title>Escavação</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* ===== Escavação — protótipo jogável =====
   Mundo único e escuro de propósito: o jogo é um poço. Nada de tema claro —
   a cor da tela É a profundidade, e essa e a aposta central do desenho. */
:root{
  --terra:#B87A3D; --pedra:#55606B; --agua:#14606B; --magma:#C4441A; --cristal:#6E4FA8;
  --solo:#120E0A;            /* preto com viés de terra, não cinza neutro */
  --solo2:#1C160F;
  --osso:#F2E8D8;            /* texto: osso, não branco */
  --osso2:#B5A895;
  --lampada:#F2B441;         /* o acento é a lâmpada que você leva pra baixo */
  --lampada-esc:#8A6114;
  --linha:rgba(242,232,216,.14);
  --ok:#7BC47F; --alerta:#E0913A;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--solo);
  color:var(--osso);
  font-family:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  /* mata o zoom de toque duplo — num jogo de toque rápido ele dispara sozinho */
  touch-action:manipulation;
  overscroll-behavior:none;
}
#poco{position:fixed;inset:0;z-index:0}
#veu{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(125% 70% at 50% 6%, rgba(0,0,0,0) 34%, rgba(0,0,0,.40) 100%)}

.tela{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;
  max-width:520px;margin:0 auto;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}

/* ---------- topo ---------- */
.topo{display:flex;align-items:flex-start;gap:10px}
.camada{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;
  font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--osso2)}
.prof{font-family:Anton,Impact,sans-serif;font-size:clamp(46px,15vw,72px);line-height:.92;
  letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:2px}
.prof span{font-family:"Barlow Condensed",sans-serif;font-size:.3em;font-weight:600;
  letter-spacing:.1em;margin-left:6px;color:var(--osso2);vertical-align:.35em}
/* o numero e o placar do golpe: ele reage, senao o toque nao chega em lugar nenhum */
.prof{transform-origin:left center;will-change:transform}
.prof.bate{animation:bate .16s cubic-bezier(.2,.9,.3,1)}
@keyframes bate{
  0%{transform:scale(1);color:var(--osso)}
  38%{transform:scale(1.07);color:#FFF3D6}
  100%{transform:scale(1);color:var(--osso)}
}
.taxa{font-family:"Barlow Condensed",sans-serif;font-size:13px;font-weight:600;
  letter-spacing:.06em;color:var(--lampada);min-height:16px;font-variant-numeric:tabular-nums}
.eng{margin-left:auto;flex:0 0 auto;width:38px;height:38px;border-radius:11px;
  border:1px solid var(--linha);background:rgba(0,0,0,.28);color:var(--osso2);
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.eng:active{transform:scale(.94)}

/* ---------- meio: o vazio é de propósito, é onde o poço aparece ---------- */
.meio{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding-bottom:6px}

/* achado que sobe */
.achado{border-left:2px solid var(--lampada);padding:9px 0 9px 12px;
  background:linear-gradient(90deg, rgba(242,180,65,.12), rgba(242,180,65,0));
  animation:sobe .5s cubic-bezier(.2,.9,.3,1)}
@keyframes sobe{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.achado .q{font-family:"Barlow Condensed",sans-serif;font-size:10.5px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--lampada)}
.achado .t{font-size:16px;font-weight:600;line-height:1.3;margin-top:2px;text-wrap:balance}
.achado .p{font-size:13px;color:var(--osso2);margin-top:3px}

/* ---------- fragmentos ---------- */
.frag{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.frag b{font-family:Anton,sans-serif;font-size:26px;font-weight:400;letter-spacing:.01em}
.frag span{font-family:"Barlow Condensed",sans-serif;font-size:11px;font-weight:600;
  letter-spacing:.18em;text-transform:uppercase;color:var(--osso2)}

/* ---------- loja ---------- */
.loja{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.loja::-webkit-scrollbar{display:none}
.item{flex:0 0 auto;min-width:132px;text-align:left;cursor:pointer;
  background:rgba(0,0,0,.34);border:1px solid var(--linha);border-radius:13px;
  padding:10px 12px;color:var(--osso);font-family:inherit}
.item:disabled{opacity:.42;cursor:default}
.item:not(:disabled){border-color:rgba(242,180,65,.42)}
.item:not(:disabled):active{transform:scale(.97)}
.item .n{font-size:13.5px;font-weight:700;line-height:1.2}
.item .d{font-size:11.5px;color:var(--osso2);margin-top:2px}
.item .c{font-family:"Barlow Condensed",sans-serif;font-size:13px;font-weight:700;
  letter-spacing:.04em;margin-top:6px;font-variant-numeric:tabular-nums}
.item:not(:disabled) .c{color:var(--lampada)}
.item .q{float:right;font-size:11px;color:var(--osso2);font-weight:600}

/* ---------- cavar ---------- */
.cavar{width:100%;border:none;border-radius:16px;cursor:pointer;touch-action:none;
  font-family:Anton,sans-serif;font-size:26px;letter-spacing:.06em;
  background:var(--lampada);color:#191206;
  padding:20px 0;box-shadow:0 6px 0 var(--lampada-esc), 0 12px 26px rgba(0,0,0,.5);
  transition:padding .45s cubic-bezier(.2,.9,.3,1), font-size .45s, box-shadow .12s, transform .06s}
.cavar:active{transform:translateY(4px);box-shadow:0 2px 0 var(--lampada-esc), 0 6px 14px rgba(0,0,0,.5)}
/* quando a broca assume, o botão encolhe: ainda dá pra cavar, mas não precisa */
  /* ---------- barra da mochila e loja ---------- */
  .barra{ display:flex; gap:8px; width:100%; }
  .trocar{ flex:1; text-align:left; cursor:pointer; font-family:inherit; color:var(--osso);
      background:rgba(0,0,0,.36); border:1px solid rgba(242,180,65,.42); border-radius:13px; padding:9px 13px; }
  .trocar:disabled{ opacity:.42; border-color:var(--linha); cursor:default; }
  .trocar:not(:disabled):active{ transform:scale(.98); }
  .trocar .tn{ display:block; font-family:Anton,sans-serif; font-size:17px; letter-spacing:.02em; }
  .trocar:not(:disabled) .tn{ color:var(--lampada); }
  .trocar .td{ display:block; font-size:11.5px; color:var(--osso2); margin-top:1px; }
  .trocar .tn b{ color:var(--osso); }
  .trocar .td i{ display:inline-block; width:7px; height:7px; border-radius:2px;
      margin-right:3px; vertical-align:middle; }
  .lojabt{ flex:0 0 auto; cursor:pointer; font-family:Anton,sans-serif; font-size:17px;
      letter-spacing:.06em; color:#191206; background:var(--lampada); border:none;
      border-radius:13px; padding:0 20px; }
  .lojabt:active{ transform:scale(.97); }
  /* ---------- a loja ---------- */
  .lojatopo{ display:flex; align-items:baseline; gap:10px; margin-bottom:12px; }
  .lojatopo h2{ margin:0; }
  .lojanota{ font-size:12.5px; color:var(--osso2); margin:-4px 2px 10px; }
  .lojanota b{ color:var(--lampada); }
  .moedas{ margin-left:auto; font-family:Anton,sans-serif; font-size:20px; color:var(--lampada);
      font-variant-numeric:tabular-nums; }
  .moedas em{ font-family:"Barlow Condensed",sans-serif; font-style:normal; font-size:11px;
      font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--osso2); }
  .abas{ display:flex; gap:6px; margin-bottom:12px; }
  .abas button{ flex:1; cursor:pointer; font-family:"Barlow Condensed",sans-serif; font-size:12px;
      font-weight:700; letter-spacing:.10em; text-transform:uppercase; padding:9px 4px;
      border-radius:10px; border:1px solid var(--linha); background:rgba(0,0,0,.3); color:var(--osso2); }
  .abas button.on{ background:var(--lampada); color:#191206; border-color:var(--lampada); }
  .prateleira{ display:flex; flex-direction:column; gap:7px; margin-bottom:14px; }
  .pit{ display:grid; grid-template-columns:1fr auto; gap:2px 12px; text-align:left; cursor:pointer;
      font-family:inherit; color:var(--osso); background:rgba(0,0,0,.32);
      border:1px solid rgba(242,180,65,.34); border-radius:12px; padding:11px 13px; }
  .pit.off{ opacity:.40; border-color:var(--linha); cursor:default; }
  .pit.usando{ border-color:var(--lampada); background:rgba(242,180,65,.10); }
  .pit:not(.off):active{ transform:scale(.985); }
  .pn{ font-size:14.5px; font-weight:700; }
  .pn i{ font-style:normal; font-size:11.5px; color:var(--osso2); font-weight:600; }
  .pd{ font-size:11.5px; color:var(--osso2); }
  .pc{ grid-column:2; grid-row:1 / span 2; align-self:center; font-family:"Barlow Condensed",sans-serif;
      font-size:13px; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .pit:not(.off) .pc{ color:var(--lampada); }
  #lojaPainel .acoes button{ background:rgba(0,0,0,.3); }
.cavar.menor{padding:11px 0;font-size:17px}

/* ---------- parede / colapso ---------- */
.parede{border:1px solid rgba(242,180,65,.5);border-radius:14px;padding:14px;
  background:rgba(242,180,65,.09)}
.parede h3{margin:0 0 4px;font-family:Anton,sans-serif;font-weight:400;font-size:19px;letter-spacing:.01em}
.parede p{margin:0 0 11px;font-size:13.5px;color:var(--osso2);line-height:1.45}
.parede button{width:100%;border:none;border-radius:11px;padding:13px;cursor:pointer;
  background:var(--lampada);color:#191206;font-family:Anton,sans-serif;font-size:17px;letter-spacing:.04em}

/* ---------- painel de ajuste ---------- */
.fundo{position:fixed;inset:0;z-index:20;background:rgba(6,4,2,.72);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center}
.fundo.off{display:none}
.painel{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  background:var(--solo2);border:1px solid var(--linha);border-radius:18px 18px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.painel h2{margin:0 0 3px;font-family:Anton,sans-serif;font-weight:400;font-size:21px;letter-spacing:.01em}
.painel .sub{margin:0 0 16px;font-size:13px;color:var(--osso2);line-height:1.5}
.grupo{margin-bottom:16px}
.grupo h4{margin:0 0 8px;font-family:"Barlow Condensed",sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;color:var(--lampada)}
.linha{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid rgba(242,232,216,.07)}
.linha:last-child{border-bottom:none}
.linha label{flex:1;font-size:13.5px}
.linha label em{display:block;font-style:normal;font-size:11.5px;color:var(--osso2);margin-top:1px}
.linha input{width:82px;flex:0 0 82px;font-family:inherit;font-size:15px;text-align:right;
  background:rgba(0,0,0,.36);border:1px solid var(--linha);border-radius:9px;
  padding:8px 10px;color:var(--osso);outline:none;font-variant-numeric:tabular-nums}
.linha input:focus{border-color:var(--lampada)}
.chave{flex:0 0 52px;width:52px;height:30px;border-radius:99px;cursor:pointer;padding:0;
  border:1px solid var(--linha);background:rgba(0,0,0,.4);position:relative;transition:background .16s,border-color .16s}
.chave span{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:var(--osso2);transition:transform .16s cubic-bezier(.2,.9,.3,1),background .16s}
.chave[aria-pressed="true"]{background:var(--lampada);border-color:var(--lampada)}
.chave[aria-pressed="true"] span{transform:translateX(22px);background:#191206}
.previa{background:rgba(0,0,0,.34);border:1px solid var(--linha);border-radius:12px;padding:12px;margin-bottom:16px}
.previa .r{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:13.5px}
.previa .r b{font-family:"Barlow Condensed",sans-serif;font-size:16px;font-variant-numeric:tabular-nums}
.previa .r b.bom{color:var(--ok)} .previa .r b.ruim{color:var(--alerta)}
.acoes{display:flex;gap:8px;margin-top:4px}
.acoes button{flex:1;border-radius:11px;padding:13px;cursor:pointer;font-family:inherit;
  font-size:14px;font-weight:700;border:1px solid var(--linha);
  background:rgba(0,0,0,.3);color:var(--osso)}
.acoes button.forte{background:var(--lampada);color:#191206;border-color:var(--lampada)}
.nota{font-size:12px;color:var(--osso2);line-height:1.5;margin-top:12px}

:focus-visible{outline:2px solid var(--lampada);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* durante a chegada só existe a paisagem: painel e mochila são ruído aqui */
body.chegando .topo, body.chegando .meio{ opacity:0; pointer-events:none; }
body.chegando .topo, body.chegando .meio, body.chegando .cavar{ transition:opacity .45s ease; }
body.chegando .cavar{ background:rgba(20,24,28,.55); border:1px solid rgba(242,233,218,.30);
  color:#F2E9DA; backdrop-filter:blur(6px); }
</style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#120E0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icone-192.png">

<canvas id="poco"></canvas>
<div id="veu"></div>

<div class="tela">
  <div class="topo">
    <div>
      <div class="camada" id="camada">SUPERFÍCIE</div>
      <div class="prof"><span id="profN">0,0</span><span>metros</span></div>
      <div class="taxa" id="taxa"></div>
    </div>
    <button class="eng" id="btEng" aria-label="Painel de ajuste" title="Ajustar">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <path d="M4 7h6M14 7h6M4 12h10M18 12h2M4 17h3M11 17h9"/>
        <circle cx="12" cy="7" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="9" cy="17" r="2"/>
      </svg>
    </button>
  </div>

  <div class="meio">
    <div id="achado"></div>
    <div class="frag" id="fragBox" style="display:none"><b id="fragN">0</b><span>fragmentos</span></div>
    <div id="parede"></div>
    <div class="loja" id="loja"></div>
  </div>

  <button class="cavar" id="btCavar">CAVAR</button>
</div>

<div class="fundo off" id="lojaFundo" onclick="fechaLoja()">
  <div class="painel" id="lojaPainel" onclick="event.stopPropagation()"></div>
</div>

<div class="fundo off" id="fundo">
  <div class="painel" onclick="event.stopPropagation()">
    <h2>Painel de ajuste</h2>
    <p class="sub">É aqui que o jogo se decide. Mexa, feche e sinta — a prévia
      abaixo recalcula o primeiro minuto a cada mudança.</p>

    <div class="previa" id="previa"></div>

    <div class="grupo">
      <h4>O toque</h4>
      <div class="linha"><label>Metros por toque<em>quanto cada CAVAR desce</em></label><input id="aTap" type="number" step="0.05"></div>
      <div class="linha"><label>Fragmentos por metro<em>o ritmo do dinheiro</em></label><input id="aFrag" type="number" step="0.5"></div>
    </div>

    <div class="grupo">
      <h4>A primeira máquina</h4>
      <div class="linha"><label>Custo da broca<em>em fragmentos</em></label><input id="aBroca" type="number" step="1"></div>
      <div class="linha"><label>Produção da broca<em>metros por segundo</em></label><input id="aBrocaM" type="number" step="0.05"></div>
      <div class="linha"><label>1º achado em<em>metros — é o presente de entrada</em></label><input id="aAchado" type="number" step="0.5"></div>
      <div class="linha"><label>O que ele dá<em>fragmentos</em></label><input id="aAchadoF" type="number" step="1"></div>
    </div>

    <div class="grupo">
      <h4>A curva</h4>
      <div class="linha"><label>Custo sobe a cada compra<em>1,15 = +15%</em></label><input id="aCurva" type="number" step="0.01"></div>
      <div class="linha"><label>A parede em<em>metros — onde o colapso abre</em></label><input id="aParede" type="number" step="50"></div>
      <div class="linha"><label>O colapso devolve<em>0,4 = +40% permanente</em></label><input id="aColapso" type="number" step="0.05"></div>
    </div>

    <div class="grupo">
      <h4>No aparelho</h4>
      <div class="linha"><label>Vibração ao cavar<em id="vibNota">o iPhone não tem esse recurso na web</em></label>
        <button class="chave" id="aVib" type="button" aria-pressed="true"><span></span></button></div>
    </div>

    <div class="acoes">
      <button id="btZerar">Recomeçar do zero</button>
      <button class="forte" id="btFechar">Jogar</button>
    </div>
    <p class="nota" id="notaSalvo"></p>
  </div>
</div>

<script>
/* ============================================================
   Escavação — protótipo. O que importa aqui não é estar completo,
   é o PRIMEIRO MINUTO ser sentido e ajustável.
   ============================================================ */
const CHAVE = 'escavacao-proto-v1';

/* --- os números que estão em teste (o painel mexe nestes) --- */
const PADRAO = {
  /* calibrados pelos alvos de ritmo, nao no olho: a 2,4 toques/s isso da
     achado aos ~18 s e a broca aos ~50 s, e a broca rende ~o mesmo que a mao
     (104%) — que e o que faz o "nao precisa mais" ser sentido, nao anunciado. */
  tap: 0.20,        /* metros por toque */
  fragM: 1.5,       /* fragmentos por metro */
  brocaC: 47,       /* custo da 1a broca */
  brocaM: 0.5,      /* m/s da 1a broca */
  achado1: 8.5,     /* profundidade do 1o achado */
  achado1F: 11,     /* fragmentos que ele da (23% da broca: empurra, nao entrega) */
  curva: 1.15,      /* crescimento do custo por compra */
  parede: 1200,     /* onde a rocha-mae aparece */
  colapso: 0.40,    /* +40% permanente por colapso */
  vib: 1            /* vibração do aparelho ligada */
};

/* --- as camadas: a cor da tela é a profundidade --- */
const CAMADAS = [
  {m:0,    nome:'SUPERFÍCIE',      a:'#3A2A18', b:'#B87A3D'},
  {m:15,   nome:'TERRA COMPACTA',  a:'#2A1F13', b:'#8A5A2C'},
  {m:80,   nome:'PEDRA',           a:'#161B20', b:'#55606B'},
  {m:250,  nome:'LENÇOL FREÁTICO', a:'#06222A', b:'#14606B'},
  {m:600,  nome:'MAGMA',           a:'#2A0C05', b:'#C4441A'},
  {m:1000, nome:'CRISTAL',         a:'#150B26', b:'#6E4FA8'}
];

/* --- o que se compra na loja, em três prateleiras --- */
const EQUIP = [
  {id:'broca',  n:'Broca a manivela', d:'+0,6 m/s',      base:40,     mps:0.6},
  {id:'ponta',  n:'Ponta de aço',     d:'dobra o golpe', base:120,    tap:2, max:6},
  {id:'balanca',n:'Balança aferida',  d:'+30% na troca', base:200,    troca:0.30, max:8},
  {id:'vapor',  n:'Motor a vapor',    d:'+4 m/s',        base:260,    mps:4},
  {id:'guin',   n:'Guincho',          d:'+26 m/s',       base:1500,   mps:26},
  {id:'perf',   n:'Perfuratriz',      d:'+170 m/s',      base:9000,   mps:170},
  {id:'tunel',  n:'Tuneladora',       d:'+1.100 m/s',    base:60000,  mps:1100}
];
/* o que se arranca da pedra. 'de' é a partir de que metro ele começa a sair;
   'raro' é o peso na hora do sorteio (menor = mais raro). */
const ITENS = [
  {id:'cascalho', n:'Cascalho',  de:0,    val:1,    raro:100, cor:'#8A7C6A'},
  {id:'ferro',    n:'Ferro',     de:18,   val:4,    raro:60,  cor:'#9B6A46'},
  {id:'carvao',   n:'Carvão',    de:60,   val:9,    raro:45,  cor:'#3A3A3E'},
  {id:'cobre',    n:'Cobre',     de:140,  val:22,   raro:30,  cor:'#C87F42'},
  {id:'prata',    n:'Prata',     de:320,  val:70,   raro:16,  cor:'#C9D2DA'},
  {id:'ouro',     n:'Ouro',      de:620,  val:240,  raro:8,   cor:'#E7B54A'},
  {id:'esmeralda',n:'Esmeralda', de:900,  val:900,  raro:3,   cor:'#3FBF86'},

let S, cfg, ultimo = performance.now(), salvoEm = 0;

function novo(){
  return { prof:0, frag:0, moedas:0, tot:0, colapsos:0, comprado:{}, achados:[], chegou:false,
           visto:false, roupa:'r0', acess:'a0', tem:{r0:1,a0:1}, equipe:{},
           mochila:{}, t:Date.now() };
}
function carrega(){
  cfg = Object.assign({}, PADRAO);
  try{
    const c = JSON.parse(localStorage.getItem(CHAVE+'-cfg')||'null');
    if(c) cfg = Object.assign(cfg, c);
  }catch(e){}
  try{
    S = JSON.parse(localStorage.getItem(CHAVE)||'null') || novo();
  }catch(e){ S = novo(); }
  /* o tempo de app fechado: teto de 4h, que é a forma recomendada */
  const fora = Math.min((Date.now() - (S.t||Date.now()))/1000, 4*3600);
  if(fora > 60 && mps() > 0){
    const ganho = fora * forca();   /* trabalho, que o cava() converte */
    cava(ganho);   /* pelo funil: respeita a dureza como o resto */
    setTimeout(()=>mostraAchado('DE VOLTA', 'A broca não parou',
      fmt(ganho/dureza(),1)+' m enquanto o app esteve fechado.'), 400);
  }
}
function salva(){

/* ---------------- regras ---------------- */
function qtd(id){ return S.comprado[id]||0; }
function custo(m){ return Math.ceil(m.base * Math.pow(cfg.curva, qtd(m.id))); }
/* quanto vale cada minério na troca — a balança é o upgrade que pousa aqui */
function taxa(){
  let v = 1;
  EQUIP.forEach(function(m){ if(m.troca) v += m.troca * qtd(m.id); });
  return v;
}
/* o que a camada atual pode dar */
function itensAqui(){
  return ITENS.filter(function(o){ return S.prof >= o.de; });
}
/* sorteio por peso: o raro é raro porque pesa menos, não porque tem um 'if' */
function sorteiaItem(){
  const l = itensAqui();
  let soma = 0; l.forEach(function(o){ soma += o.raro; });
  let r = Math.random()*soma;
  for(let i=0;i<l.length;i++){ r -= l[i].raro; if(r<=0) return l[i]; }
  return l[0];
}
function naMochila(id){ return (S.mochila && S.mochila[id]) || 0; }
/* o valor da mochila inteira, que é o que a troca paga */
function valorMochila(){
  let v = 0;
  ITENS.forEach(function(o){ v += naMochila(o.id) * o.val; });
  return v;
}
function pecasMochila(){
  let n = 0;
  ITENS.forEach(function(o){ n += naMochila(o.id); });
  return n;
}
/* cada peça arrancada entra na mochila e cai visível na tela */
function arranca(qtdPecas){
  if(!S.mochila) S.mochila = {};
  for(let i=0;i<qtdPecas;i++){
    const o = sorteiaItem();
    S.mochila[o.id] = naMochila(o.id) + 1;
    if(o.val >= 70) achouRaro(o);      /* prata pra cima vale um anúncio */
  }
}
let raroFlash = null;
function achouRaro(o){
  raroFlash = { cor:o.cor, t:1, n:o.n };
  vibra('achado');
}

/* quantos de cada função */
function nEq(id){ return (S.equipe && S.equipe[id]) || 0; }
function custoEq(e){ return Math.ceil(e.base * Math.pow(1.18, nEq(e.id))); }
/* quanta gente há no total — é o número que o jogador sente crescer */
function povo(){ let n = 1; EQUIPE.forEach(function(e){ n += nEq(e.id); }); return n; }
/* O escorador cresce com a mina — mas LOGARITMICAMENTE e com teto.
   ⚠️ Linear era realimentação sem freio: render mais leva a mais fundo, que
   leva a render mais. O simulador chegou a Infinity em 4 minutos. */
function fatorFundo(){
  let f = 0;
  EQUIPE.forEach(function(e){ if(e.fundo) f += e.fundo * nEq(e.id); });
  return 1 + f * Math.min(Math.log(1 + S.prof/40)/Math.LN10, 4.5);
}
function fatorMinerio(){
  let f = 1;
  EQUIPE.forEach(function(e){ if(e.min) f += e.min * nEq(e.id); });
  return f;
}
function fatorLuz(){
  let f = 0;
  EQUIPE.forEach(function(e){ if(e.luz) f += e.luz * nEq(e.id); });
  return 1 + f;
}

function roupaAtual(){ return ROUPAS.find(function(r){ return r.id===S.roupa; }) || ROUPAS[0]; }
function acessAtual(){ return ACESS.find(function(a){ return a.id===S.acess; }) || ACESS[0]; }
function troca(){
  const pecas = pecasMochila();
  if(pecas <= 0) return;
  const ganho = Math.floor(valorMochila() * taxa());
  /* o que mais pesou na mochila: é o que a pessoa quer ler de volta */
  let melhor = null, melhorV = 0;
  ITENS.forEach(function(o){
    const v = naMochila(o.id) * o.val;
    if(v > melhorV){ melhorV = v; melhor = o; }
  });
  S.mochila = {}; S.moedas += ganho;
  vibra('compra'); salva(); pinta();
  mostraAchado('TROCA', ganho.toLocaleString('pt-BR') + ' moedas',
    pecas.toLocaleString('pt-BR') + ' peças' +
    (melhor ? ' — o grosso veio de ' + melhor.n.toLowerCase() + '.' : '.'));
}
/* COMPOSTO, não somado: é o colapso que sustenta o jogo longo */
function bonus(){ return Math.pow(1 + cfg.colapso, S.colapsos); }
/* a parede desce a cada volta: cada corrida vai mais fundo que a anterior */
function paredeAtual(){ return cfg.parede * Math.pow(1.55, S.colapsos); }
/* FORÇA: rocha quebrada por segundo. Não é metro — metro é força/dureza. */
function forca(){
  let v = 0;
  EQUIP.forEach(m=>{ if(m.mps){ const q=qtd(m.id); v += (m.id==='broca' ? cfg.brocaM : m.mps) * q; } });
  EQUIPE.forEach(e=>{ if(e.mps) v += e.mps * nEq(e.id); });
  return v * bonus() * fatorFundo();
}
/* o que a mina realmente anda por segundo */
function mps(){ return forca() / dureza(); }
function porToque(){
  let t = cfg.tap;
  EQUIP.forEach(m=>{ if(m.tap) t *= Math.pow(m.tap, qtd(m.id)); });
  return t * bonus();
}
function camada(){
  let c = CAMADAS[0];
  for(const k of CAMADAS) if(S.prof >= k.m) c = k;
  return c;
}
function fmt(n, casas){
  const c = casas===undefined ? (n<100?1:0) : casas;
  return n.toLocaleString('pt-BR',{minimumFractionDigits:c, maximumFractionDigits:c});
}

/* Dureza da rocha: 0,22% a mais por metro. Parece pouco e não é —
   a 1.000 m a pedra já custa 8x mais, a 3.000 m custa 700x. É esse número
   que faz a mina descer num ritmo humano enquanto a força explode. */
function dureza(){ return Math.pow(1.0022, S.prof); }

let acumPeca = 0;
/* ⚠️ o argumento é TRABALHO (rocha quebrada), não metro.
   metro = trabalho / dureza · minério = trabalho */
function cava(trabalho){
  const metros = trabalho / dureza();
  S.prof += metros; S.tot += metros;
  /* S.frag deixa de ser dinheiro e vira o CONTADOR de peças a arrancar */
  acumPeca += trabalho * cfg.fragM * fatorMinerio();
  if(acumPeca >= 1){
    const n = Math.floor(acumPeca);
    acumPeca -= n;
    arranca(Math.min(n, 40));          /* teto: 38 m/s não pode virar 4000 peças */
  }
  if(!S.visto && S.frag > 0){ S.visto = true; }
  confereAchados();
}
function confereAchados(){
  ACHADOS.forEach((a,i)=>{
    const alvo = (i===0) ? cfg.achado1 : a.m;
    if(S.prof >= alvo && S.achados.indexOf(i) < 0){
      S.achados.push(i);
      if(i===0){ S.frag += cfg.achado1F; }
      mostraAchado('ACHADO A '+fmt(alvo,1)+' M', a.t, a.p);
      revelado = {i:i, t:1};
      pisca(); vibra('achado');
    }
  });
}

  else {

    const top = ITENS.filter(function(o){ return naMochila(o.id) > 0; })

          '<span class="td">' + (q ? top.map(function(o){

      elParede.innerHTML='<div class="parede"><h3>A rocha-mãe</h3>'+

        '<button id="btColapso">Colapsar a mina</button></div>';
      document.getElementById('btColapso').onclick = colapsa;
    }
  } else { elParede.innerHTML=''; delete elParede.dataset.on; }
}

function colapsa(){

  S = novo(); S.colapsos = c; S.visto = true;

let achadoT;
function mostraAchado(q,t,p){

/* ---------------- o poço (canvas) ---------------- */
const cv = document.getElementById('poco'), cx = cv.getContext('2d');
let L=0, A=0, R=1;
let cacos=[], rachas=[], ganhos=[], ganhoN=0, motas=[];
let tremor=0, picoT=1, brilho=0;
/* a câmera: persegue a profundidade com mola e atrito. É ela que faz o mundo
   CONTINUAR descendo depois que o dedo sai, e passar um tico do alvo antes de
   assentar — o que o corpo lê como peso. */
let camY=0, camV=0;
const PPM = 44;            /* pixels por metro (x R). A escala do mundo. */
let ROCHA=0;              /* onde a picareta bate — a boca do poço */
let LAD=null, LADT=0;     /* o ladrilho de rocha, e o lado dele */

/* ---- o ladrilho: desenhado UMA vez, rolado pra sempre ----
   Cinza de propósito: entra em 'overlay' e recebe a cor da camada, então uma
   textura só serve terra, pedra, água, magma e cristal. */
function fazLadrilho(){
  const T = 320;
  const c = document.createElement('canvas'); c.width=T; c.height=T;
  const g = c.getContext('2d');
  g.fillStyle='#808080'; g.fillRect(0,0,T,T);

  function pedra(px,py,raio,tom){
    const n = 7 + ((raio*7)|0)%4;
    g.beginPath();
    for(let i=0;i<=n;i++){
      const a = i/n*Math.PI*2;
      const rr = raio*(0.66 + ((Math.sin(a*3+px)*0.5+0.5)*0.5));
      const x = px+Math.cos(a)*rr, y = py+Math.sin(a)*rr;
      i===0 ? g.moveTo(x,y) : g.lineTo(x,y);
    }
    g.closePath();
    g.fillStyle = 'rgb('+tom+','+tom+','+tom+')'; g.fill();
    g.strokeStyle = 'rgba(40,40,40,.30)'; g.lineWidth=1.4; g.stroke();
    /* aresta iluminada: é o que dá volume à pedra */
    g.strokeStyle = 'rgba(230,230,230,.20)'; g.lineWidth=1;
    g.beginPath(); g.arc(px,py,raio*0.72,Math.PI*1.05,Math.PI*1.75); g.stroke();
  }

  /* cada pedra é desenhada nas 9 posições: é o que faz o ladrilho emendar */
  for(let k=0;k<70;k++){
    const px = Math.random()*T, py = Math.random()*T;
    const raio = 12 + Math.random()*36;
    const tom = 108 + ((Math.random()*44)|0);
    for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++) pedra(px+dx*T, py+dy*T, raio, tom);
  }

  /* fissuras */
  g.lineCap='round';
  for(let k=0;k<16;k++){
    const x0=Math.random()*T, y0=Math.random()*T;
    for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++){
      g.strokeStyle='rgba(38,38,38,.34)'; g.lineWidth=1+Math.random()*1.6;
      g.beginPath(); g.moveTo(x0+dx*T, y0+dy*T);
      let x=x0+dx*T, y=y0+dy*T;
      for(let s=0;s<4;s++){ x+=(Math.random()-.5)*46; y+=(Math.random()-.35)*40; g.lineTo(x,y); }
      g.stroke();
    }
  }

  /* salpico: o que impede a pedra de parecer plástico */
  for(let k=0;k<900;k++){
    const x=Math.random()*T, y=Math.random()*T;
    g.fillStyle = Math.random()<.5 ? 'rgba(50,50,50,.22)' : 'rgba(220,220,220,.16)';
    g.fillRect(x,y,1.6,1.6);
  }

  /* veios de quartzo */
  for(let k=0;k<5;k++){
    const y0=Math.random()*T;
    for(let dy=-1;dy<=1;dy++){
      g.strokeStyle='rgba(238,238,238,.30)'; g.lineWidth=2+Math.random()*3;
      g.beginPath(); g.moveTo(-10, y0+dy*T);
      let y=y0+dy*T;
      for(let x=0;x<=T+10;x+=40){ y += (Math.random()-.5)*22; g.lineTo(x,y); }
      g.stroke();
    }
  }
  LAD = c; LADT = T;
}

function tamanho(){
  R = Math.min(devicePixelRatio||1, 2);
  L = cv.width = innerWidth*R; A = cv.height = innerHeight*R;
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  ROCHA = A*0.60;
  if(!LAD) fazLadrilho();
  motas = [];
  for(let i=0;i<28;i++) motas.push({x:Math.random()*L, y:Math.random()*A,
    v:(6+Math.random()*16)*R, s:(1+Math.random()*2.2)*R, o:.10+Math.random()*.22});
}
addEventListener('resize', tamanho); tamanho();

function mistura(a,b,t){
  const h=s=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];
  const x=h(a), y=h(b);
  return 'rgb('+Math.round(x[0]+(y[0]-x[0])*t)+','+Math.round(x[1]+(y[1]-x[1])*t)+','+Math.round(x[2]+(y[2]-x[2])*t)+')';
}
function coresAgora(){
  /* interpola entre a camada atual e a próxima: a cor muda ANTES da fronteira,
     então a transição é sentida como descida, não como um corte */
  let i=0; for(let k=0;k<CAMADAS.length;k++) if(camY>=CAMADAS[k].m) i=k;
  const at=CAMADAS[i], prox=CAMADAS[Math.min(i+1,CAMADAS.length-1)];
  const faixa = prox.m - at.m;
  const t = faixa>0 ? Math.min(Math.max((camY-at.m)/faixa,0),1) : 0;
  return { a: mistura(at.a, prox.a, t), b: mistura(at.b, prox.b, t) };
}

function golpe(forca){
  picoT = 0;
  camV += 1.15*forca;        /* o tranco: o golpe empurra o mundo pra baixo */
  tremor = 3*forca;
  brilho = 1;
  const bp = pontoImpacto();      /* mesma fonte da ferramenta */
  /* o caco sai na cor da camada — o que voa é o que você está arrancando */
  const iAqui = itensAqui();
  const corCaco = iAqui.length ? iAqui[Math.floor(Math.random()*Math.min(iAqui.length,3))].cor : '#D9C4A2';
  const n = Math.round(7*forca);
  for(let i=0;i<n;i++){
    const a = -Math.PI/2 + (Math.random()-.5)*2.0;
    const v = (4.2+Math.random()*6.4)*R*forca;
    cacos.push({x:bp.x+(Math.random()-.5)*70*R, y:bp.y,
      vx:Math.cos(a)*v, vy:Math.sin(a)*v,
      g:(.34+Math.random()*.20)*R, t:1, s:(4.5+Math.random()*5.5)*R,
      rot:Math.random()*6.28, vr:(Math.random()-.5)*.42, cor:corCaco});
  }
  rachas.push({x:bp.x+(Math.random()-.5)*120*R, y:bp.y+(Math.random()-.5)*34*R,
    a:Math.random()*6.28, c:(14+Math.random()*20)*R, t:1});
  if(rachas.length>5) rachas.shift();
}
/* a tela inteira balança — só no toque manual. Fica no body porque os três
   planos (poço, véu, interface) são filhos fixos dele e viajam juntos.
   A máquina bate até 11x/s: tremer junto viraria enjoo. */
let telaT = 0, telaAtiva = false;
const REDUZ = matchMedia('(prefers-reduced-motion: reduce)').matches;
function sacode(){
  if(REDUZ) return;
  telaT = 2.6;
  if(!telaAtiva){ telaAtiva = true; document.body.style.willChange='transform'; passoTela(); }
}
function passoTela(){
  if(telaT < 0.18){
    telaT = 0; telaAtiva = false;
    document.body.style.transform = '';
    document.body.style.willChange = '';
    return;
  }
  document.body.style.transform =
    'translate(' + ((Math.random()-.5)*telaT).toFixed(2) + 'px,' +
                   ((Math.random()-.5)*telaT).toFixed(2) + 'px)';
  telaT *= 0.74;
  requestAnimationFrame(passoTela);
}

function sobeGanho(txt){
  ganhoN = (ganhoN+1) % 3;
  const bg = pontoImpacto();
  ganhos.push({x:bg.x+(Math.random()-.5)*60*R, y:bg.y-30*R-ganhoN*22*R, t:1, txt:txt});
  if(ganhos.length>3) ganhos.shift();
}

function desenha(dt){
  if(!S.chegou){ desenhaChegada(dt); return; }
  /* mola: puxa pro alvo, o atrito segura. Sem o atrito ela oscilaria pra sempre. */
  camV += (S.prof - camY) * 130 * dt;
  camV *= Math.pow(0.0009, dt);
  camY += camV * dt;
  /* se ficar longe demais (voltar de horas fechado, colapso), corta a viagem */
  if(Math.abs(S.prof - camY) > 60){ camY = S.prof; camV = 0; }

  const c = coresAgora();
  cx.setTransform(1,0,0,1,0,0);
  cx.globalCompositeOperation='source-over'; cx.globalAlpha=1;
  cx.clearRect(0,0,L,A);

  /* tremor: só o mundo balança. Sacudir a interface moveria o botão sob o dedo. */
  if(tremor>0.05){
    cx.translate((Math.random()-.5)*tremor*R, (Math.random()-.5)*tremor*R);
    tremor *= 0.80;
  } else tremor = 0;

  const g = cx.createLinearGradient(0,-8*R,0,A+8*R);
  g.addColorStop(0, c.a); g.addColorStop(1, c.b);
  cx.fillStyle=g; cx.fillRect(-10*R,-10*R,L+20*R,A+20*R);

  /* a rocha, em duas camadas: a de trás anda menos e vira profundidade */
  if(LAD){
    cx.globalCompositeOperation='overlay';
    ladrilha(PPM*0.38/10*R, 0.34, 9*R);   /* fundo: anda menos = distância */
    ladrilha(PPM/10*R, 0.62, 0);          /* frente: a escala do mundo */
    costura();                            /* a fronteira entre camadas, passando */
    cx.globalCompositeOperation='source-over';
  }

  /* o volume, de trás pra frente: teto, paredes, chão. O primeiro plano fica
     pro fim, DEPOIS do mineiro — é ele que põe o corpo dentro da cena. */
  teto();
  paredes();
  chao();

  /* poeira no ar: sem isso a tela morre quando ninguém toca */
  cx.fillStyle='#FFF0D2';
  for(const m of motas){
    m.y -= m.v*dt;
    if(m.y < -6*R){ m.y = A+6*R; m.x = Math.random()*L; }
    cx.globalAlpha = m.o; cx.fillRect(m.x, m.y, m.s, m.s);
  }
  cx.globalAlpha=1;

  regua();
  desenhaAchados(dt);

  /* achou coisa boa: a tela inteira pisca na cor da pedra. É o único momento
     em que a raridade se anuncia sozinha. */
  if(raroFlash){
    raroFlash.t -= dt*1.5;
    if(raroFlash.t <= 0) raroFlash = null;
    else {
      cx.save(); cx.globalCompositeOperation='lighter';
      const bp = pontoImpacto();
      const g = cx.createRadialGradient(bp.x,bp.y,0,bp.x,bp.y,A*0.5);
      g.addColorStop(0, raroFlash.cor.replace(')', '')+'');
      cx.globalAlpha = raroFlash.t*0.30;
      const gg = cx.createRadialGradient(bp.x,bp.y,0,bp.x,bp.y,A*0.45);
      gg.addColorStop(0, raroFlash.cor); gg.addColorStop(1, 'rgba(0,0,0,0)');
      cx.fillStyle=gg; cx.fillRect(0,0,L,A);
      cx.restore(); cx.globalAlpha=1;
    }
  }

  /* neblina de profundidade: o fundo do túnel perde contraste, e é assim que
     o olho separa perto de longe quando não há perspectiva de verdade. */
  const neb = cx.createRadialGradient(L/2, ROCHA-A*0.06, 0, L/2, ROCHA-A*0.06, A*0.42);
  neb.addColorStop(0, 'rgba(10,6,3,0)');
  neb.addColorStop(1, 'rgba(10,6,3,.42)');
  cx.fillStyle = neb; cx.fillRect(0,0,L,A);

  /* a boca do poço, onde a picareta bate */
  const rg = cx.createLinearGradient(0,ROCHA-34*R,0,A);
  rg.addColorStop(0,'rgba(0,0,0,0)'); rg.addColorStop(.45,'rgba(0,0,0,.30)'); rg.addColorStop(1,'rgba(0,0,0,.58)');
  cx.fillStyle=rg;
  cx.beginPath();
  cx.moveTo(0, ROCHA+18*R);
  for(let x=0;x<=L;x+=26*R){
    cx.lineTo(x, ROCHA + Math.sin(x*0.014/R)*9*R + Math.sin(x*0.037/R)*4*R);
  }
  cx.lineTo(L,A); cx.lineTo(0,A); cx.closePath(); cx.fill();

  if(brilho>0.01){
    const bi = pontoImpacto();
    const b = cx.createRadialGradient(bi.x,bi.y,0,bi.x,bi.y,130*R);
    b.addColorStop(0,'rgba(255,236,190,'+(brilho*.52)+')');
    b.addColorStop(1,'rgba(255,236,190,0)');
    cx.fillStyle=b; cx.fillRect(bi.x-140*R,bi.y-140*R,280*R,280*R);
    brilho *= 0.86;
  } else brilho = 0;

  cx.lineCap='round';
  for(let i=rachas.length-1;i>=0;i--){
    const k=rachas[i]; k.t -= dt*0.9;
    if(k.t<=0){ rachas.splice(i,1); continue; }
    cx.strokeStyle='rgba(20,12,4,'+(k.t*.26)+')'; cx.lineWidth=1.6*R;
    cx.beginPath(); cx.moveTo(k.x,k.y);
    cx.lineTo(k.x+Math.cos(k.a)*k.c, k.y+Math.sin(k.a)*k.c);
    cx.lineTo(k.x+Math.cos(k.a+.9)*k.c*1.5, k.y+Math.sin(k.a+.9)*k.c*1.5);
    cx.stroke();
  }

  desenhaEquipe();          /* atrás dele: ele é quem está na frente */
  desenhaMineiro(dt);
  primeiroPlano();          /* a oclusão: o que o coloca DENTRO do buraco */

  for(let i=cacos.length-1;i>=0;i--){
    const p=cacos[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.rot+=p.vr; p.t-=dt*1.15;
    if(p.t<=0 || p.y>A+30*R){ cacos.splice(i,1); continue; }
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
    cx.globalAlpha = Math.min(p.t,1);
    cx.fillStyle = p.cor || '#D9C4A2';   /* o caco sai na cor do que se arranca */
    cx.beginPath();
    cx.moveTo(-p.s*.5,-p.s*.34); cx.lineTo(p.s*.5,-p.s*.5);
    cx.lineTo(p.s*.42,p.s*.4);   cx.lineTo(-p.s*.44,p.s*.3);
    cx.closePath(); cx.fill();
    cx.fillStyle='rgba(40,26,12,.78)';
    cx.beginPath();
    cx.moveTo(p.s*.5,-p.s*.5); cx.lineTo(p.s*.42,p.s*.4);
    cx.lineTo(-p.s*.05,p.s*.36); cx.lineTo(p.s*.02,-p.s*.42);
    cx.closePath(); cx.fill();
    cx.restore();
  }
  cx.globalAlpha=1;

  cx.textAlign='center';
  cx.font='700 '+(19*R)+'px "Barlow Condensed", Barlow, sans-serif';
  for(let i=ganhos.length-1;i>=0;i--){
    const q=ganhos[i]; q.t -= dt*1.25; q.y -= 46*R*dt;
    if(q.t<=0){ ganhos.splice(i,1); continue; }
    cx.globalAlpha = Math.min(q.t*1.5,1);
    cx.fillStyle='rgba(10,7,3,.5)'; cx.fillText(q.txt, q.x+1*R, q.y+1*R);
    cx.fillStyle='#FFE6A8'; cx.fillText(q.txt, q.x, q.y);
  }
  cx.globalAlpha=1;
  cx.setTransform(1,0,0,1,0,0);
}

/* ---- os achados dentro da pedra ----
   Silhueta fraca a 7 m de distância, ganhando luz até a descoberta. Depois
   acende e sobe. É o único lugar do jogo onde o mundo entrega algo. */
const JANELA = 7;          /* de quantos metros antes ele começa a aparecer */
let revelado = null;       /* {i, t} — o que acabou de ser descoberto */

function proximoAchado(){
  for(let i=0;i<ACHADOS.length;i++){
    if(S.achados.indexOf(i) >= 0) continue;
    const alvo = (i===0) ? cfg.achado1 : ACHADOS[i].m;
    const falta = alvo - S.prof;
    const jan = JANELA * fatorLuz();   /* o lampeiro enxerga mais longe */
    if(falta >= 0 && falta <= jan) return {i:i, p:1 - falta/jan};
    if(falta > jan) return null;      /* o próximo ainda está longe */
  }
  return null;
}


/* ====================== A CHEGADA (superfície) ====================== */
let cena = { t:0, fim:false };
const CENA_DUR = 5.4;

/* A picape. "Moderna" aqui quer dizer ANGULAR: cintura alta, vidro estreito,
   farol em fio de LED, caçamba reta. É o oposto do carrinho arredondado de
   1990 — que foi exatamente a queixa dele sobre o boneco. */
function picape(x, y, e, dir){
  cx.save(); cx.translate(x,y); cx.scale(dir*e, e);

  cx.save(); cx.scale(1,0.17);
  const sg = cx.createRadialGradient(0,0,4,0,0,120);
  sg.addColorStop(0,"rgba(0,0,0,.42)"); sg.addColorStop(1,"rgba(0,0,0,0)");
  cx.fillStyle=sg; cx.beginPath(); cx.arc(0,0,120,0,7); cx.fill(); cx.restore();

  const RODA = 24;
  /* rodas primeiro: o corpo cobre a parte de cima delas */
  [[-62,-RODA],[58,-RODA]].forEach(function(r){
    cx.fillStyle="#15161A"; cx.beginPath(); cx.arc(r[0],r[1],RODA,0,7); cx.fill();
    cx.fillStyle="#3B4048"; cx.beginPath(); cx.arc(r[0],r[1],RODA*0.52,0,7); cx.fill();
    cx.fillStyle="#8B939C"; cx.beginPath(); cx.arc(r[0],r[1],RODA*0.30,0,7); cx.fill();
  });

  /* o corpo num traço só: caçamba reta atrás, cabine, capô caído na frente */
  const cor = cx.createLinearGradient(0,-64,0,-8);
  cor.addColorStop(0,"#2E6E63"); cor.addColorStop(0.55,"#1F4F49"); cor.addColorStop(1,"#16332F");
  cx.fillStyle = cor;
  cx.beginPath();
  cx.moveTo(-92,-16); cx.lineTo(-92,-44); cx.lineTo(-40,-44);
  cx.lineTo(-34,-70); cx.lineTo(16,-72); cx.lineTo(34,-46);
  cx.lineTo(86,-42); cx.lineTo(92,-20); cx.lineTo(92,-14);
  cx.lineTo(-92,-14); cx.closePath(); cx.fill();

  /* vidro estreito e inclinado */
  cx.fillStyle="rgba(178,222,232,.55)";
  cx.beginPath(); cx.moveTo(-30,-66); cx.lineTo(13,-67); cx.lineTo(27,-48);
  cx.lineTo(-30,-48); cx.closePath(); cx.fill();
  cx.strokeStyle="rgba(255,255,255,.20)"; cx.lineWidth=1.4;
  cx.beginPath(); cx.moveTo(-6,-66); cx.lineTo(-6,-48); cx.stroke();

  /* barra de LED no teto: o detalhe que diz "moderna" sem precisar de texto */
  cx.fillStyle="#0E1113"; cx.fillRect(-32,-79,50,6);
  cx.fillStyle="#F2E7B8";
  for(let i=0;i<5;i++) cx.fillRect(-28+i*10,-77.5,6,3);

  cx.fillStyle="#F6EDCB"; cx.fillRect(78,-36,13,4.5);
  cx.strokeStyle="rgba(0,0,0,.28)"; cx.lineWidth=1.6;
  cx.beginPath(); cx.moveTo(36,-44); cx.lineTo(86,-40); cx.stroke();
  cx.fillStyle="#22262B"; cx.fillRect(-46,-14,84,5); cx.fillRect(86,-24,8,11);

  cx.restore();
}

function desenhaChegada(dt){
  cena.t = Math.min(cena.t + dt, CENA_DUR + 3);
  const t = cena.t;

  cx.setTransform(1,0,0,1,0,0); cx.globalAlpha=1;
  cx.globalCompositeOperation="source-over"; cx.clearRect(0,0,L,A);

  /* fim de tarde: é a hora em que se chega pra abrir uma mina */
  /* chão alto: com 72% de céu a cena inteira virava miniatura no horizonte */
  const CHAO = A*0.60;
  const ceu = cx.createLinearGradient(0,0,0,CHAO);
  ceu.addColorStop(0,"#1B2A3A"); ceu.addColorStop(0.55,"#40506B");
  ceu.addColorStop(1,"#B9855C");
  cx.fillStyle=ceu; cx.fillRect(0,0,L,CHAO);

  cx.fillStyle="rgba(255,214,150,.85)";
  cx.beginPath(); cx.arc(L*0.16, CHAO-56*R, 34*R, 0, 7); cx.fill();
  cx.fillStyle="#26313F";
  cx.beginPath(); cx.moveTo(0,CHAO);
  const pts=[[0,34],[0.13,78],[0.26,40],[0.38,96],[0.52,54],[0.66,112],[0.79,58],[0.91,88],[1,44]];
  pts.forEach(function(p){ cx.lineTo(L*p[0], CHAO - p[1]*R); });
  cx.lineTo(L,CHAO); cx.closePath(); cx.fill();

  const ch = cx.createLinearGradient(0,CHAO,0,A);
  ch.addColorStop(0,"#6B5637"); ch.addColorStop(1,"#3A2E1F");
  cx.fillStyle=ch; cx.fillRect(0,CHAO,L,A-CHAO);
  cx.strokeStyle="rgba(0,0,0,.30)"; cx.lineWidth=2*R;
  cx.beginPath(); cx.moveTo(0,CHAO); cx.lineTo(L,CHAO); cx.stroke();

  /* ---- a picape entra da direita e freia ---- */
  const alvoX = L*0.62;   /* recuada: a 0,70 a caçamba encostava na borda */
  const fchega = Math.min(t/2.0, 1);
  const ease = 1 - Math.pow(1-fchega, 3);
  const px = L + 140*R - (L + 140*R - alvoX)*ease;
  /* a suspensão mergulha na freada e volta: sem isso ela desliza como adesivo */
  const freia = (fchega>0.72 && fchega<1) ? Math.sin((fchega-0.72)/0.28*Math.PI)*4*R : 0;
  picape(px, CHAO + freia*0.3, 1.15*R, -1);

  if(fchega < 1){
    for(let i=0;i<7;i++){
      const q = (i/7 + t*0.7) % 1;
      cx.globalAlpha = (1-q)*0.30*(1-fchega*0.4);
      cx.fillStyle="#C6AC84";
      cx.beginPath(); cx.arc(px + (44+q*90)*R, CHAO - q*26*R, (5+q*16)*R, 0, 7); cx.fill();
    }
    cx.globalAlpha=1;
  }

  /* ---- o mineiro desce e caminha até o ponto ---- */
  if(t > 2.1){
    const fw = Math.min((t-2.1)/2.4, 1);
    const mx = px - 96*R - (px - 96*R - L*0.26)*(1-Math.pow(1-fw,2));
    const passo = fw<1 ? Math.sin(t*9)*3*R : 0;
    mineiroChegada(mx, CHAO + passo*0.15, 1.05*R, fw>=1, t);
  }

  /* ---- o convite ---- */
  if(t > CENA_DUR - 0.9){
    const fa = Math.min((t-(CENA_DUR-0.9))/0.6, 1);
    cx.globalAlpha = fa;
    cx.textAlign="center"; cx.fillStyle="#F2E9DA";
    cx.font = "bold " + (13*R) + "px Inter, system-ui, sans-serif";
    cx.letterSpacing = (2.4*R)+"px";
    cx.fillText("A MINA COMEÇA AQUI", L/2, A*0.155);
    cx.letterSpacing = "0px";
    cx.font = (11.5*R) + "px Inter, system-ui, sans-serif";
    cx.fillStyle="rgba(242,233,218,.62)";
    cx.fillText("toque para abrir o primeiro metro", L/2, A*0.155 + 21*R);
    cx.globalAlpha = 1;
    cena.fim = true;
  }
}

/* O mesmo mineiro do túnel, de corpo inteiro e de perfil. Aqui ele aparece
   GRANDE — é a única vez em que dá pra vê-lo direito, então é aqui que o
   capacete, a faixa refletiva e a picareta precisam ler. */
function mineiroChegada(x, chao, e, parado, t){
  cx.save(); cx.translate(x, chao); cx.scale(e, e);

  cx.save(); cx.scale(1,0.16); cx.fillStyle="rgba(0,0,0,.36)";
  cx.beginPath(); cx.arc(0,0,34,0,7); cx.fill(); cx.restore();

  const bal = parado ? 0 : Math.sin(t*9)*10;
  cx.strokeStyle="#2C3A4A"; cx.lineWidth=9; cx.lineCap="round";
  cx.beginPath(); cx.moveTo(0,-34); cx.lineTo(bal*0.5,-2); cx.stroke();
  cx.beginPath(); cx.moveTo(0,-34); cx.lineTo(-bal*0.5,-2); cx.stroke();

  const tr = cx.createLinearGradient(0,-66,0,-30);
  tr.addColorStop(0,"#C9762E"); tr.addColorStop(1,"#8E4E1C");
  cx.fillStyle=tr;
  cx.beginPath(); cx.moveTo(-12,-32); cx.lineTo(-13,-64); cx.lineTo(13,-64);
  cx.lineTo(12,-32); cx.closePath(); cx.fill();
  cx.fillStyle="rgba(240,232,190,.80)"; cx.fillRect(-13,-50,26,4);

  cx.strokeStyle="#B5691F"; cx.lineWidth=7;
  cx.beginPath(); cx.moveTo(-11,-60); cx.lineTo(-16-bal*0.35,-38); cx.stroke();
  cx.beginPath(); cx.moveTo(11,-60); cx.lineTo(17+bal*0.35,-38); cx.stroke();

  cx.fillStyle="#D9A87A"; cx.beginPath(); cx.arc(0,-73,9,0,7); cx.fill();
  cx.fillStyle="#E8B534";
  cx.beginPath(); cx.arc(0,-76,10.5,Math.PI,0); cx.fill();
  cx.fillRect(-13,-77,26,3.4);
  cx.fillStyle="#FFF3C4"; cx.beginPath(); cx.arc(8,-77,2.6,0,7); cx.fill();
  if(parado){
    const lg = cx.createRadialGradient(24,-40,2,24,-40,42);
    lg.addColorStop(0,"rgba(255,240,190,.28)"); lg.addColorStop(1,"rgba(255,240,190,0)");
    cx.fillStyle=lg; cx.beginPath(); cx.arc(24,-40,42,0,7); cx.fill();
  }

  /* a picareta no ombro: a mesma silhueta robusta do túnel */
  cx.save(); cx.translate(14,-58); cx.rotate(parado ? -0.55 : -0.95);
  cx.strokeStyle="#6A4A28"; cx.lineWidth=4.4; cx.lineCap="round";
  cx.beginPath(); cx.moveTo(0,0); cx.lineTo(34,0); cx.stroke();
  cx.fillStyle="#A9B3BC";
  cx.beginPath(); cx.moveTo(30,-3); cx.lineTo(46,-11); cx.lineTo(49,-6);
  cx.lineTo(38,0); cx.lineTo(49,6); cx.lineTo(46,11); cx.lineTo(30,3);
  cx.closePath(); cx.fill();
  cx.restore();

  cx.restore();
}
function desenhaAchados(dt){
  /* 1. o que está emergindo */
  const n = proximoAchado();
  if(n){
    const p = n.p;                                   /* 0 = longe, 1 = na hora */
    const alvo = (n.i===0) ? cfg.achado1 : ACHADOS[n.i].m;
    /* ancorado na PROFUNDIDADE dele: vem de baixo e sobe até a boca do poço */
    const y = ROCHA + (alvo - camY)*PPM*R - 30*R;
    cx.save();
    cx.translate(L/2, y);
    cx.scale(0.72 + p*0.28, 0.72 + p*0.28);
    /* enterrado: escuro e sem contorno; conforme chega, ganha luz */
    cx.globalAlpha = 0.10 + p*0.62;
    formaAchado(ACHADOS[n.i].d, p, false);
    cx.restore();
    cx.globalAlpha = 1;
  }

  /* 2. o que acabou de ser descoberto: acende e sobe */
  if(revelado){
    revelado.t -= dt*0.30;
    if(revelado.t <= 0){ revelado = null; }
    else {
      const k = revelado.t;                          /* 1 -> 0 */
      const sobe = (1-k)*120*R;
      cx.save();
      cx.translate(L/2, ROCHA - 124*R - sobe);
      const esc = 1 + (1-k)*0.22;
      cx.scale(esc, esc);
      /* halo: a única vez que o jogo brilha de verdade */
      const h = cx.createRadialGradient(0,0,0,0,0,110*R);
      h.addColorStop(0,'rgba(255,226,160,'+(k*0.42)+')');
      h.addColorStop(1,'rgba(255,226,160,0)');
      cx.fillStyle=h; cx.fillRect(-120*R,-120*R,240*R,240*R);
      cx.globalAlpha = Math.min(k*1.6, 1);
      formaAchado(ACHADOS[revelado.i].d, 1, true);
      cx.restore();
      cx.globalAlpha = 1;
    }
  }
}

/* aceso = descoberto (cor cheia); apagado = ainda na pedra (silhueta) */
function formaAchado(qual, p, aceso){
  const U = 34*R;                                    /* a unidade do desenho */
  const corpo  = aceso ? '#F2D9A0' : '#2A1E10';
  const escuro = aceso ? '#8A6A2E' : '#1A1208';
  const luz    = aceso ? 'rgba(255,246,214,.9)' : 'rgba(255,240,214,'+(0.10+p*0.30)+')';
  cx.lineJoin='round'; cx.lineCap='round';
  cx.strokeStyle = luz; cx.lineWidth = 2.2*R;

  if(qual==='moeda'){
    cx.beginPath(); cx.arc(0,0,U*0.62,0,6.29);
    cx.fillStyle=corpo; cx.fill(); cx.stroke();
    cx.beginPath(); cx.arc(0,0,U*0.42,0,6.29); cx.stroke();
    cx.beginPath(); cx.moveTo(-U*0.16,-U*0.16); cx.lineTo(U*0.16,U*0.16);
    cx.moveTo(U*0.16,-U*0.16); cx.lineTo(-U*0.16,U*0.16); cx.stroke();

  } else if(qual==='raiz'){
    cx.strokeStyle=corpo; cx.lineWidth=U*0.20;
    cx.beginPath(); cx.moveTo(-U*0.7,-U*0.9);
    cx.bezierCurveTo(U*0.1,-U*0.3, -U*0.4, U*0.3, U*0.5, U*0.95); cx.stroke();
    cx.lineWidth=U*0.10;
    cx.beginPath(); cx.moveTo(-U*0.12,-U*0.28); cx.lineTo(-U*0.85, U*0.05); cx.stroke();
    cx.beginPath(); cx.moveTo(-U*0.22, U*0.28); cx.lineTo( U*0.62, U*0.14); cx.stroke();
    cx.strokeStyle=luz; cx.lineWidth=1.6*R;
    cx.beginPath(); cx.moveTo(-U*0.6,-U*0.78);
    cx.bezierCurveTo(U*0.05,-U*0.26, -U*0.34, U*0.28, U*0.42, U*0.84); cx.stroke();

  } else if(qual==='capacete'){
    cx.beginPath(); cx.arc(0, U*0.16, U*0.66, Math.PI, 0);
    cx.lineTo(U*0.86, U*0.34); cx.lineTo(-U*0.86, U*0.34); cx.closePath();
    cx.fillStyle=corpo; cx.fill(); cx.stroke();
    /* a lâmpada da frente */
    cx.beginPath(); cx.arc(0,-U*0.30,U*0.17,0,6.29);
    cx.fillStyle=escuro; cx.fill(); cx.stroke();

  } else if(qual==='onda'){
    for(let i=0;i<4;i++){
      cx.globalAlpha *= 1;
      cx.beginPath();
      cx.ellipse(0, 0, U*(0.28+i*0.24), U*(0.10+i*0.085), 0, 0, 6.29);
      cx.stroke();
    }
    cx.beginPath(); cx.arc(U*0.30,-U*0.42,U*0.09,0,6.29); cx.stroke();
    cx.beginPath(); cx.arc(-U*0.42,-U*0.24,U*0.06,0,6.29); cx.stroke();

  } else if(qual==='porta'){
    cx.beginPath(); cx.rect(-U*0.52,-U*0.95, U*1.04, U*1.90);
    cx.fillStyle=corpo; cx.fill(); cx.stroke();
    cx.beginPath();
    cx.moveTo(-U*0.30,-U*0.72); cx.lineTo(-U*0.30, U*0.72); cx.stroke();
    /* as dobradiças do lado de lá: só o vinco aparece deste lado */
    cx.strokeStyle=escuro; cx.lineWidth=U*0.10;
    cx.beginPath(); cx.moveTo(U*0.40,-U*0.56); cx.lineTo(U*0.40,-U*0.30); cx.stroke();
    cx.beginPath(); cx.moveTo(U*0.40, U*0.30); cx.lineTo(U*0.40, U*0.56); cx.stroke();

  } else if(qual==='eco'){
    for(let i=0;i<5;i++){
      cx.beginPath();
      cx.arc(-U*0.55, 0, U*(0.3+i*0.30), -0.85, 0.85);
      cx.stroke();
    }

  } else if(qual==='marcas'){
    cx.strokeStyle=corpo; cx.lineWidth=U*0.13;
    for(let i=-1;i<=1;i++){
      cx.beginPath();
      cx.moveTo(-U*0.72 + i*U*0.06, U*0.85 + i*U*0.08);
      cx.lineTo( U*0.66 + i*U*0.06, -U*0.72 + i*U*0.08);
      cx.stroke();
    }
    cx.strokeStyle=luz; cx.lineWidth=1.8*R;
    for(let i=-1;i<=1;i++){
      cx.beginPath();
      cx.moveTo(-U*0.66 + i*U*0.06, U*0.80 + i*U*0.08);
      cx.lineTo( U*0.60 + i*U*0.06, -U*0.66 + i*U*0.08);
      cx.stroke();
    }

  } else if(qual==='cristal'){
    cx.beginPath();
    cx.moveTo(0,-U*1.05); cx.lineTo(U*0.52,-U*0.18);
    cx.lineTo(U*0.30, U*0.92); cx.lineTo(-U*0.30, U*0.92);
    cx.lineTo(-U*0.52,-U*0.18); cx.closePath();
    cx.fillStyle=corpo; cx.fill(); cx.stroke();
    cx.beginPath();
    cx.moveTo(0,-U*1.05); cx.lineTo(0, U*0.92);
    cx.moveTo(-U*0.52,-U*0.18); cx.lineTo(U*0.52,-U*0.18); cx.stroke();
  }
}

/* rola o ladrilho. 'vel' é quanto ele anda por metro — a de trás anda menos,
   e é essa diferença que o olho lê como distância. */
function ladrilha(vel, alfa, folga){
  const T = LADT*(1 + folga/100);
  /* NEGATIVO: descer significa a pedra passando por você PRA CIMA */
  const desl = (((-camY*vel*10) % T) + T) % T;
  cx.globalAlpha = alfa;
  for(let y=-T+desl; y<A+T; y+=T)
    for(let x=0; x<L+T; x+=T)
      cx.drawImage(LAD, x, y, T, T);
  cx.globalAlpha = 1;
}

/* A fronteira entre camadas passando pela tela. Antes a cor trocava sem que
   nada CRUZASSE o quadro — a transição existia no gradiente e não no mundo. */
function costura(){
  for(const k of CAMADAS){
    if(k.m <= 0) continue;
    const y = ROCHA + (k.m - camY)*PPM*R;  /* a fronteira sobe até você */
    if(y < -40*R || y > A+40*R) continue;
    cx.globalCompositeOperation='source-over';
    cx.strokeStyle='rgba(0,0,0,.5)'; cx.lineWidth=7*R;
    cx.beginPath();
    for(let x=0;x<=L;x+=20*R){
      const oy = Math.sin(x*0.011/R)*7*R + Math.sin(x*0.031/R)*3*R;
      x===0 ? cx.moveTo(x,y+oy) : cx.lineTo(x,y+oy);
    }
    cx.stroke();
    cx.strokeStyle='rgba(255,238,205,.16)'; cx.lineWidth=2*R;
    cx.beginPath();
    for(let x=0;x<=L;x+=20*R){
      const oy = Math.sin(x*0.011/R)*7*R + Math.sin(x*0.031/R)*3*R;
      x===0 ? cx.moveTo(x,y+oy-4*R) : cx.lineTo(x,y+oy-4*R);
    }
    cx.stroke();
    cx.globalCompositeOperation='overlay';
  }
}

/* ---- o volume do túnel ----
   Chão, teto e primeiro plano. É o conjunto que transforma uma parede pintada
   num espaço em que alguém está de pé. */

/* o chão: elipse achatada = plano visto de quase rente. Clara perto da lâmpada,
   escura ao fundo — a luz é o que faz o plano existir. */
function chao(){
  const U = A*0.046;
  const cy = ROCHA + U*0.9;
  const larguraChao = Math.min(L*0.78, U*7.0);

  cx.save();
  cx.beginPath();
  cx.ellipse(L/2, cy, larguraChao/2, U*1.5, 0, 0, 6.29);
  cx.clip();
  const g = cx.createLinearGradient(0, cy-U*1.5, 0, cy+U*1.5);
  g.addColorStop(0, 'rgba(0,0,0,.55)');        /* fundo do chão: longe = escuro */
  g.addColorStop(0.45, 'rgba(92,64,34,.34)');
  g.addColorStop(1, 'rgba(150,108,58,.30)');   /* perto = batido pela lâmpada */
  cx.fillStyle = g;
  cx.fillRect(L/2-larguraChao/2, cy-U*1.6, larguraChao, U*3.2);
  /* entulho no chão: pedra solta de quem acabou de cavar */
  for(let i=0;i<26;i++){
    const a = (i*2.399);
    const rx = L/2 + Math.cos(a)*larguraChao*0.42*((i%7)/7+0.3);
    const ry = cy + Math.sin(a)*U*1.1*((i%5)/5+0.3);
    const s = U*(0.06 + (i%4)*0.035);
    cx.fillStyle = (i%2) ? 'rgba(24,16,8,.55)' : 'rgba(190,152,104,.22)';
    cx.beginPath(); cx.ellipse(rx, ry, s, s*0.62, a, 0, 6.29); cx.fill();
  }
  cx.restore();
  /* a linha onde o chão encontra a parede: é ela que fecha o volume */
  cx.strokeStyle='rgba(0,0,0,.5)'; cx.lineWidth=2.2*R;
  cx.beginPath();
  cx.ellipse(L/2, cy, larguraChao/2, U*1.5, 0, Math.PI*1.06, Math.PI*1.94);
  cx.stroke();
}

/* o teto: o poço continua pra cima — é por onde ele desceu. */
function teto(){
  const U = A*0.046;
  const abertura = Math.min(L*0.72, U*4.7);
  const topo = ROCHA - U*7.6;
  cx.save();
  cx.beginPath();
  cx.moveTo(-10*R, -10*R);
  cx.lineTo(L+10*R, -10*R);
  cx.lineTo(L+10*R, topo);
  /* a boca do poço lá em cima, estreitando */
  cx.quadraticCurveTo(L/2 + abertura*0.30, topo - U*1.2, L/2 + abertura*0.16, topo - U*2.4);
  cx.lineTo(L/2 - abertura*0.16, topo - U*2.4);
  cx.quadraticCurveTo(L/2 - abertura*0.30, topo - U*1.2, -10*R, topo);
  cx.closePath();
  const g = cx.createLinearGradient(0, topo - U*2.4, 0, topo + U*0.6);
  g.addColorStop(0, 'rgba(0,0,0,.20)');
  g.addColorStop(1, 'rgba(0,0,0,.72)');
  cx.fillStyle = g; cx.fill();
  cx.restore();
}

/* o que está NA FRENTE dele. É o sinal de profundidade mais forte que existe,
   e era o que faltava pra ele deixar de parecer colado sobre a pedra. */
function primeiroPlano(){
  const U = A*0.046;
  const base = ROCHA + U*2.6;
  cx.save();
  cx.beginPath();
  cx.moveTo(-10*R, A+10*R);
  cx.lineTo(-10*R, base + U*0.9);
  for(let x=0; x<=L; x+=L/9){
    const k = x/L;
    cx.lineTo(x, base + Math.sin(k*7.1)*U*0.55 + Math.sin(k*17.3)*U*0.22);
  }
  cx.lineTo(L+10*R, base + U*0.9);
  cx.lineTo(L+10*R, A+10*R);
  cx.closePath();
  const g = cx.createLinearGradient(0, base - U*0.6, 0, A);
  g.addColorStop(0, 'rgba(8,5,2,.55)');
  g.addColorStop(0.35, 'rgba(8,5,2,.92)');
  g.addColorStop(1, 'rgba(4,3,1,1)');
  cx.fillStyle = g; cx.fill();
  /* uma aresta de luz na crista: a lâmpada bate na borda mais próxima */
  cx.strokeStyle='rgba(255,222,160,.14)'; cx.lineWidth=2.4*R;
  cx.beginPath();
  for(let x=0; x<=L; x+=L/9){
    const k = x/L;
    const y = base + Math.sin(k*7.1)*U*0.55 + Math.sin(k*17.3)*U*0.22;
    x===0 ? cx.moveTo(x,y) : cx.lineTo(x,y);
  }
  cx.stroke();
  cx.restore();
}

/* as paredes: escurecem as bordas com um contorno irregular que também rola */
function paredes(){
  /* o túnel tem o tamanho de quem o cavou: a abertura é ~2,9 vezes a largura
     do mineiro, não uma fração da tela. Antes sobravam 62% de vão — largo
     demais pra um homem com uma picareta. */
  const U = A*0.075;
  const abertura = Math.min(L*0.72, U*2.9);
  const larg = (L - abertura)/2;
  const desl = (((-camY*10) % (90*R)) + 90*R) % (90*R);
  for(const lado of [0,1]){
    cx.save();
    if(lado){ cx.translate(L,0); cx.scale(-1,1); }
    const g = cx.createLinearGradient(0,0,larg,0);
    g.addColorStop(0,'rgba(0,0,0,.80)'); g.addColorStop(.55,'rgba(0,0,0,.52)'); g.addColorStop(1,'rgba(0,0,0,0)');
    cx.fillStyle=g;
    cx.beginPath(); cx.moveTo(0,-10*R);
    for(let y=-10*R; y<=A+10*R; y+=30*R){
      const k = (y+desl)/(70*R);
      cx.lineTo(larg*(0.84 + Math.sin(k)*0.10 + Math.sin(k*2.7)*0.06), y);
    }
    cx.lineTo(0,A+10*R); cx.closePath(); cx.fill();
    cx.restore();
  }
}

/* a régua: marca a cada 5 m, número a cada 25 m. Reforça a descida e informa. */
function regua(){
  const ppm = PPM*R;                       /* a MESMA escala do mundo */
  const x = L - 16*R;
  const base = Math.floor(camY/5)*5;
  cx.textAlign='right';
  cx.font='600 '+(11*R)+'px "Barlow Condensed", Barlow, sans-serif';
  for(let k=-6;k<=14;k++){
    const m = base + k*5;
    if(m < 0) continue;
    const y = ROCHA + (m - camY)*ppm;      /* mais fundo = mais embaixo */
    /* a régua não invade a faixa do cabeçalho nem a da loja: ela é fundo */
    if(y < 150*R || y > A-190*R) continue;
    const grande = (m % 25 === 0);
    cx.strokeStyle='rgba(255,240,214,'+(grande?.30:.14)+')';
    cx.lineWidth=1*R;
    cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x - (grande?16*R:8*R), y); cx.stroke();
    if(grande){
      cx.fillStyle='rgba(255,240,214,.34)';
      cx.fillText(m+' m', x - 20*R, y + 4*R);
    }
  }
  cx.textAlign='center';
}

/* A picareta: o pivô fica onde estariam as MÃOS (fora do quadro, baixo-direita),
   o cabo sai dali e a CABEÇA fica na ponta. O comprimento do cabo não é
   escolhido no olho — é a distância exata das mãos até o ponto da rocha, então
   no quadro do impacto a cabeça aterrissa onde o estilhaço nasce.
   Descida rápida (30% do tempo), volta lenta: é o que dá peso. */
/* ---- ferramentas de corpo ---- */

/* cinemática inversa de dois ossos: dado o ombro e a mão, acha o cotovelo.
   É o que faz o braço DOBRAR em vez de girar inteiro como um ponteiro. */
function ik(ax, ay, tx, ty, l1, l2, lado){
  const dx = tx-ax, dy = ty-ay;
  let d = Math.hypot(dx, dy);
  d = Math.max(0.0001, Math.min(d, (l1+l2)*0.999));   /* não esticar além do osso */
  const base = Math.atan2(dy, dx);
  let cosA = (l1*l1 + d*d - l2*l2) / (2*l1*d);
  cosA = Math.max(-1, Math.min(1, cosA));
  const a1 = base + Math.acos(cosA)*lado;
  return { x: ax + Math.cos(a1)*l1, y: ay + Math.sin(a1)*l1 };
}

/* um membro é um polígono que AFINA da raiz pra ponta, com face clara e face
   escura. Espessura constante é o que faz um desenho parecer palito. */
function membro(x1,y1, x2,y2, r1,r2, claro, escuro){
  const a = Math.atan2(y2-y1, x2-x1), s = Math.sin(a), c = Math.cos(a);
  cx.beginPath();
  cx.moveTo(x1 - s*r1, y1 + c*r1);
  cx.lineTo(x2 - s*r2, y2 + c*r2);
  cx.arc(x2, y2, r2, a - Math.PI/2, a + Math.PI/2);
  cx.lineTo(x1 + s*r1, y1 - c*r1);
  cx.arc(x1, y1, r1, a + Math.PI/2, a + Math.PI*1.5);
  cx.closePath();
  const g = cx.createLinearGradient(x1 - s*r1, y1 + c*r1, x1 + s*r1, y1 - c*r1);
  g.addColorStop(0, claro); g.addColorStop(0.62, escuro);
  cx.fillStyle = g; cx.fill();
}

/* Onde o mineiro está e onde a picareta bate — UMA fonte para os dois, senão
   o estilhaço nasce num lugar e a ferramenta chega noutro. */
function poseBase(){
  const UT = A*0.046;              /* unidade do TÚNEL (chão, teto, posição) */
  const U  = UT*0.5;               /* unidade do CORPO */
  const pe = { x: L/2 - UT*1.5, y: ROCHA + UT*0.9 };
  const CABO = U*3.1;              /* o cabo é do tamanho do DONO, não do túnel */
  return { UT:UT, U:U, pe:pe, CABO:CABO };
}
/* o ponto de impacto é DERIVADO do cabo: ferramenta e estilhaço não podem
   discordar sobre onde a pedra foi atingida. */
function pontoImpacto(){
  const b = poseBase();
  return { x: b.pe.x + b.U*0.30 + b.CABO*0.92, y: b.pe.y - b.U*1.35 };
}

/* Um ajudante: corpo simples, sem esqueleto nem rosto. Nove corpos completos a
   60 fps não cabem — e a distância pede simplificação de qualquer jeito. */
function ajudante(x, y, esc, fase, cor, luz){
  const U = A*0.023*esc;
  const t = (performance.now()/1000 + fase) % 1.15 / 1.15;
  const sw = (t < .3) ? (t/.3)*(t/.3) : 1 - (t-.3)/.7;

  cx.save(); cx.translate(x, y);
  cx.fillStyle='rgba(0,0,0,.30)';
  cx.beginPath(); cx.ellipse(0, 0, U*1.7, U*0.26, 0, 0, 6.29); cx.fill();

  /* pernas em V, sem articulação: à distância ninguém lê joelho */
  cx.strokeStyle='rgba(0,0,0,.55)'; cx.lineWidth=U*0.42; cx.lineCap='round';
  cx.beginPath(); cx.moveTo(-U*0.1,-U*1.5); cx.lineTo(-U*0.8,-U*0.05); cx.stroke();
  cx.beginPath(); cx.moveTo( U*0.1,-U*1.5); cx.lineTo( U*0.8,-U*0.05); cx.stroke();

  /* tronco, inclinado no ritmo do golpe */
  cx.save(); cx.translate(0,-U*1.5); cx.rotate(-0.22 + sw*0.44);
  cx.fillStyle=cor;
  cx.beginPath();
  cx.moveTo(-U*0.62,U*0.1); cx.lineTo(-U*0.78,-U*1.5);
  cx.quadraticCurveTo(0,-U*1.8, U*0.78,-U*1.5);
  cx.lineTo(U*0.58,U*0.1); cx.closePath(); cx.fill();
  /* cabeça e capacete */
  cx.fillStyle='#C08A58';
  cx.beginPath(); cx.arc(U*0.1,-U*2.0,U*0.52,0,6.29); cx.fill();
  cx.fillStyle='#D9982F';
  cx.beginPath(); cx.arc(U*0.1,-U*2.1,U*0.58,Math.PI,0); cx.fill();
  cx.fillRect(U*0.1,-U*2.2,U*0.9,U*0.16);
  /* a ferramenta, um traço só */
  cx.strokeStyle='#7E5426'; cx.lineWidth=U*0.22;
  const a = -1.5 + sw*1.9;
  cx.beginPath(); cx.moveTo(U*0.3,-U*1.2);
  cx.lineTo(U*0.3+Math.cos(a)*U*2.6, -U*1.2+Math.sin(a)*U*2.6); cx.stroke();
  cx.strokeStyle='#B9C0C7'; cx.lineWidth=U*0.34;
  cx.beginPath();
  cx.moveTo(U*0.3+Math.cos(a)*U*2.3, -U*1.2+Math.sin(a)*U*2.3);
  cx.lineTo(U*0.3+Math.cos(a)*U*3.0, -U*1.2+Math.sin(a)*U*3.0); cx.stroke();
  cx.restore();

  /* a luz de cada lâmpada: é o que faz a equipe aparecer no escuro */
  if(luz){
    cx.save(); cx.globalCompositeOperation='lighter';
    const g = cx.createRadialGradient(U*0.6,-U*3.5,0,U*0.6,-U*3.5,U*7*luz);
    g.addColorStop(0,'rgba(255,228,166,.16)'); g.addColorStop(1,'rgba(255,228,166,0)');
    cx.fillStyle=g; cx.fillRect(-U*8,-U*10,U*16,U*14);
    cx.restore();
  }
  cx.restore();
}

/* a equipe espalhada pelo túnel: quem está mais longe é MENOR e mais apagado.
   É perspectiva de pobre, e funciona porque é como o olho já lê distância. */
function desenhaEquipe(){
  const b = poseBase();
  const total = povo() - 1;
  if(total <= 0) return;
  const n = Math.min(total, 8);         /* teto: além disso vira sopa, não equipe */
  const lz = fatorLuz();
  for(let i=0;i<n;i++){
    /* alterna esquerda e direita, afastando */
    const lado = (i%2) ? 1 : -1;
    const dist = 1 + Math.floor(i/2);
    const esc = Math.max(0.42, 1 - dist*0.17);
    /* DENTRO do túnel: antes eles caíam nas bordas escuras, fora do buraco.
       Quem está mais atrás fica mais ALTO e menor — a perspectiva do poço. */
    const meia = Math.min(L*0.72, b.UT*4.7) * 0.40;
    const x = L/2 + lado * meia * (0.30 + dist*0.22);
    const y = b.pe.y - dist*b.UT*0.30;
    cx.globalAlpha = 0.30 + esc*0.55;
    ajudante(x, y, esc, i*0.37, EQUIPE[i % EQUIPE.length].cor, (i%3===0) ? lz*0.7 : 0);
  }
  cx.globalAlpha = 1;
}

/* ---- o mineiro ---- */
function desenhaMineiro(dt){
  if(picoT < 1) picoT = Math.min(picoT + dt*3.4, 1);
  const t = picoT;
  const rp = roupaAtual(), ac = acessAtual();

  /* U = altura da cabeça. Sete delas dão a figura inteira — a proporção
     humana de referência, e o que corrige o boneco anterior (2,5 cabeças). */
  /* DUAS unidades: o corpo encolheu à metade, o túnel ficou do tamanho que
     estava. É essa diferença que dá a folga — antes ele ocupava o buraco todo. */
  const _b = poseBase();
  const UT = _b.UT, U = _b.U, pe = _b.pe;
  const alvo = pontoImpacto();

  /* esforço: pico no quadro do impacto, é o que move a expressão */
  const esf = (t < .30) ? (t/.30)*(t/.30) : Math.max(0, 1 - (t-.30)/.34);
  const resp = Math.sin(performance.now()/900) * U*0.035 * (1-esf);   /* respiração */

  let lean;
  if(t < .3){ const k=t/.3; lean = -0.26 + 0.46*(k*k); }
  else { const k=(t-.3)/.7; const e=1-Math.pow(1-k,2.4); lean = 0.20 - 0.46*e; }

  /* paleta: a luz vem da lâmpada, à frente e acima */
  const peleC='#D8A171', peleE='#9A6538';
  const roupaC=rp.cor, roupaE=rp.corE;
  const botaC='#3A2E22', botaE='#1E1712';

  cx.save();
  cx.translate(pe.x, pe.y);
  cx.lineJoin='round'; cx.lineCap='round';

  cx.fillStyle='rgba(0,0,0,.38)';
  cx.beginPath(); cx.ellipse(U*0.9, 0, U*2.1, U*0.30, 0, 0, 6.29); cx.fill();

  /* --- quadril e pernas ---
     Pés fixos no chão; o quadril sobe e desce com o golpe. O joelho é
     resolvido, então a perna agacha sozinha. */
  const quadY = -U*3.5 + esf*U*0.30 + resp;
  const quad  = { x: 0, y: quadY };
  const peTras = { x: -U*1.15, y: 0 };
  const peFrente = { x: U*1.65, y: -U*0.05 };
  const COXA = U*1.75, CANELA = U*1.7;

  /* perna de trás primeiro: fica atrás do corpo */
  let jo = ik(quad.x-U*0.22, quad.y, peTras.x, peTras.y, COXA, CANELA, 1);
  membro(quad.x-U*0.22, quad.y, jo.x, jo.y, U*0.40, U*0.30, roupaE, '#000');
  membro(jo.x, jo.y, peTras.x, peTras.y, U*0.30, U*0.20, roupaE, '#000');
  membro(peTras.x+U*0.10, peTras.y-U*0.10, peTras.x-U*0.55, peTras.y-U*0.02, U*0.26, U*0.16, botaE, '#000');

  jo = ik(quad.x+U*0.22, quad.y, peFrente.x, peFrente.y, COXA, CANELA, 1);
  membro(quad.x+U*0.22, quad.y, jo.x, jo.y, U*0.44, U*0.32, roupaC, roupaE);
  membro(jo.x, jo.y, peFrente.x, peFrente.y, U*0.32, U*0.21, roupaC, roupaE);
  membro(peFrente.x-U*0.10, peFrente.y-U*0.10, peFrente.x+U*0.62, peFrente.y-U*0.03, U*0.27, U*0.17, botaC, botaE);

  /* --- tronco: inclina a partir do quadril --- */
  cx.save();
  cx.translate(quad.x, quad.y); cx.rotate(lean);

  const TORSO = U*2.05;
  const peito = { x: 0, y: -TORSO };
  /* o tronco é um trapézio: ombro largo, quadril estreito */
  cx.beginPath();
  cx.moveTo(-U*0.62, U*0.10); cx.lineTo(-U*0.92, -TORSO+U*0.10);
  cx.quadraticCurveTo(0, -TORSO-U*0.30, U*0.92, -TORSO+U*0.10);
  cx.lineTo( U*0.58, U*0.10);
  cx.quadraticCurveTo(0, U*0.34, -U*0.62, U*0.10);
  cx.closePath();
  const gt = cx.createLinearGradient(-U*0.9, 0, U*0.9, 0);
  gt.addColorStop(0, roupaE); gt.addColorStop(0.55, roupaC); gt.addColorStop(1, '#FFE7B4');
  cx.fillStyle = gt; cx.fill();
  /* vincos do tecido: onde o pano dobra no esforço */
  cx.strokeStyle='rgba(0,0,0,.22)'; cx.lineWidth=U*0.055;
  cx.beginPath(); cx.moveTo(-U*0.42,-U*0.30);
  cx.quadraticCurveTo(0,-U*0.55+esf*U*0.2, U*0.40,-U*0.22); cx.stroke();
  /* alça do macacão */
  cx.strokeStyle=roupaE; cx.lineWidth=U*0.16;
  cx.beginPath(); cx.moveTo(-U*0.28,-TORSO+U*0.22); cx.lineTo(-U*0.14,-U*0.30); cx.stroke();
  if(rp.faixa){
    cx.strokeStyle='rgba(255,242,196,.78)'; cx.lineWidth=U*0.13;
    cx.beginPath(); cx.moveTo(-U*0.80,-U*0.85); cx.lineTo(U*0.78,-U*0.95); cx.stroke();
  }

  /* --- a picareta: gira no peito; as mãos agarram o cabo --- */
  const pivo = { x: U*0.30, y: -TORSO+U*0.36 };
  const ax = (alvo.x - pe.x - quad.x)*Math.cos(-lean) - (alvo.y - pe.y - quad.y)*Math.sin(-lean);
  const ay = (alvo.x - pe.x - quad.x)*Math.sin(-lean) + (alvo.y - pe.y - quad.y)*Math.cos(-lean);
  /* o cabo tem tamanho PRÓPRIO; o ângulo é que aponta pra pedra */
  const cabo = _b.CABO;
  const aBate = Math.atan2(ay-pivo.y, ax-pivo.x);
  const aAlto = aBate - 1.75;
  let ang;
  if(t < .3){ const k=t/.3; ang = aAlto + (aBate-aAlto)*(k*k); }
  else { const k=(t-.3)/.7; const e=1-Math.pow(1-k,2.4); ang = aBate + (aAlto-aBate)*e; }
  const dirx = Math.cos(ang), diry = Math.sin(ang);
  const mao1 = { x: pivo.x + dirx*cabo*0.30, y: pivo.y + diry*cabo*0.30 };
  const mao2 = { x: pivo.x + dirx*cabo*0.50, y: pivo.y + diry*cabo*0.50 };

  const ombro = { x: U*0.10, y: -TORSO+U*0.28 };
  const BRACO = U*1.35, ANTE = U*1.25;

  /* braço de trás, atrás da ferramenta */
  let co = ik(ombro.x-U*0.30, ombro.y+U*0.10, mao2.x, mao2.y, BRACO, ANTE, 1);
  membro(ombro.x-U*0.30, ombro.y+U*0.10, co.x, co.y, U*0.32, U*0.25, roupaE, '#000');
  membro(co.x, co.y, mao2.x, mao2.y, U*0.25, U*0.19, peleE, '#4A2E14');

  /* a ferramenta */
  cx.save(); cx.translate(pivo.x, pivo.y); cx.rotate(ang);

  /* CABO: afina da mão pra cabeça, com um bojo no cabeçote e cepo no fim */
  const E = U*0.098;
  cx.beginPath();
  cx.moveTo(-U*0.16,-E*1.30);
  cx.quadraticCurveTo(cabo*0.55,-E*0.95, cabo, -E*0.86);
  cx.lineTo(cabo, E*0.86);
  cx.quadraticCurveTo(cabo*0.55, E*0.95, -U*0.16, E*1.30);
  cx.closePath();
  const gc = cx.createLinearGradient(0,-E*1.35,0,E*1.35);
  gc.addColorStop(0,'#D2A05A'); gc.addColorStop(.34,'#96662F');
  gc.addColorStop(.72,'#6A4520'); gc.addColorStop(1,'#33200D');
  cx.fillStyle=gc; cx.fill();
  /* veio da madeira, contido no cabo */
  cx.save(); cx.clip();
  cx.strokeStyle='rgba(50,30,12,.34)'; cx.lineWidth=Math.max(1, U*0.028);
  for(let i=-1;i<=1;i++){
    cx.beginPath(); cx.moveTo(0, i*E*0.5);
    cx.quadraticCurveTo(cabo*0.5, i*E*0.5+E*0.2, cabo, i*E*0.42); cx.stroke();
  }
  cx.restore();
  /* cepo do cabo */
  cx.beginPath(); cx.ellipse(-U*0.16, 0, E*0.40, E*1.34, 0, 0, 6.29);
  cx.fillStyle='#4A2F13'; cx.fill();

  /* CABEÇA: silhueta curva. O bico afina até a ponta; o enxó alarga até o fio. */
  cx.translate(cabo, 0);
  const H = U*0.72;
  const met = cx.createLinearGradient(-H*0.5,-H*1.6, H*0.4, H*1.4);
  met.addColorStop(0,'#FAFDFF'); met.addColorStop(.26,'#C7D0D8');
  met.addColorStop(.60,'#8B959E'); met.addColorStop(1,'#3E464E');
  const traco='rgba(14,20,26,.55)';

  /* bico */
  cx.beginPath();
  cx.moveTo( H*0.06,-H*0.46);
  cx.quadraticCurveTo(-H*0.16,-H*1.16, -H*0.60,-H*1.76);
  cx.lineTo(-H*0.34,-H*1.92);
  cx.quadraticCurveTo( H*0.20,-H*1.14, H*0.46,-H*0.52);
  cx.closePath();
  cx.fillStyle=met; cx.fill(); cx.strokeStyle=traco; cx.lineWidth=1.2*R; cx.stroke();

  /* enxó */
  cx.beginPath();
  cx.moveTo( H*0.06, H*0.46);
  cx.quadraticCurveTo(-H*0.12, H*0.92, -H*0.30, H*1.20);
  cx.lineTo( H*0.18, H*1.38);
  cx.quadraticCurveTo( H*0.34, H*0.94, H*0.46, H*0.52);
  cx.closePath();
  cx.fillStyle=met; cx.fill(); cx.stroke();

  /* olhal: onde o cabo atravessa, com chanfro */
  cx.beginPath();
  cx.moveTo(-H*0.20,-H*0.62); cx.lineTo( H*0.50,-H*0.50);
  cx.lineTo( H*0.50, H*0.50); cx.lineTo(-H*0.20, H*0.62);
  cx.closePath();
  const anel = cx.createLinearGradient(0,-H*0.62,0,H*0.62);
  anel.addColorStop(0,'#E8EEF4'); anel.addColorStop(.42,'#9AA3AB'); anel.addColorStop(1,'#3B434A');
  cx.fillStyle=anel; cx.fill(); cx.strokeStyle=traco; cx.lineWidth=1.1*R; cx.stroke();

  /* o fio: a lâmpada bate na aresta de ataque das duas pontas */
  cx.lineCap='round';
  cx.strokeStyle='rgba(255,252,240,.85)'; cx.lineWidth=Math.max(1.4, U*0.05);
  cx.beginPath(); cx.moveTo(-H*0.60,-H*1.76); cx.lineTo(-H*0.34,-H*1.92); cx.stroke();
  cx.beginPath(); cx.moveTo(-H*0.30, H*1.20); cx.lineTo( H*0.18, H*1.38); cx.stroke();
  /* e um lampejo correndo pelo dorso do bico */
  cx.strokeStyle='rgba(255,255,255,.34)'; cx.lineWidth=Math.max(1, U*0.032);
  cx.beginPath(); cx.moveTo(H*0.28,-H*0.60);
  cx.quadraticCurveTo(-H*0.02,-H*1.12, -H*0.38,-H*1.70); cx.stroke();

  cx.restore();

  /* braço da frente, por cima da ferramenta */
  co = ik(ombro.x, ombro.y, mao1.x, mao1.y, BRACO, ANTE, 1);
  membro(ombro.x, ombro.y, co.x, co.y, U*0.36, U*0.27, roupaC, roupaE);
  membro(co.x, co.y, mao1.x, mao1.y, U*0.27, U*0.20, peleC, peleE);
  /* as duas mãos fechadas no cabo */
  [mao1, mao2].forEach(function(m, i){
    cx.beginPath(); cx.arc(m.x, m.y, U*0.24, 0, 6.29);
    const gm = cx.createRadialGradient(m.x-U*0.08, m.y-U*0.08, U*0.03, m.x, m.y, U*0.26);
    gm.addColorStop(0, i ? peleE : peleC); gm.addColorStop(1, peleE);
    cx.fillStyle=gm; cx.fill();
  });

  /* --- pescoço, cabeça e rosto --- */
  const cab = { x: U*0.16, y: -TORSO-U*0.62 };
  membro(peito.x, peito.y-U*0.05, cab.x, cab.y+U*0.30, U*0.26, U*0.24, peleC, peleE);

  cx.save(); cx.translate(cab.x, cab.y);
  /* crânio + mandíbula: perfil olhando pra direita */
  cx.beginPath();
  cx.moveTo(-U*0.42,-U*0.10);
  cx.bezierCurveTo(-U*0.44,-U*0.62, U*0.30,-U*0.66, U*0.40,-U*0.16);   /* testa */
  cx.bezierCurveTo( U*0.50,-U*0.02, U*0.46, U*0.04, U*0.40, U*0.06);   /* nariz */
  cx.lineTo(U*0.30, U*0.12);
  cx.bezierCurveTo( U*0.34, U*0.34, U*0.06, U*0.50, -U*0.20, U*0.36);  /* queixo */
  cx.bezierCurveTo(-U*0.40, U*0.26, -U*0.44, U*0.10, -U*0.42,-U*0.10);
  cx.closePath();
  const gr = cx.createLinearGradient(-U*0.4,0,U*0.45,0);
  gr.addColorStop(0, peleE); gr.addColorStop(0.55, peleC); gr.addColorStop(1, '#FFE0B0');
  cx.fillStyle=gr; cx.fill();
  /* barba por fazer */
  cx.save(); cx.clip();
  cx.fillStyle='rgba(50,32,18,.30)';
  cx.beginPath(); cx.ellipse(U*0.06, U*0.26, U*0.34, U*0.22, 0, 0, 6.29); cx.fill();
  cx.restore();
  /* orelha */
  cx.beginPath(); cx.ellipse(-U*0.20, U*0.02, U*0.08, U*0.11, 0, 0, 6.29);
  cx.fillStyle=peleE; cx.fill();
  /* sobrancelha: desce com o esforço */
  cx.strokeStyle='#4A3018'; cx.lineWidth=U*0.075; cx.lineCap='round';
  cx.beginPath();
  cx.moveTo(U*0.10,-U*0.26+esf*U*0.07);
  cx.lineTo(U*0.33,-U*0.20+esf*U*0.10); cx.stroke();
  /* olho: aperta no golpe */
  const abre = (1-esf)*U*0.075 + U*0.012;
  cx.beginPath(); cx.ellipse(U*0.24,-U*0.10, U*0.075, abre, 0, 0, 6.29);
  cx.fillStyle='#FFFFFF'; cx.fill();
  cx.beginPath(); cx.arc(U*0.26,-U*0.10, Math.min(abre,U*0.045), 0, 6.29);
  cx.fillStyle='#2A1C10'; cx.fill();
  /* boca: abre no esforço */
  cx.beginPath();
  cx.ellipse(U*0.20, U*0.18, U*0.10, U*0.02 + esf*U*0.075, 0, 0, 6.29);
  cx.fillStyle='#5A2A22'; cx.fill();

  /* capacete: calota + aba pra frente + lâmpada */
  cx.beginPath();
  cx.moveTo(-U*0.50,-U*0.16);
  cx.bezierCurveTo(-U*0.54,-U*0.86, U*0.42,-U*0.90, U*0.48,-U*0.18);
  cx.closePath();
  const gcap = cx.createLinearGradient(-U*0.5,-U*0.9,U*0.5,-U*0.1);
  gcap.addColorStop(0, 'rgba(0,0,0,.45)'); gcap.addColorStop(0.45, ac.capa); gcap.addColorStop(1,'#FFF0C0');
  cx.fillStyle=gcap; cx.fill();
  cx.fillStyle=ac.capa;
  cx.beginPath();
  cx.moveTo(U*0.30,-U*0.24); cx.lineTo(U*0.86,-U*0.30);
  cx.lineTo(U*0.86,-U*0.16); cx.lineTo(U*0.30,-U*0.12); cx.closePath(); cx.fill();
  cx.fillStyle='rgba(0,0,0,.28)'; cx.fillRect(-U*0.52,-U*0.22, U*1.0, U*0.07);
  cx.beginPath(); cx.arc(U*0.44,-U*0.42, U*0.15, 0, 6.29);
  cx.fillStyle='#3A3020'; cx.fill();
  cx.beginPath(); cx.arc(U*0.44,-U*0.42, U*0.10, 0, 6.29);
  cx.fillStyle='#FFF6D2'; cx.fill();

  /* O FEIXE: o acessório manda no alcance — a melhoria muda a CENA */
  cx.save();
  cx.globalCompositeOperation='lighter';
  const fx = U*0.56, fy = -U*0.42;
  const alc = U*7.5*ac.luz;
  const fg = cx.createRadialGradient(fx,fy,0,fx,fy,alc);
  fg.addColorStop(0,'rgba(255,232,170,'+(0.20+0.09*ac.luz)+')');
  fg.addColorStop(1,'rgba(255,232,170,0)');
  cx.fillStyle=fg;
  cx.beginPath(); cx.moveTo(fx,fy);
  cx.lineTo(fx+alc*0.95, fy-alc*0.30); cx.lineTo(fx+alc*0.95, fy+alc*0.55);
  cx.closePath(); cx.fill();
  cx.restore();

  cx.restore();   /* cabeça */
  cx.restore();   /* tronco */
  cx.restore();   /* mineiro */
}

function pisca(){
  golpe(1.7);
  for(let i=0;i<20;i++){
    const a=-Math.PI/2+(Math.random()-.5)*3;
    cacos.push({x:L/2+(Math.random()-.5)*L*.4, y:ROCHA,
      vx:Math.cos(a)*(3+Math.random()*5)*R, vy:Math.sin(a)*(3+Math.random()*5)*R,
      g:.28*R, t:1.3, s:(2+Math.random()*3)*R, rot:0, vr:(Math.random()-.5)*.4});
  }
}

/* ---------------- laço ---------------- */
/* o capataz: compra a coisa mais barata que der, de tempos em tempos.
   Ele compra ATENÇÃO, não poder — nada que você não pudesse comprar. */
let acumCapataz = 0;
function capatazTrabalha(dt){
  if(!nEq('capataz')) return;
  acumCapataz += dt;
  if(acumCapataz < 4) return;
  acumCapataz = 0;
  if(S.frag >= 1) troca();
  let alvo = null;
  EQUIP.forEach(function(m){
    if(m.max && qtd(m.id) >= m.max) return;
    const c = custo(m);
    if(S.moedas >= c && (!alvo || c < alvo.c)) alvo = {m:m, c:c};
  });
  if(alvo){ S.moedas -= alvo.c; S.comprado[alvo.m.id] = qtd(alvo.m.id)+1; }
}

/* Durante a chegada, qualquer toque avança: o primeiro pula pro convite, o
   segundo entra na mina. Quem já viu a cena não é obrigado a assistir. */
function tocaChegada(){
  if(S.chegou) return false;
  /* ⚠️ o teste do cena.fim sozinho dependia de um QUADRO ter desenhado:
     dois toques rápidos e o segundo era engolido. O tempo não depende de quadro. */
  if(cena.fim || cena.t >= CENA_DUR - 0.9){ S.chegou = true; document.body.classList.remove("chegando");
    elCavar.textContent = 'CAVAR'; salva(); }
  else cena.t = CENA_DUR - 0.9;
  return true;
}

let acumMaq = 0;
function laco(agora){
  const dt = Math.min((agora-ultimo)/1000, .25); ultimo = agora;
  const v = forca();
  if(v>0){
    cava(v*dt);
    /* a máquina bate sozinha: sem isso, "a broca assumiu" também fica invisível.
       O ritmo acelera com a produção e satura, pra não virar estroboscópio. */
    acumMaq += dt;
    const intervalo = Math.max(0.09, 0.9/Math.sqrt(v+1));
    if(acumMaq >= intervalo){
      acumMaq = 0;
      golpe(Math.min(0.28 + v*0.02, 0.7));
    }
  }
  capatazTrabalha(dt);
  desenha(dt); pinta();
  if(agora - salvoEm > 3000){ salvoEm = agora; salva(); }
  requestAnimationFrame(laco);
}

/* ---------------- entrada ---------------- */
function tocouCavar(){
  if(tocaChegada()) return;   /* na cena de chegada o toque avança a cena */
  const m = porToque();
  cava(m);
  golpe(1);
  sacode();
  sobeGanho('+'+fmt(m,2)+' m');
  const el=document.querySelector('.prof');
  el.classList.remove('bate'); void el.offsetWidth; el.classList.add('bate');
  vibra('toque');
  pinta();
}
elCavar.addEventListener('pointerdown', e=>{ e.preventDefault(); tocouCavar(); });
/* na chegada o toque vale na tela toda: numa cena de abertura a pessoa toca
   onde está olhando, não no botão */
cv.addEventListener('pointerdown', e=>{ if(!S.chegou){ e.preventDefault(); tocaChegada(); atualiza(); } });
