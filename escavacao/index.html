/* ---------------- a loja ---------------- */
let lojaAba = 'pe';   /* abre na Equipe: e a prateleira que muda a cena */
function abreLoja(){ lojaAba = lojaAba || 'eq'; pintaLoja(); document.getElementById('lojaFundo').classList.remove('off'); }
function fechaLoja(){ document.getElementById('lojaFundo').classList.add('off'); }
function abaLoja(a){ lojaAba = a; pintaLoja(); }

function pintaLoja(){
  const abas = [['pe','Equipe'],['eq','Equipamentos'],['ro','Roupas'],['ac','Acessórios']];
  let h = '<div class="lojatopo"><h2>Loja</h2>' +
    '<span class="moedas">'+fmt(S.moedas,0)+' <em>moedas</em></span></div>' +
    '<div class="abas">' + abas.map(function(a){
      return '<button class="'+(lojaAba===a[0]?'on':'')+'" onclick="abaLoja(\''+a[0]+'\')">'+a[1]+'</button>';
    }).join('') + '</div><div class="prateleira">';

  if(lojaAba === 'pe'){
    h += '<p class="lojanota">Há <b>'+povo()+'</b> '+(povo()===1?'pessoa':'pessoas')+' na operação.</p>';
    EQUIPE.forEach(function(e, idx){
      const q = nEq(e.id), cu = custoEq(e);
      if(idx > 0 && nEq(EQUIPE[idx-1].id) === 0 && q === 0) return;
      const cheio = e.max && q >= e.max;
      const pode = !cheio && S.moedas >= cu;
      h += '<button class="pit'+(pode?'':' off')+'"'+(pode?' onclick="contrata(\''+e.id+'\')"':'')+'>' +
        '<span class="pn">'+e.n+(q?' <i>x'+q+'</i>':'')+'</span>' +
        '<span class="pd">'+e.d+'</span>' +
        '<span class="pc">'+(cheio?'já contratado':fmt(cu,0)+' moedas')+'</span></button>';
    });
  } else if(lojaAba === 'eq'){
    EQUIP.forEach(function(m, idx){
      const q = qtd(m.id), cu = custo(m);
      /* o item só aparece quando o anterior já foi comprado: cardápio grande
         cedo demais paralisa em vez de convidar */
      if(idx > 0 && qtd(EQUIP[idx-1].id) === 0 && q === 0) return;
      const cheio = m.max && q >= m.max;
      const pode = !cheio && S.moedas >= cu;
      h += '<button class="pit'+(pode?'':' off')+'"'+(pode?' onclick="compraEquip(\''+m.id+'\')"':'')+'>' +
        '<span class="pn">'+m.n+(q?' <i>x'+q+'</i>':'')+'</span>' +
        '<span class="pd">'+m.d+'</span>' +
        '<span class="pc">'+(cheio?'no máximo':fmt(cu,0)+' moedas')+'</span></button>';
    });
  } else {
    const lista = (lojaAba==='ro') ? ROUPAS : ACESS;
    const campo = (lojaAba==='ro') ? 'roupa' : 'acess';
    lista.forEach(function(o){
      const tem = !!S.tem[o.id], usando = (S[campo] === o.id);
      const pode = !tem && S.moedas >= o.base;
      const acao = tem ? 'vesteItem' : (pode ? 'compraItem' : null);
      h += '<button class="pit'+(usando?' usando':'')+(acao?'':' off')+'"' +
        (acao?' onclick="'+acao+'(\''+campo+'\',\''+o.id+'\')"':'') + '>' +
        '<span class="pn">'+o.n+'</span><span class="pd">'+o.d+'</span>' +
        '<span class="pc">'+(usando?'em uso':(tem?'vestir':fmt(o.base,0)+' moedas'))+'</span></button>';
    });
  }
  h += '</div><div class="acoes"><button id="lojaFecha" onclick="fechaLoja()">Voltar a cavar</button></div>';
  document.getElementById('lojaPainel').innerHTML = h;
}
function contrata(id){
  const e = EQUIPE.find(function(x){ return x.id===id; }); if(!e) return;
  const cu = custoEq(e);
  if(S.moedas < cu) return;
  if(e.max && nEq(id) >= e.max) return;
  S.moedas -= cu;
  if(!S.equipe) S.equipe = {};
  S.equipe[id] = nEq(id)+1;
  vibra('compra'); salva(); pintaLoja(); pinta();
  mostraAchado('CONTRATADO', e.n, 'A operação tem '+povo()+' pessoas agora.');
}

function compraEquip(id){
  const m = EQUIP.find(function(x){ return x.id===id; }); if(!m) return;
  const cu = custo(m);
  if(S.moedas < cu) return;
  if(m.max && qtd(id) >= m.max) return;
  S.moedas -= cu; S.comprado[id] = qtd(id)+1;
  vibra('compra'); salva(); pintaLoja(); pinta();
}
function compraItem(campo, id){
  const lista = (campo==='roupa') ? ROUPAS : ACESS;
  const o = lista.find(function(x){ return x.id===id; }); if(!o) return;
  if(S.moedas < o.base) return;
  S.moedas -= o.base; S.tem[id] = 1; S[campo] = id;
  vibra('compra'); salva(); pintaLoja(); pinta();
}
function vesteItem(campo, id){
  if(!S.tem[id]) return;
  S[campo] = id; vibra('toque'); salva(); pintaLoja();
}

/* ---------------- painel ---------------- */
const fundo=document.getElementById('fundo');
const campos = {tap:'aTap', fragM:'aFrag', brocaC:'aBroca', brocaM:'aBrocaM',
  achado1:'aAchado', achado1F:'aAchadoF', curva:'aCurva', parede:'aParede', colapso:'aColapso'};

function abrePainel(){
  for(const k in campos) document.getElementById(campos[k]).value = cfg[k];
  btVib.setAttribute('aria-pressed', cfg.vib ? 'true' : 'false');
  EQUIP[0].base = cfg.brocaC;
  previa(); fundo.classList.remove('off');
}
function fechaPainel(){
  for(const k in campos){
    const v = parseFloat(document.getElementById(campos[k]).value);
    if(!isNaN(v)) cfg[k] = v;
  }
  EQUIP[0].base = cfg.brocaC;
  salva(); pinta(); fundo.classList.add('off');
}

/* a prévia é o ponto do painel: ela simula o 1º minuto com os números atuais */
function simula(){
  /* uma pessoa toca ~2,4x por segundo num botão desse tamanho */
  const TPS = 2.4;
  let prof=0, frag=0, t=0, tAchado=null, tBroca=null;
  const passo = 1/TPS;
  for(let i=0; i<600; i++){
    prof += cfg.tap; frag += cfg.tap * cfg.fragM; t += passo;
    if(tAchado===null && prof >= cfg.achado1){ frag += cfg.achado1F; tAchado = t; }
    if(tBroca===null && frag >= cfg.brocaC && tAchado!==null){ tBroca = t; break; }
  }
  return {tAchado, tBroca, profBroca:prof};
}
function previa(){
  for(const k in campos){
    const v = parseFloat(document.getElementById(campos[k]).value);
    if(!isNaN(v)) cfg[k] = v;
  }
  const s = simula();
  const okA = s.tAchado!==null && s.tAchado <= 30;
  const okB = s.tBroca!==null && s.tBroca <= 60;
  document.getElementById('previa').innerHTML =
    '<div class="r"><span>1º achado</span><b class="'+(okA?'bom':'ruim')+'">'+
      (s.tAchado===null?'nunca':'~'+Math.round(s.tAchado)+' s')+'</b></div>'+
    '<div class="r"><span>a broca assume</span><b class="'+(okB?'bom':'ruim')+'">'+
      (s.tBroca===null?'nunca':'~'+Math.round(s.tBroca)+' s')+'</b></div>'+
    '<div class="r"><span>alvo</span><b>achado &lt;30 s · broca &lt;60 s</b></div>';
}
for(const k in campos) document.getElementById(campos[k]).addEventListener('input', previa);

/* ---- operador + aviso de versão nova ---- */
(function(){
  if(!('serviceWorker' in navigator) || location.protocol==='file:') return;
  var recarregando=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(recarregando)return; recarregando=true; location.reload(); });

  function aviso(reg){
    if(document.getElementById('__upd')) return;
    var b=document.createElement('div'); b.id='__upd';
    b.style.cssText='position:fixed;left:50%;top:calc(160px + env(safe-area-inset-top));transform:translate(-50%,-10px);z-index:100000;display:flex;align-items:center;gap:11px;max-width:calc(100% - 28px);background:#1C160F;color:#F2E8D8;border:1px solid rgba(242,232,216,.16);border-radius:15px;padding:9px 9px 9px 14px;box-shadow:0 16px 40px rgba(0,0,0,.6);font-family:Barlow,system-ui,sans-serif;font-size:13.5px;font-weight:600;opacity:0;transition:opacity .28s ease,transform .28s cubic-bezier(.34,1.4,.5,1)';
    b.innerHTML='<span>Nova versão da mina</span><button id="__updb" style="border:none;cursor:pointer;font:inherit;font-weight:800;color:#191206;background:#F2B441;border-radius:11px;padding:9px 14px">Atualizar</button>';
    document.body.appendChild(b);
    requestAnimationFrame(function(){ b.style.opacity='1'; b.style.transform='translate(-50%,0)'; });
    document.getElementById('__updb').onclick=function(){
      this.textContent='Atualizando…'; this.disabled=true;
      try{ salva(); }catch(e){}          /* o progresso vai junto */
      if(reg.waiting){ reg.waiting.postMessage('SKIP_WAITING'); } else { location.reload(); }
    };
  }

  function vigia(reg){
    if(reg.waiting && navigator.serviceWorker.controller) aviso(reg);
    reg.addEventListener('updatefound',function(){
      var nv=reg.installing; if(!nv) return;
      nv.addEventListener('statechange',function(){
        if(nv.state==='installed' && navigator.serviceWorker.controller) aviso(reg); }); });
    setInterval(function(){ reg.update().catch(function(){}); }, 60000);
    function confere(){ reg.update().catch(function(){}); }
    document.addEventListener('visibilitychange',function(){ if(!document.hidden) confere(); });
    addEventListener('focus', confere);
    addEventListener('pageshow', confere);
  }
  addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(vigia).catch(function(){});
  });
})();
addEventListener('visibilitychange', ()=>{ if(document.hidden) salva(); });
